# yaml-language-server: $schema=https://static.stackra.figentra.com/schemas/runway/root.json
# Stackra file contract:
# Purpose: core's ROOT runway (ADR 0296): where Stackra's own deployables run and how they ship. Core deploys only
#          its own infrastructure (ADR 0170 decision 1): the static Worker (static.stackra.figentra.com), the registry
#          Worker (npm.stackra.figentra.com, ADR 0453), the Turborepo cache Worker (turbo.stackra.figentra.com,
#          ADR 0026), the docs (docs.stackra.figentra.com) and the @stackra/* packages on the Stackra registry. No
#          staging and no previews (ADR 0170 decisions 5 and 7 as they apply to Stackra), so `dev` and `production`
#          only. Each target names the caller workflow that deploys each of its members; `pnpm runway
#          plan|deploy|promote` reads them.
# Boundary: no member fact (a member's port and host are its own runway.yaml) and no secret value (ADR 0173): ids
#           here identify, they do not grant. `ref:<path>` resolves from the private stacks repository (ADR 0289
#           decision 9) once it exists. `workers/static` gets its member runway with gen (ADR 0284 decision 8).
# Runtime: CI; checked by `pnpm validate` (checkRunwayFiles) and read by `tools/scripts/runway.mjs`
# Governing contract: ADR 0002, 0026, 0168, 0170, 0173, 0177, 0184, 0185, 0284, 0289, 0296, 0299, 0453
$schema: "@stackra/runway/schema/root.json"
version: 3
project: stackra

# ── Providers ────────────────────────────────────────────────────────────────────────────────────────
providers:
  cloudflare:
    # The account of workers/static/wrangler.jsonc (ADR 0284 decision 7).
    accountId: d861f9ac9df28b7f0b1298cc0c89bc9d
    zones:
      figentra.com: ref:cloudflare.zones.figentraCom
  # The GitHub environments the deploy jobs run in. Their protection is applied by the owner (STA-605), later by the
  # Pulumi GitHub provider (ADR 0171 decision 8); the environment name is part of each job's OIDC subject.
  github:
    org: figentra
    repo: stackra
    environments:
      # Production Worker environments wait for a reviewer (STA-1585), as `release` does. TODO(owner): confirm the
      # reviewer; reuses `release`'s. `static` also runs deploy-turbo-cache.yml and the schema-tag deploys.
      static:
        branches: [main]
        tags: ["schemas@*"]
        reviewers: [figentra-usr]
      docs:
        branches: [main]
      release:
        branches: [main]
        reviewers: [figentra-usr]
      # deploy-registry.yml; its variables hold the D1 and KV ids and the Infisical identity (ADR 0453).
      registry:
        branches: [main]
        reviewers: [figentra-usr]
      # apply-observability.yml (STA-1573): `pulumi up` of infra-observability waits for the reviewer.
      observability:
        branches: [main]
        reviewers: [figentra-usr]
  infisical:
    # Infisical Cloud EU; the workspace id of .infisical.yaml, not a secret.
    domain: https://eu.infisical.com
    workspace: dd4724f4-7b9a-46ae-a899-b34af2d626b2
    environments:
      dev: dev
      production: prod
    paths:
      ci: /ci
      agents: /agents
  # The deploy reads the repository variable MINTLIFY_PROJECT_ID until the stacks repository holds it.
  mintlify:
    project: ref:mintlify.project
  # Better Stack runs uptime, on-call and the status page (ADR 0185). The account and its API tokens are the owner's
  # (STA-1574); the tokens live in Infisical `prod` `/ci/observability`, read by apply-observability.yml. Named, so
  # the plan declares Better Stack resources; it has no public id to state here.
  betterstack: {}
  # The Stackra registry every package publishes to (ADR 0453 decision 6); release.yml passes it to runway-npm.yml.
  npm:
    registry: https://npm.stackra.figentra.com/
    scope: "@stackra"

# ── Observability: @stackra/infra-observability, applied by apply-observability.yml (ADR 0184) ──
observability:
  # Core has no AWS account, so its logs keep no S3 cold archive; Workers Logs stay in Cloudflare.
  logs:
    coldMonths: 0
  # Probed from outside by Better Stack; a miss pages whoever is on call. Paths are each Worker's health route.
  uptime:
    # GET /-/ping, npm's health check (workers/registry/src/npm/handle-ping.ts).
    - name: registry
      url: https://npm.stackra.figentra.com/-/ping
      checkFrequencySeconds: 30
    - name: static
      url: https://static.stackra.figentra.com/
    # Every cache route needs the CI token; an unauthenticated status call answers 401 when the Worker is up and 503
    # when its settings are missing (workers/turbo-cache/src/cache/handle-request.ts).
    - name: turbo-cache
      url: https://turbo.stackra.figentra.com/v8/artifacts/status
      expectedStatusCodes: [401]
  # Unpublished until the owner picks the host (STA-1574); publishing is flipping `published` and adding customDomain.
  statusPage:
    subdomain: stackra
    companyName: Stackra
    companyUrl: https://docs.stackra.figentra.com
    timezone: Asia/Dubai
    published: false
    environments: [production]

# ── Environments ─────────────────────────────────────────────────────────────────────────────────────
environments:
  dev:
    destinations:
      services: compose
      web: vite-dev
      mobile: expo-dev
      docs: mint-dev
    # `encore run` serves the reference services from one process.
    topology:
      mode: monolith
  production:
    destinations:
      web: cloudflare-workers
      docs: mintlify
    domains:
      zone: figentra.com
      pattern: "${member}.stackra"
    # A merge to main deploys what it touched; `pnpm runway promote <sha>` redeploys a recorded SHA.
    deploy:
      on: merge-to-main
      gate: smoke

# ── Targets: the provider shape and the caller workflow per member ──────────────────────────────────
targets:
  # The reusable provider is .github/workflows/runway-cloudflare-workers.yml (ADR 0289 decision 1).
  cloudflare-workers:
    compatibilityDate: "2026-10-01"
    workflows:
      static: deploy-static.yml
      registry: deploy-registry.yml
      # stackra-turbo-cache (ADR 0026), turbo.stackra.figentra.com; runs in the `static` environment.
      turbo-cache: deploy-turbo-cache.yml
  # The reusable provider is .github/workflows/runway-mintlify.yml (ADR 0299).
  mintlify:
    deployOn: merge-to-main
    checks: [validate, broken-links, a11y]
    # The deploy branch runway force-pushes the generated site (apps/docs/.stackra/site) to, one orphan commit with a
    # `Source: <sha>` trailer (ADR 0002, 2026-10-27 amendment). Only CI writes it; the owner points the Mintlify
    # GitHub app at this branch, monorepo path at the root.
    branch: docs-site
    # The owner switches the Mintlify GitHub-app deploy off after the first CI deploy (STA-605).
    pushDeploy: false
    adminKey: MINTLIFY_ADMIN_KEY
    workflows:
      docs: deploy-docs.yml
  # The reusable provider is .github/workflows/runway-npm.yml. The registry's trusted publisher row names the calling
  # workflow, so it names release.yml; publishing is a GitHub OIDC exchange, with no token (ADR 0453 decision 6).
  npm:
    access: public
    provenance: true
    trustedPublisher: release.yml
    workflows:
      packages: release.yml

# ── Secrets: CI-only names read over OIDC from Infisical /ci; core has no runtime secret ────────────
secrets:
  sync: on-deploy
  ci:
    - CLOUDFLARE_API_TOKEN
    - MINTLIFY_ADMIN_KEY
    - HEROUI_AUTH_TOKEN
    - UNIWIND_AUTH_TOKEN

# ── Release policy (ADR 0170) ────────────────────────────────────────────────────────────────────────
release:
  promote:
    unit: sha
  gate:
    smoke: http
  strategy:
    kind: all-at-once
  # Rollback promotes the last good SHA; the owner triggers it.
  rollback:
    by: owner
    withinMinutes: 15
  # Every deploy job runs in a GitHub environment, so GitHub records each deployment.
  records: [github-deployments]
  buildOrder: [npm, cloudflare-workers, mintlify]
