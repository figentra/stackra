schema_version: "1.0"

preset:
  id: "stackra"
  name: "Stackra clarify-first workflow"
  version: "1.1.0"
  description: "Specs in .agents/specs/sta-<n>-<slug>, mandatory Impact questionnaire, clarifications marker, Linear link, and a plan gate"
  author: "stackra"
  license: "MIT"

requires:
  speckit_version: ">=1.0.0"

provides:
  templates:
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Spec with Impact questionnaire, Clarifications status and Linear fields"
      replaces: "spec-template"

    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Tasks carry a Linear issue column"
      replaces: "tasks-template"

    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Interview the Impact questionnaire and stop at clarify"
      strategy: "wrap"

    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "Flip the clarifications marker only when nothing is open"
      strategy: "wrap"

    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Refuse until the spec gate passes"
      strategy: "wrap"

    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Map tasks to Linear issues"
      strategy: "wrap"

    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Resolve the spec folder from the Linear key"
      strategy: "wrap"

    - type: "command"
      name: "speckit.checklist"
      file: "commands/speckit.checklist.md"
      description: "Resolve the spec folder from the Linear key"
      strategy: "wrap"

    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Resolve the spec folder from the Linear key"
      strategy: "wrap"

    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      description: "Resolve the spec folder from the Linear key"
      strategy: "wrap"

tags:
  - "stackra"
  - "governance"
