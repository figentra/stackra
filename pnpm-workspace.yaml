# Stackra file contract:
# Purpose: pnpm workspace membership plus the version catalogs every member's `catalog:`/`catalog:<name>`
#          references resolve against. A member's package.json never carries a literal version — it names a
#          catalog, so one bump here moves the whole repo. `pnpm validate` fails on any other specifier.
# Scope: every member under apps/*, packages/<category>/<name>, services/*, workers/*.
# Owner: release-operations (the owner reviews catalog changes)
# Secrets: forbidden
packages:
  - apps/*
  - packages/*/*
  - services/*
  # Cloudflare Worker members (ADR 0284): deployed, tier:app.
  - workers/*

# `strict`: `pnpm add` only accepts versions that already exist in a catalog — a new dependency is added
# here first, then referenced. tools/scripts/validate-repository.mjs enforces the same for hand edits.
catalogMode: strict

# Refuse an unsupported Node (engines). Lives here, not in .npmrc, so npm stops warning about pnpm-only keys;
# auto-install-peers, shamefully-hoist=false and strict-peer-dependencies=false are pnpm defaults.
engineStrict: true
# Several agents share one checkout: a `pnpm <script>` must never install on its own (a failed auto-install empties
# node_modules for everyone); it warns, and the integrator runs `pnpm install` once per wave.
verifyDepsBeforeRun: warn

# Default catalog (`catalog:`): shared by many members, no reason to fork a version per topic.
catalog:
  "@types/node": 26.6.4
  # YAML reader for repo-owned config (.agents/models.yaml, .mcp.yaml) read by tools/scripts.
  yaml: 2.9.1
  # HTTP client for tools/scripts' GitHub and Linear calls: an Agent with a 30 s connect timeout (STA-302).
  undici: 8.12.2
  # Runtime schemas: @stackra/validation, config and money, and the X$ schemas gen emits (ADR 0095).
  zod: 4.6.7
  # Apple Wallet pass signing in @stackra/integrations (stackra-41): PKCS#7 detached signatures over the pass manifest.
  # pkijs 3.x and its asn1js 3.x peer; BSD-3-Clause. Bump the pair together.
  asn1js: 3.1.0
  pkijs: 3.4.3
  # ICU messages for @stackra/i18n: CLDR plural categories (all six for Arabic), select, number and date
  # arguments behind formatMessage and useTranslation. BSD-3-Clause.
  intl-messageformat: 12.1.3
  # The S3/R2/MinIO disk of @stackra/filesystem (S3FileSystemDriver) and its SigV4 presigned temporary URLs.
  # Apache-2.0; bump the pair together.
  "@aws-sdk/client-s3": 3.1149.0
  "@aws-sdk/s3-request-presigner": 3.1149.0
  # The AWS Secrets Manager store of @stackra/config/node (BatchGetSecretValue). Apache-2.0; keep beside client-s3.
  "@aws-sdk/client-secrets-manager": 3.1149.0
  # The GCS disk of @stackra/filesystem (GcsFileSystemDriver, ADR 0354): objects and V4 signed URLs. Apache-2.0.
  "@google-cloud/storage": 8.4.0
  # @stackra/model on the server only (ADR 0014, 0227): Collection, Ref, custom Types and the Money embeddable.
  # The version the STA-335 entity-schema spike proved. MIT.
  "@mikro-orm/core": 7.2.5
  # The Postgres driver of @stackra/database beside core; bump the pair together. MIT.
  "@mikro-orm/postgresql": 7.2.5
  # @stackra/database ./testing: Factory data (MIT) and the usePostgres Testcontainers fixture (MIT, ADR 0269 d3).
  "@faker-js/faker": 10.6.0
  "@testcontainers/postgresql": 12.2.0
  # @stackra/database ./testing memory driver (ADR 0266): Postgres in WASM and its MikroORM driver; bump the latter with core. Apache-2.0 / MIT.
  "@electric-sql/pglite": 0.5.8
  "@mikro-orm/pglite": 7.2.5
  # The server-state cache of @stackra/query (ADR 0079 decision 1); the React adapter is ours. MIT, no dependencies.
  "@tanstack/query-core": 5.104.1
  # AI SDK core for @stackra/ai (ADR 0155, 0100; owner R-67 decide()). Apache-2.0; providers and the MCP gateway live in the ai service.
  ai: 7.0.137
  # The CRDT behind @stackra/collaboration shared documents (ADR 0270), kept behind its contracts port. MIT.
  yjs: 13.6.33
  # @stackra/seo Open Graph cards: satori lays the card out to SVG, resvg rasterises it to PNG. Both MPL-2.0.
  # satori stays on 0.36.0, the last release that exports `satori/yoga.wasm`, which the Worker driver imports.
  satori: 0.36.0
  "@resvg/resvg-wasm": 2.6.2
  # The Valkey/Redis client of @stackra/cache (RedisCacheDriver). MIT.
  iovalkey: 0.4.0
  # @stackra/achievements verifyQr: the verify URL as an SVG QR code. MIT, no dependencies.
  uqr: 0.1.3
  # @stackra/sandbox: QuickJS-WASM runs tenant JavaScript code steps (ADR 0154 decision 2). MIT.
  quickjs-emscripten: 0.32.0
  # @stackra/sandbox: Pyodide runs tenant Python code steps in the pool's processes (ADR 0154 d2, ADR 0434 d1). MPL-2.0.
  pyodide: 314.0.7

catalogs:
  # Toolchain that builds TypeScript output — a different risk/cadence than lint/format/test tools.
  build:
    typescript: 7.0.2
    tsdown: 0.23.1
    turbo: 2.11.9
    # The class-component compiler (ADR 0305 rules 37 to 41): a Babel plugin gen ships and vite-plugin, Metro and
    # tsdown run. Babel 8 ships its own types, so no @types/babel__* entries. The plugin reaches parser, traverse and
    # types through @babel/core (its `types` namespace), so they get no entries of their own.
    "@babel/core": 8.0.7
  # Root repo tooling that loads `typescript` as a JS API (tools/scripts/doc-standard.mjs), which TypeScript 7 (native)
  # does not ship yet. Members keep `tsc` from catalog:build; their own node_modules/.bin comes first on PATH.
  tooling:
    typescript: 6.0.3
    # The TypeScript 6 fallback host of @stackra/gen discovery (ADR 0294 d26), installed beside TypeScript 7.
    typescript6: npm:typescript@6.0.3
  # Format/lint/test tools every member's scripts run.
  quality:
    oxlint: 1.86.0
    oxfmt: 0.71.0
    vitest: 5.0.5
    "@vitest/coverage-v8": 5.0.3
    knip: 6.41.0
    # Copy-paste detector behind tools/scripts/duplication.mjs, the per-member ratchet of `pnpm validate` (rule-gap
    # B-9, stackra-235). 5.x is the Rust engine (platform binaries as optional dependencies); MIT.
    jscpd: 5.4.1
    # Test-only IndexedDB for @stackra/platform's share inbox. Apache-2.0.
    fake-indexeddb: 6.2.5
  # Release tooling: changesets, commitlint, git hooks.
  release:
    "@changesets/cli": 3.0.3
    "@changesets/changelog-git": 1.0.0
    "@commitlint/cli": 21.2.3
    "@commitlint/config-conventional": 21.2.3
    lefthook: 2.2.2
  # Web apps and React packages.
  frontend:
    react: 19.3.0
    react-dom: 19.3.0
    "@types/react": 19.3.0
    "@types/react-dom": 19.3.0
    vite: 8.3.3
    "@vitejs/plugin-react": 6.1.1
    tailwindcss: 4.3.3
    "@tailwindcss/vite": 4.3.3
    "@heroui/react": 3.2.6
    "@heroui/styles": 3.2.6
    # React Aria's I18nProvider for @stackra/ui/react (ADR 0302, owner-approved 2026-10-23); pinned to the version
    # @heroui/react 3.2.6 resolves its react-aria-components peer to, so both share one React Aria instance.
    react-aria-components: 1.22.1
    # Date values for @stackra/ui DateField and DatePicker (owner-approved 2026-10-24); pinned to the version
    # react-aria-components 1.22.1 and @heroui/react 3.2.6 already resolve, so one copy serves all three.
    "@internationalized/date": 3.12.4
    "@testing-library/react": 16.3.3
    "@testing-library/dom": 10.4.2
    # @stackra/testing's ./react and ./native entries (STA-348): the user-event companion of Testing Library and the
    # React Native renderer, newest stable releases at least two weeks old. MIT.
    "@testing-library/user-event": 14.6.7
    "@testing-library/react-native": 14.1.0
    jsdom: 30.1.0
    # Code-based routing for the console and every Vite app (no file routing anywhere).
    react-router: 7.18.4
    # HeroUI Pro for web (ADR 0310) and its optional peers (tiptap, maplibre-gl, the markdown set, shiki, recharts,
    # number-flow, embla, react-resizable-panels) moved with @stackra-pro/ui to figentra/stackra-pro (stackra-189);
    # no member here uses them (knip `catalog` is an error, stackra-235). motion stays: free members use it.
    motion: 12.43.0
    # Icons for @stackra/ui/react's Icon (ADR 0303 decision 3, owner-approved 2026-10-23); ISC licence.
    lucide-react: 1.54.0
    # Form state for @stackra/ui FormField (ADR 0055, accepted by ADR 0303); newest release at least 14 days old.
    react-hook-form: 7.89.0
    # Web and desktop keyboard driver of @stackra/shortcuts (owner decision R-66); pre-1.0, so bump deliberately. MIT.
    "@tanstack/hotkeys": 0.11.0
    # @stackra/vite-plugin's optional build plugins, each loaded only for its target. All MIT.
    # vite-plugin-pwa: the PWA injectManifest service worker (ADR 0255).
    vite-plugin-pwa: 2.0.0
    # Workers runtime for server rendering (ADR 0297); 1.63.0 is the release whose wrangler peer matches catalog:deploy.
    "@cloudflare/vite-plugin": 1.63.0
    # React Router framework mode (ADR 0165, 0297); kept on the react-router version above.
    "@react-router/dev": 7.18.4
    # Uploads hidden source maps to Sentry; reads SENTRY_AUTH_TOKEN itself.
    "@sentry/vite-plugin": 5.4.1
  # Expo SDK 57 app (apps/mobile). Pins match academorix/apps/mobile; react stays on 19.2.3 because
  # react-native 0.86 renders with that exact renderer version. Bump with `expo install --check`.
  mobile:
    expo: 57.0.30
    # The iOS scene lifecycle the iOS 27 SDK and resizable windows need (ios.enableSceneSupport, STA-461);
    # SDK 58 builds it in, so the entry and its plugin go with the SDK 58 bump (STA-460).
    expo-build-properties: 57.0.22
    # Code-based navigation (no expo-router routes): React Navigation 7 + Callstack's native tab bar,
    # which drives UITabBarController so iOS 26 draws the Liquid Glass tab bar.
    "@react-navigation/native": 7.5.1
    "@react-navigation/native-stack": 7.21.0
    react-native-bottom-tabs: 1.4.0
    "@bottom-tabs/react-navigation": 1.4.0
    expo-dev-client: 57.0.20
    expo-constants: 57.0.22
    expo-linking: 57.0.13
    # Hosted sign-in for @stackra/identity/native (openAuthSessionAsync). MIT; the SDK 57 bundled version.
    expo-web-browser: 57.0.3
    expo-splash-screen: 57.0.10
    expo-status-bar: 57.0.1
    expo-system-ui: 57.0.4
    expo-glass-effect: 57.0.4
    # Storage drivers for @stackra/storage (optional peers). MIT. MMKV 4.x has createMMKV and remove.
    react-native-mmkv: 4.3.2
    expo-secure-store: 57.0.4
    # Push permission and tokens for @stackra/platform/native (optional peer). MIT.
    expo-notifications: 57.0.22
    # Optional peers of @stackra/platform/native (connectivity, camera permission, haptics). MIT.
    "@react-native-community/netinfo": 12.0.1
    expo-camera: 57.0.6
    expo-haptics: 57.0.3
    babel-preset-expo: 57.0.16
    react: 19.2.3
    react-dom: 19.2.3
    react-native: 0.86.3
    # react-native-web (what `libraryPreset({ native })` aliases `react-native` to in jsdom) has no entry until the
    # first member that tests src/native adds it back with its devDependency (knip `catalog` is an error).
    react-native-screens: 4.26.2
    react-native-safe-area-context: 5.7.0
    react-native-gesture-handler: 2.32.0
    react-native-reanimated: 4.5.1
    react-native-worklets: 0.10.1
    react-native-svg: 15.15.4
    "@gorhom/bottom-sheet": 5.2.14
    heroui-native: 1.0.10
    # HeroUI Native Pro and its optional peers (Skia, victory-native, libphonenumber-js, pager-view, reanimated-dnd)
    # moved to figentra/stackra-pro with the Pro split (stackra-189); no member here uses them (stackra-235).
    # The two @internationalized packages stay: free members use them, pinned to what @heroui/react resolves.
    "@internationalized/date": 3.12.4
    "@internationalized/number": 3.6.9
    # Required native peer of Uniwind Pro 1.9.0 (>= 0.37.1), for the apps that run it (catalog:uniwind-pro).
    react-native-nitro-modules: 0.37.1
    # Icons for @stackra/ui/native's Icon (ADR 0303 decision 3, owner-approved 2026-10-23); ISC licence.
    lucide-react-native: 1.54.0
    # Platform date and time pickers for @stackra/ui/native DatePicker (owner-approved 2026-10-24); pinned to the
    # Expo SDK 57 version in expo's bundledNativeModules.json.
    "@expo/ui": 57.0.25
    uniwind: 1.12.1
    tailwind-merge: 3.7.0
    tailwind-variants: 3.3.1
    # The Expo CLI loads `typescript` as a JS API, which TypeScript 7 (native) does not ship yet.
    typescript: 6.0.3
    "@types/react": 19.2.18
  # Uniwind Pro (ADR 0310 decision 11): our own apps install it under the `uniwind` name, so every `uniwind` import in
  # the app, the workspace packages' included, runs on the Pro engine; free packages keep their free `uniwind` peer.
  # A shell like HeroUI Pro: its postinstall downloads the licensed build (a `uniwind-pro` login locally,
  # UNIWIND_AUTH_TOKEN in CI). 1.9.0 supports React Native 0.83-0.88 and Expo SDK 55-58.
  uniwind-pro:
    uniwind: npm:uniwind-pro@1.9.0
  # Electron desktop apps (tools/scaffold/templates/apps/desktop, MR7). electron serves @stackra/filesystem's types;
  # electron's postinstall downloads the binary, so the first desktop app also adds `electron: true` to allowBuilds
  # and puts back `electron-builder: 26.16.1`, which the template names and no member uses yet (knip `catalog` is an
  # error, stackra-235).
  desktop:
    electron: 44.9.1
  # Deploy CLIs. wrangler builds and deploys the Cloudflare Workers members (workers/static, ADR 0284); CI runs
  # `wrangler deploy` with a token from Infisical /ci, never from a file.
  # Pulumi providers for the infra-* packages (ADR 0171, ADR 0352); each pinned to a release at least two weeks old.
  infra:
    "@pulumi/aws": 7.50.0
    "@pulumi/cloudflare": 6.22.0
    # @stackra/infra-gcp gcpBaseline program. Apache-2.0; stays on 9.x until the program is checked against 10.x.
    "@pulumi/gcp": 9.37.1
    "@pulumi/github": 6.15.0
    "@pulumi/pulumi": 3.268.0
    "@pulumiverse/sentry": 0.0.9
    "@pulumiverse/zitadel": 0.2.0
    pulumi-better-uptime: 0.22.4
    pulumi-logtail: 3.1.4
  # @stackra/documents renderers (ADR 0365): docx writes right-to-left DOCX, uqr encodes QR codes. Both MIT.
  # Keep uqr equal to the default catalog's uqr.
  # @stackra/media (stackra-25): sharp compositing and fflate unzip at the versions the OSV overrides pin, and unpdf
  # for in-region PDF text extraction. Keep sharp and fflate equal to their overrides.
  media:
    # C2PA content credentials (stackra-26): native, Node 22 or later. 0.9.10, not 0.9.11: 0.9.11 was published the
    # day it was requested, and a native package waits at least a day like everything else (ADR 0019).
    "@contentauth/c2pa-node": 0.9.10
    fflate: 0.8.3
    sharp: 0.35.5
    unpdf: 1.9.1
  documents:
    docx: 9.10.0
    uqr: 0.1.3
  # @stackra/data-transfer streaming XLSX reader and writer (ADR 0367). MIT.
  exceljs:
    exceljs: 4.4.0
  deploy:
    wrangler: 4.148.0
  # Documentation site (apps/docs).
  docs:
    mint: 4.2.985
    # Overrides only (see `overrides`): mint's connectivity probe, on fetch instead of got.
    is-online: 12.0.2
    public-ip: 8.0.0
  # The playground's Playwright + axe tier (ADR 0302).
  e2e:
    "@playwright/test": 1.64.1
    "@axe-core/playwright": 4.14.0

# STA-169: `mint validate` (the docs build) first probes connectivity with is-online 10, which races three
# got 12 requests (via public-ip 5) under a 5 s timeout and cancels the losers. A got retry that fires after the
# cancel throws "The `onCancel` handler was attached after the promise settled" (sindresorhus/got#1489) from an
# event handler, which kills the process: the intermittent docs build failure in CI. is-online 12 and public-ip 8
# use fetch with AbortSignal, so no got request sits on that path. Even the newest mint still pins is-online
# 10.0.0; drop these when @mintlify/previewing depends on is-online >= 12 itself.
overrides:
  "@mintlify/previewing>is-online": "catalog:docs"
  "is-online>public-ip": "catalog:docs"
  # ADR 0174 (OSV-Scanner in the Quality Gate): transitive versions with known advisories are lifted to the first fixed
  # release of the same major. Each selector names the vulnerable range only, so a parent that moves past it on its own
  # drops out of the override; remove a line once no lockfile entry matches its range. Advisories without a same-major
  # fix are accepted in osv-scanner.toml with their reason.
  "@modelcontextprotocol/sdk@<1.32.0": "1.32.0"
  "adm-zip@<0.6.1": "0.6.1"
  "axios@>=1.0.0 <1.20.0": "1.20.0"
  "body-parser@>=1.0.0 <1.20.9": "1.20.9"
  "body-parser@>=2.0.0 <2.4.0": "2.4.0"
  "fast-uri@>=3.0.0 <3.1.9": "3.1.9"
  "fflate@>=0.7.0 <0.7.5": "0.7.5"
  "fflate@>=0.8.0 <0.8.3": "0.8.3"
  "figlet@<1.11.3": "1.11.3"
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  # 0.x: the fix ships only in the next minor; the parents (rehype-katex, micromark math) render docs math only.
  "katex@<0.18.2": "0.18.2"
  "postcss-selector-parser@>=6.0.0 <6.1.5": "6.1.5"
  "qs@>=6.0.0 <6.16.1": "6.16.1"
  # 0.x: the fix ships only in 0.35; the parents (favicons, sharp-ico, Mintlify prebuild, miniflare) use resize/encode.
  "sharp@<0.35.5": "0.35.5"
  "tar@>=7.0.0 <7.5.21": "7.5.21"
  "undici@>=7.0.0 <7.30.1": "7.30.1"
  # uuid 7 and 8 (xcode, exceljs) have no fixed release of their own; both call only v4() through the CommonJS entry,
  # which 11.1.1 still ships.
  "uuid@<11.1.1": "11.1.1"
  "zod@>=4.0.0 <4.6.6": "4.6.6"

# ADR 0310: the HeroUI Pro packages on npm are shells whose real package.json arrives with the postinstall download,
# so pnpm never sees their peers and links none: a Pro module then resolves the hoisted React of another catalog
# ("Invalid hook call"). These are the peers of the downloaded 1.0.0-beta.10 / 1.0.0-beta.11 package.json, copied
# verbatim; update them with each Pro bump. `@types/react` is ours, not Pro's: its .d.ts files import "react", and
# without a linked peer TypeScript finds the hoisted @types/react of the mobile catalog (19.2.18), so a consumer on the
# frontend catalog (19.3.0) sees two unrelated `Ref` types (TS2322 in ui-pro's NumberValue).
packageExtensions:
  # react-native-worklets 0.10.1's Babel plugin requires @babel/generator and @babel/traverse without declaring them,
  # so it resolves pnpm's hidden-hoisted copies: the Babel 8 ones that @babel/core of catalog:build brings. Babel 8's
  # generator cannot print the Babel 7 AST Metro hands it (TSFunctionType `parameters`), and every Reanimated worklet
  # with a function type fails the mobile build with "Cannot read properties of undefined (reading 'length')". Pin them
  # to Babel 7, the major of the @babel/core peer Metro runs; drop this when worklets declares them itself.
  react-native-worklets:
    dependencies:
      "@babel/generator": ^7.29.0
      "@babel/traverse": ^7.29.0
  "@heroui-pro/react":
    peerDependencies:
      "@types/react": ">=19.0.0"
      "@heroui/react": ">=3.2.6"
      "@heroui/styles": ">=3.2.6"
      "@number-flow/react": ">=0.5.0"
      "@react-aria/utils": ">=3.34.1"
      "@tiptap/core": ">=3.23.6"
      "@tiptap/extension-link": ">=3.23.6"
      "@tiptap/extension-underline": ">=3.23.6"
      "@tiptap/extensions": ">=3.23.6"
      "@tiptap/pm": ">=3.23.6"
      "@tiptap/react": ">=3.23.6"
      "@tiptap/starter-kit": ">=3.23.6"
      "@tiptap/suggestion": ">=3.23.6"
      embla-carousel: ">=8.6.0"
      embla-carousel-react: ">=8.6.0"
      maplibre-gl: ">=6.0.0"
      marked: ">=18.0.0"
      motion: ">=12.12.0"
      react: ">=19.0.0"
      react-aria: ">=3.52.1"
      react-aria-components: ">=1.21.1"
      react-dom: ">=19.0.0"
      react-markdown: ">=10.1.0"
      react-resizable-panels: ">=4.10.0"
      react-stately: ">=3.50.0"
      recharts: ">=2.0.0"
      remark-breaks: ">=4.0.0"
      remark-gfm: ">=4.0.0"
      shiki: ">=4.0.0"
      streamdown: ">=2.5.0"
      tailwind-merge: ">=3.4.0"
      tailwind-variants: ">=3.3.1"
      tailwindcss: ">=4.0.0"
    peerDependenciesMeta:
      "@types/react":
        optional: true
      "@tiptap/core":
        optional: true
      "@tiptap/extension-link":
        optional: true
      "@tiptap/extension-underline":
        optional: true
      "@tiptap/extensions":
        optional: true
      "@tiptap/pm":
        optional: true
      "@tiptap/react":
        optional: true
      "@tiptap/starter-kit":
        optional: true
      "@tiptap/suggestion":
        optional: true
      maplibre-gl:
        optional: true
      marked:
        optional: true
      react-markdown:
        optional: true
      remark-breaks:
        optional: true
      remark-gfm:
        optional: true
      streamdown:
        optional: true
      "@number-flow/react":
        optional: true
      embla-carousel:
        optional: true
      embla-carousel-react:
        optional: true
      recharts:
        optional: true
      shiki:
        optional: true
  heroui-native-pro:
    peerDependencies:
      "@internationalized/date": "^3.12.0"
      "@internationalized/number": "^3.6.6"
      "@shopify/react-native-skia": ">=2.0.0"
      heroui-native: "^1.0.10"
      libphonenumber-js: "^1.12.10"
      react-native-pager-view: ">=6.0.0"
      react-native-reanimated-dnd: ">=2.0.0"
      react-native-screens: ">=4.0.0"
      victory-native: "^41.20.2"
    peerDependenciesMeta:
      "@internationalized/date":
        optional: true
      "@internationalized/number":
        optional: true
      "@shopify/react-native-skia":
        optional: true
      libphonenumber-js:
        optional: true
      react-native-pager-view:
        optional: true
      react-native-reanimated-dnd:
        optional: true
      react-native-screens:
        optional: true
      victory-native:
        optional: true

# Dependency lifecycle scripts are blocked by default (pnpm supply-chain security). Every entry here was
# reviewed; a new one must be, too — install fails (ERR_PNPM_IGNORED_BUILDS) until it is.
allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  # Install-time telemetry pinger (pulled in by mint); never needed.
  "@scarf/scarf": false
  # Native OS-keychain binding used only by `mint login`; local preview and validation work without it.
  keytar: false
  # Cloudflare's Workers runtime, pulled in by wrangler (workers/static): its postinstall checks the platform binary that
  # `wrangler dev` runs. `wrangler deploy` does not need it, but a skipped check leaves `pnpm dev` broken.
  workerd: true
  # @stackra/filesystem needs only electron's types (ElectronFileSystemDriver); a library never runs the binary.
  # The first desktop app member flips this to true.
  electron: false
  # Pulled in by @sentry/vite-plugin: its postinstall only re-downloads the CLI binary that the platform
  # package (@sentry/cli-<os>) already installs as an optional dependency.
  "@sentry/cli": false
  # Pulled in by @testcontainers/postgresql: its install only builds an optional native cpu-features binding.
  ssh2: false
  cpu-features: false
  # Pulled in by @testcontainers/postgresql too: protobufjs wants a postinstall only for its CLI.
  protobufjs: false
  # HeroUI Pro (ADR 0310): the postinstall downloads the licensed build from HeroUI's CDN (a CLI login locally,
  # HEROUI_AUTH_TOKEN in CI); without it the package is an empty shell.
  "@heroui-pro/react": true
  heroui-native-pro: true
  # OS-keychain binding of the heroui-pro CLI (pulled in by the two above); it ships prebuilt binaries, so the
  # postinstall reads a `heroui-pro login` session without building it.
  "@zowe/secrets-for-zowe-sdk": false
  # Uniwind Pro, installed under the `uniwind` alias: both names, as Uniwind's docs say for pnpm.
  uniwind: true
  uniwind-pro: true
  # C2PA (stackra-26): its postinstall fetches or builds the native binding. Off until a run that needs the binding
  # proves it and the owner approves the download; the batch's tests run on recorded fixtures.
  "@contentauth/c2pa-node": false
  # Skia (STA-416, native charts): the postinstall copies the prebuilt Apple and Android libraries from its own
  # platform packages into libs/, with no download; the native build needs them.
  "@shopify/react-native-skia": true

minimumReleaseAgeExclude:
