# markdownlint: structure checks for Markdown and MDX. Formatting (wrapping, spacing, tables) is
# oxfmt's job, so rules that overlap with the formatter are off.
default: true
MD013: false # line length: oxfmt wraps prose at 100 columns
MD033: false # inline HTML: Mintlify MDX components and README banners
MD041: false # first line heading: MDX files start with frontmatter
MD024:
  siblings_only: true # repeated headings are fine in different sections
