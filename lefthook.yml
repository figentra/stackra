# yaml-language-server: $schema=./node_modules/lefthook/schema.json
# Stackra file contract:
# Purpose: git hooks — pre-commit format/lint on staged files and a secret scan, commit-msg conventional
#          commits, pre-push typecheck. Installed by `pnpm install` (prepare → lefthook install).
#          Hooks are advisory; the GitHub Actions Quality Gate workflow (.github/workflows/ci.yml) is the gate.
# Owner: release-operations
# Secrets: forbidden

pre-commit:
  parallel: true
  jobs:
    - name: oxfmt
      # every type oxfmt formats (CONTRIBUTING.md, "Formatting"); .oxfmtrc.jsonc ignores the rest
      glob:
        - "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}"
        - "*.{json,jsonc,json5,yaml,yml,toml,md,mdx}"
        - "*.{css,scss,less,html,graphql,vue}"
      # --check, not --write: stage_fixed made lefthook stash unstaged work, which conflicts while the loop
      # edits other members mid-commit (see apps/docs/src/agents/concurrent-sessions.mdx); the gate formats a member before it passes.
      # oxfmt exits 2 when every staged file is on its ignore list (pnpm-lock.yaml alone): that is not a finding.
      run: sh -c 'pnpm exec oxfmt --check "$@"; s=$?; [ $s -eq 2 ] && exit 0; exit $s' -- {staged_files}
    - name: shfmt
      glob: "*.sh"
      exclude:
        - ".specify/**"
      # oxfmt has no shell support; shfmt reads .editorconfig. Same advisory fallback as gitleaks.
      run: |
        if command -v shfmt >/dev/null 2>&1; then
          shfmt -d {staged_files}
        else
          echo "shfmt not installed (mise install) — CI still checks"
        fi
    - name: oxlint
      glob: "*.{ts,tsx,js,mjs,cjs}"
      exclude:
        - ".agents/skills/**"
        - ".agents/reference/**"
      run: pnpm exec oxlint {staged_files}
    - name: gitleaks
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks protect --staged --config .gitleaks.toml --no-banner --redact
        else
          echo "gitleaks not installed (mise install) — CI still scans"
        fi

commit-msg:
  jobs:
    # The preset builds to dist for its tarball; a commit reads its src instead, so it needs no build (ADR 0025).
    - name: commitlint
      run: NODE_OPTIONS=--conditions=@stackra/source pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: typecheck
      run: pnpm typecheck
    # Warns on a non-Linear branch (ADR 0065 D5); never blocks, since a chore-lane PR may use any branch.
    - name: spec-branch
      run: node tools/scripts/spec-gate.mjs branch
