# yaml-language-server: $schema=https://static.stackra.figentra.com/schemas/runway/app.json
# Stackra file contract:
# Purpose: what the docs member needs (ADR 0299 decision 6, ADR 0296 decision 1): its dev port and its public host.
#          The root runway places it on the `cloudflare-workers` destination (ADR 0514, STA-2026);
#          `.github/workflows/deploy-docs.yml` ships it as the `stackra-docs` Worker (apps/docs/wrangler.jsonc).
# Boundary: no root fact and no secret: the Cloudflare token is CI's, never the member's.
# Governing contract: ADR 0296, ADR 0299, ADR 0002 (2026-10-27 amendment), ADR 0514
$schema: "@stackra/runway/schema/app.json"
version: 3

environments:
  dev:
    # `stackra dev` passes it to the React Router dev server in .stackra/site (package.json `dev`).
    port: 3333
  production:
    domain: docs.stackra.figentra.com
