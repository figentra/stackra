# yaml-language-server: $schema=https://static.stackra.figentra.com/schemas/runway/app.json
# Stackra file contract:
# Purpose: the mobile app's Metro port in dev (ADR 0296 decision 1); `stackra gen` writes its `.claude/launch.json`
#          and VS Code `dev: mobile` entries from it.
# Boundary: no root fact and no secret. The `dev` script (`expo start`, a dev client because expo-dev-client is
#           installed) listens on Expo's default 8081, which this states.
# Governing contract: ADR 0296, ADR 0295 (amendment of 2026-11-03), STA-2081
$schema: "@stackra/runway/schema/app.json"
version: 3

environments:
  dev:
    mobile:
      metroPort: 8081
