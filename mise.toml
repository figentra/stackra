# Stackra file contract:
# Purpose: pins the toolchain versions every contributor and CI job runs. `pnpm` here must match
#          `packageManager` in package.json (corepack reads that one); a mismatch is a bug, not a choice.
# Scope: repository-wide
# Owner: release-operations
# Secrets: forbidden
[tools]
node = "24"
pnpm = "12.6.0"
gitleaks = "8.30.1"
# Developer-machine CLIs the repo calls. Not pinned here (no mise backend carries them):
#   opencode (v2 installer: https://opencode.ai/install), encore (brew install encoredev/tap/encore), aws, claude.
# mise `infisical` reads .infisical.yaml from 0.44 on; maestro also needs a JDK on PATH.
"github:Infisical/cli" = "0.44.2"
"aqua:astral-sh/uv" = "0.11.16"
"github:mobile-dev-inc/maestro" = "cli-2.10.0"
# spec-kit's `specify` (ADR 0121 D15): upgrade only in a dedicated PR, together with `.specify/init-options.json`
# `speckit_version`, then `pnpm speckit:sync` and `pnpm validate` (the spec-gate tripwire catches a broken wrap).
"pipx:specify-cli" = "1.0.10"

[env]
# Bedrock profile for OpenCode (amazon-bedrock/*); `aws sso login --profile bedrock` refreshes it.
AWS_PROFILE = "bedrock"
NODE_ENV = "development"
