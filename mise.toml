#:schema https://mise.jdx.dev/schema/mise.json
# Stackra file contract:
# Purpose: pins the toolchain versions every contributor and CI job runs. `pnpm` here must match
#          `packageManager` in package.json (corepack reads that one); a mismatch is a bug, not a choice.
# Scope: repository-wide
# Owner: release-operations
# Secrets: forbidden
[tools]
node = "24.22.0" # ADR 0019 D3: exact
pnpm = "12.16.1"
gitleaks = "8.30.1"
# shell formatter for *.sh (oxfmt has no shell support); reads .editorconfig
shfmt = "3.14.1"
# The commit hooks' linter and formatter, so lefthook runs them without a workspace install (STA-1865). Same
# versions as `catalog:quality` in pnpm-workspace.yaml; `stackra check`'s tool-pins finding keeps the two in step.
"npm:oxlint" = "1.86.0"
"npm:oxfmt" = "0.71.0"
# Supply-chain checks of the Quality Gate (ADR 0019, ADR 0174; STA-310, STA-311): workflow lint, workflow security
# lint (zizmor, policy in .github/zizmor.yml) and the lockfile vulnerability scan. Trivy and cosign run only in the
# Runway release workflow, pinned there (`mise exec <tool>@<version>`).
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.31.1"
"aqua:google/osv-scanner" = "2.7.0"
# Developer-machine CLIs the repo calls. Not pinned here (no mise backend carries them):
#   opencode (v2 installer: https://opencode.ai/install), encore (brew install encoredev/tap/encore), aws, claude.
# mise `infisical` reads .infisical.yaml from 0.44 on; maestro also needs a JDK on PATH.
"github:Infisical/cli" = "0.44.2"
"aqua:astral-sh/uv" = "0.11.16"
"github:mobile-dev-inc/maestro" = "cli-2.10.0"
# The aws CLI's Session Manager plugin: `stackra testbed` reaches the boxes by SSH through SSM (STA-1953).
"aqua:aws/session-manager-plugin" = "1.2.896.0"

[env]
# Workstation-only values (NODE_ENV=development, AWS_PROFILE=bedrock for OpenCode); unset in CI, where a template could
# only make them empty (STA-1957, STA-2021).
_.source = "./tools/scripts/mise-env.sh"
