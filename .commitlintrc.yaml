# Stackra file contract:
# Purpose: commitlint config for the lefthook commit-msg hook and the Quality Gate. The rules live in the
#          @stackra/commitlint-config preset; this repo only turns the issue-key rule on with its Linear prefix
#          (ADR 0065 rule 4: feat/fix/refactor/perf commits carry a `Refs: STA-n` footer).
# Owner: docs-governance
# Secrets: forbidden
extends:
  - "@stackra/commitlint-config"
rules:
  refs-issue-key:
    - 2
    - always
    - STA
