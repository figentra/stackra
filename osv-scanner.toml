# Stackra file contract:
# Purpose: OSV-Scanner policy for the Quality Gate's dependency scan (`osv-scanner scan source --lockfile=pnpm-lock.yaml`,
#          ADR 0174, STA-310). Every fixable advisory is fixed through pnpm-workspace.yaml (catalog or `overrides`); an
#          entry here is an advisory with no same-major fix, named by id or by exact package version, with its reason and
#          a date to look again.
# Scope: pnpm-lock.yaml
# Owner: release-operations
# Secrets: forbidden

# zod 3.x: the fix ships only in zod 4 (4.6.6). The 3.x copies come from dev tooling only, never from a published
# package: the Mintlify docs CLI (@mintlify/scraping, @mintlify/validation, zod-to-json-schema 3.20) and Expo's CLI.
# Forcing zod 4 under parents written for 3 breaks them. Our own zod is catalog 4.6.7.
[[PackageOverrides]]
name = "zod"
version = "3.24.0"
ecosystem = "npm"
vulnerability.ignore = true
reason = "GHSA-mrhx-c7xc-m3w5: fixed only in zod 4; dev-only parents (Mintlify CLI) need zod 3"
effectiveUntil = 2027-01-31

[[PackageOverrides]]
name = "zod"
version = "3.25.76"
ecosystem = "npm"
vulnerability.ignore = true
reason = "GHSA-mrhx-c7xc-m3w5: fixed only in zod 4; dev-only parent (@expo/cli) needs zod 3"
effectiveUntil = 2027-01-31

# deepmerge: no fixed release exists (4.3.1 is the latest). Only build tooling merges with it, over config objects
# we write: Expo's config loader (@expo/config) and Rollup's node-resolve plugin. No runtime package depends on it.
[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = 2027-01-31
reason = "deepmerge mergeObject prototype poisoning: no fixed release; build-time only via @expo/config and @rollup/plugin-node-resolve"

# glob 9 to 13: the fix ships only in glob 14. No Stackra member depends on glob; the copies come from build and test
# tooling (rimraf, test runners, docs and Expo CLIs) walking our own trees, and none passes a caller's AbortSignal.
[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
ignoreUntil = 2027-01-31
reason = "glob AbortSignal cancellation bypass: fixed only in glob 14; tooling-only, globs over our own trees"

# minimatch 3 to 10: the fix ships only in minimatch 11. No Stackra member depends on minimatch; tooling matches the
# repository's own patterns with it, never a pattern from user input.
[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-01-31
reason = "minimatch globparts amplification DoS: fixed only in minimatch 11; tooling-only, our own patterns"
