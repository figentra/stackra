# Stackra file contract:
# Purpose: OSV-Scanner policy for the CI dependency scan (`osv-scanner scan source --lockfile=pnpm-lock.yaml
#          --licenses=<.github/licence-allowlist.yaml>`, ADR 0174 decision 3, STA-310, STA-1735). Advisories: every
#          fixable advisory is fixed through pnpm-workspace.yaml (catalog or `overrides`); an entry here is an advisory
#          with no same-major fix, named by id or by exact package version, with its reason and a date to look again.
#          Licences: an entry is either a correction (deps.dev reports no licence, the published tarball states an
#          allowed one: `license.override`, exact version) or a reviewed exception to the allow-list (`license.ignore`,
#          naming the ruling that approved it). Each has its reason and a date to look again.
# Scope: pnpm-lock.yaml
# Owner: release-operations
# Secrets: forbidden

# zod 3.x: the fix ships only in zod 4 (4.6.6). The one 3.x copy comes from Expo's CLI (dev tooling), never from a
# published package; forcing zod 4 under a parent written for 3 breaks it. Our own zod is catalog 4.6.7, every
# published @stackra/actions version declares zod 4.6.7, and the `zod@>=4.0.0 <4.6.6` override in pnpm-workspace.yaml
# keeps a 4.x copy below the fix out of the lockfile (STA-1735).
[[PackageOverrides]]
name = "zod"
version = "3.25.76"
ecosystem = "npm"
vulnerability.ignore = true
reason = "GHSA-mrhx-c7xc-m3w5: fixed only in zod 4; dev-only parent (@expo/cli) needs zod 3"
effectiveUntil = 2027-01-31

# deepmerge: no fixed release exists (4.3.1 is the latest). Only build tooling merges with it, over config objects
# we write: Expo's config loader (@expo/config) and Rollup's node-resolve plugin. No runtime package depends on it.
[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = 2027-01-31
reason = "deepmerge mergeObject prototype poisoning: no fixed release; build-time only via @expo/config and @rollup/plugin-node-resolve"

# glob 9 to 13: the fix ships only in glob 14. No Stackra member depends on glob; the copies come from build and test
# tooling (rimraf, test runners, docs and Expo CLIs) walking our own trees, and none passes a caller's AbortSignal.
[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
ignoreUntil = 2027-01-31
reason = "glob AbortSignal cancellation bypass: fixed only in glob 14; tooling-only, globs over our own trees"

# minimatch 3 to 10: the fix ships only in minimatch 11. No Stackra member depends on minimatch; tooling matches the
# repository's own patterns with it, never a pattern from user input.
[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-01-31
reason = "minimatch globparts amplification DoS: fixed only in minimatch 11; tooling-only, our own patterns"

# ---------------------------------------------------------------------------------------------------------------------
# Licences (ADR 0174 decision 3; the allow-list is .github/licence-allowlist.yaml).
# ---------------------------------------------------------------------------------------------------------------------

# Corrections. deps.dev reports no licence for these exact versions, but the published tarball states an allowed one:
# a legacy `licenses` array (ssh2 and its build helpers), a `SEE LICENSE IN LICENSE` field over an MIT text, or no
# field beside an MIT LICENSE file. Each is pinned to the version that was read, so a new version is checked afresh.

[[PackageOverrides]]
name = "ssh2"
version = "1.17.0"
ecosystem = "npm"
license.override = ["MIT"]
reason = "package.json `licenses: [{type: MIT}]` and an MIT LICENSE; via @testcontainers/postgresql (tests)"
effectiveUntil = 2027-05-31

[[PackageOverrides]]
name = "cpu-features"
version = "0.0.10"
ecosystem = "npm"
license.override = ["MIT"]
reason = "package.json `licenses: [{type: MIT}]` and an MIT LICENSE; optional native helper of ssh2 (tests)"
effectiveUntil = 2027-05-31

[[PackageOverrides]]
name = "buildcheck"
version = "0.0.7"
ecosystem = "npm"
license.override = ["MIT"]
reason = "package.json `licenses: [{type: MIT}]` and an MIT LICENSE; build helper of cpu-features (tests)"
effectiveUntil = 2027-05-31

[[PackageOverrides]]
name = "@logdna/tail-file"
version = "2.2.0"
ecosystem = "npm"
license.override = ["MIT"]
reason = "`SEE LICENSE IN LICENSE`, and the LICENSE is the MIT text; via @pulumi/pulumi (infra tooling)"
effectiveUntil = 2027-05-31

[[PackageOverrides]]
name = "@contentauth/c2pa-types"
version = "0.7.6"
ecosystem = "npm"
