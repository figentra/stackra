# Reviewed exceptions: licences off the allow-list, approved by the CTO's licence ruling of 2026-11-24 (STA-2761) on
# top of the owner's decision of 2026-11-01 (STA-1589). The ruling named the Linux x64 binary of libvips and of the
# Sentry CLI, the ones the gate installs; the other platform packages are the same library and the same licence, built
# for another OS, and the lockfile records all of them. buffers@0.1.1 (no licence anywhere) has no exception: the
# ruling denies it, and STA-2781 removes it from the tree.

