# Stackra file contract:
# Purpose: the consumers `stackra consumer-gate` gates every core train against (STA-1813): repository, a pinned commit
#          SHA and the day it was set (`pinned`), the services to gate, and the services whose manifests are overlaid
#          from the caller's `--overlays` directory because the product does not hold them. A pin moves only by a
#          reviewed pull request; the summary flags a pin older than 14 days (or undated) as stale.
#          A product has `ref` (one commit for all its services) or `pins` (a commit per service, when the services sit
#          on separate pull requests); services with different pins are gated one pin at a time with `--services`.
#          A `kind: scaffold` entry is not a product repository: `repo` and `ref` name the starter template, and the
#          gate makes the app the way a user does (`stackra create --starter <checkout> --tarballs`, core's own built
#          CLI), adds `service` with `stackra new service --data`, copies the `fixture` folder (an action with its
#          schemas, test and permissions, a model with a migration) into it, adds `dependencies` to that service's
#          package.json as a user's `pnpm add` would, and gates it in pack mode. `.github/workflows/consumer-gate.yml`
#          runs it (STA-2705); the products run by hand or on the testbed, since their repositories and overlays are
#          private.
# Boundary: data only; the command never fetches, so the caller clones each repository at its pin
#           (`stackra consumer-gate --product <name> --pin` prints `<repo> <ref>`).
# Owner: release-operations · Secrets: forbidden
# The product pins are the tips the 2026-11-01 hand-run gates ended on; the products held nothing on main then, and
# their repositories are not readable from stackra-inc CI (STA-2705), so they stay stale until one is moved by hand.
products:
  billing:
    repo: figentra/billing
    pinned: "2026-11-01"
    pins:
      billing: "1139925"
      entitlements: c605e78
      usage: aacd450
    services:
      - billing
      - entitlements
      - usage
    overlays:
      - tenancy
      - invoicing
      - payments
      - entitlements # usage consumes it (client_service_unknown entitlements) when it is not gated with billing
  pay:
    repo: figentra/pay
    pinned: "2026-11-01"
    ref: 58528f4
    services:
      - payments
      - payments-ledger
    overlays:
      - tenancy
      - integrations
  invoicing:
    repo: figentra/invoicing
    pinned: "2026-11-01"
    ref: 30310f9
    services:
      - invoicing
    overlays:
      - tenancy
  tamo:
    repo: figentra/tamo
    pinned: "2026-11-01"
    ref: 0c52fd6
    services:
      - tamo
    overlays:
      - identity
  # The scaffold pin is template main of 2026-11-26. A run at it is RED at install (catalog entries the starter lacks,
  # STA-2870); past install, format (STA-2869), spell (STA-2870) and validate (STA-2871) are red too, all under
  # STA-2839. The gate is advisory until then (runbooks/release.mdx): once those and STA-2794 land, move this pin by a
  # reviewed pull request to a template commit where one full run is green, and link that run in the pull request.
  scaffold:
    kind: scaffold
    mode: pack
    repo: stackra-inc/stackra-template
    ref: d78a4fa8d52865e4cdaa22333d8d19934eddcf46
    pinned: "2026-11-26"
    profile: minimal
    service: gate-example
    fixture: tools/consumer-gate/scaffold-fixture
    dependencies:
      "@stackra/actions": "catalog:stackra"
      "@stackra/iam": "catalog:stackra"
      "@stackra/queue": "catalog:stackra"
      "@stackra/scheduler": "catalog:stackra"
    services:
      - example
      - gate-example
