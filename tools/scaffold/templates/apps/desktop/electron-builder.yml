# Stackra file contract:
# Purpose: electron-builder packaging for @figentra/{{NAME}} (MR7). Signing, notarisation and the update feed are
#          wired by the release pipeline (MR7-MR9: macOS notarisation, Azure Trusted Signing, electron-updater from
#          R2 with beta/stable channels and staged rollouts); credentials come from Infisical, never this file.
# Owner: the app owner · Secrets: forbidden
appId: com.figentra.stackra.{{NAME}}
productName: "{{TITLE}}"
directories:
  output: release
files:
  - dist/**
  - src/renderer/**
mac:
  category: public.app-category.productivity
  icon: node_modules/@stackra/brand/assets/public/app-icon/app-icon-light-1024.png
  hardenedRuntime: true
  target: [dmg, zip]
win:
  target: [nsis]
  icon: node_modules/@stackra/brand/assets/public/app-icon/app-icon-light-1024.png
linux:
  target: [AppImage]
  icon: node_modules/@stackra/brand/assets/public/app-icon/app-icon-light-1024.png
