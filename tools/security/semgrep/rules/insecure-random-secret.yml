# Stackra file contract:
# Purpose: Semgrep rule `stackra.insecure-random-secret`: `Math.random()` behind a token, secret, nonce, code or key.
#          Use `crypto.getRandomValues` or `crypto.randomUUID`.
#          Fixture: ../__tests__/__fixtures__/insecure-random-secret.ts (`pnpm security:sast --test`).
# Scope: TypeScript under apps, packages, services, workers (tools/scripts/security-scan.mjs)
# Owner: release-operations
# Secrets: forbidden
rules:
  - id: stackra.insecure-random-secret
    languages: [typescript]
    severity: ERROR
    message: >-
      `Math.random()` is predictable and must not make a token, secret, nonce, code or key. Use
      `crypto.getRandomValues` or `crypto.randomUUID()`.
    metadata:
      category: security
      cwe: ["CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      references: ["https://developer.mozilla.org/en-US/docs/Web/API/Crypto/getRandomValues"]
    pattern-either:
      # a value named like a secret: `const resetToken = …`, `{ inviteCode: … }`, `this.nonce = …`
      - patterns:
          - pattern-either:
              - pattern: const $NAME = $E
              - pattern: let $NAME = $E
              - pattern: $NAME = $E
              - pattern: $OBJ.$NAME = $E
              - pattern: "{..., $NAME: $E, ...}"
          - metavariable-regex:
              metavariable: $NAME
              regex: "(?i).*(token|secret|nonce|passw|otp|salt|api_?key|csrf|verifier|challenge|session_?id|invite_?code|reset_?code|signing)"
          - metavariable-pattern:
              metavariable: $E
              pattern: <... Math.random() ...>
          - focus-metavariable: $E
      # a function or method named like a secret maker: `makeNonce()`, `generateToken()`
      - patterns:
          - pattern-either:
              - pattern-inside: function $NAME(...) { ... }
              - pattern-inside: |
                  class $C {
                    ...
                    $NAME(...) { ... }
                    ...
                  }
          - pattern: Math.random()
          - metavariable-regex:
              metavariable: $NAME
              regex: "(?i).*(token|secret|nonce|passw|otp|salt|api_?key|csrf|verifier|challenge|session_?id|invite_?code|reset_?code|signing)"
