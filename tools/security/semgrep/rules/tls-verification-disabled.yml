# Stackra file contract:
# Purpose: Semgrep rule `stackra.tls-verification-disabled`: a TLS client told not to check the peer's certificate.
#          Fixture: ../__tests__/__fixtures__/tls-verification-disabled.ts (`pnpm security:sast --test`).
# Scope: TypeScript under apps, packages, services, workers (tools/scripts/security-scan.mjs)
# Owner: release-operations
# Secrets: forbidden
rules:
  - id: stackra.tls-verification-disabled
    languages: [typescript]
    severity: ERROR
    message: >-
      TLS certificate checks are turned off, so anyone on the path can read and change the traffic. Trust a private
      CA with `ca:` instead; never `rejectUnauthorized: false` or `NODE_TLS_REJECT_UNAUTHORIZED=0`.
    metadata:
      category: security
      cwe: ["CWE-295: Improper Certificate Validation"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      references: ["https://nodejs.org/api/tls.html#tlsconnectoptions-callback"]
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: "{..., checkServerIdentity: () => undefined, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = $V
      - pattern: process.env["NODE_TLS_REJECT_UNAUTHORIZED"] = $V
