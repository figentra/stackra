# Stackra file contract:
# Purpose: the reviewed list of every test that does not always run (ADR 0182 decision 4, the flaky-test quarantine;
#          STA-2842). `stackra validate --repository` reads every `skip`, `todo`, `fixme`, `fails`, `skipIf` and
#          `runIf` marker in the test files and fails on one that is not listed here, so a test that stops running
#          shows in this file's diff and is reviewed. A committed `only` is always a finding.
#          `gates`: an environment gate (`skipIf` / `runIf`), keyed `<test file>` then the title its call names, with
#          the reason it only runs where it does.
#          `quarantine`: a test taken out because it is flaky or broken (any marker), keyed the same way, with its
#          Linear `issue`, its `reason` and an `until` date (YYYY-MM-DD) at most 30 days out. A quarantine past its
#          `until` fails the gate: fix the test and remove the marker, or renew the date under the issue. An entry no
#          marker matches any more is a finding too.
# Owner: release-operations · Secrets: forbidden
