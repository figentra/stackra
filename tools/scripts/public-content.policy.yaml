# The public-content policy of this repository, read by guard-public-content.mjs (STA-2911): what the guard does not
# read. An invalid entry stops the guard (exit 2), so a typo never turns it off. Keep it short.
#
# No denied term and no hash of one goes here: a hash of a short name is recovered by hashing guesses, so it would
# publish the name. The denied terms are in a private policy outside this repository (`deny` entries, from
# `node tools/scripts/guard-public-content.mjs --hash <term>`), which the guard reads from `--private-policy <file>` or
# the file PUBLIC_CONTENT_PRIVATE_POLICY_FILE names; the public policy refuses a `deny` key.
#
# allow: what the guard does not read, each with why and the issue that removes it:
# - path: a repository path (`dir/**` or exact): the whole file, unread.
# - path + lineSha256: one line of that exact file, by the SHA-256 of its text (`--hash-line <path>:<n>` prints
#   it); the guard reports the entry once the line is gone.
# - package: a tarball's package name (`--pack`).
allow:
  - path: "packages/developer/cli/**"
    reason: "The CLI, doctor and starter are scrubbed on their own branch, which owns these files."
    issue: "STA-2790"
  - package: "@stackra/cli"
    reason: "The CLI's tarball, until its sources are scrubbed on their own branch."
    issue: "STA-2790"
  - path: "workers/registry/migrations/**"
    reason: "Applied D1 migrations are never edited once applied (their file contract); the registry worker is not published."
    issue: "STA-2876"
  - path: ".agents/specs/sta-1623-mobile-onboard/**"
    reason: "A spec older than the ADR 0502 shape: the spec gate refuses any edit to it until it is reshaped or the gate lets a prose-only edit through."
