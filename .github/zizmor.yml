# Stackra file contract:
# Purpose: zizmor's policy for `.github/workflows`, passed explicitly by the Quality Gate
#          (`zizmor --config .github/zizmor.yml .github/workflows`). ADR 0019 D1: every action and reusable workflow is
#          pinned to a full commit SHA, including the `actions/*` and `github/*` namespaces zizmor would accept at a
#          tag; the Runway workflows (ADR 0168) are called by local path here and by SHA from other repositories.
#          An accepted finding is an `ignore:` entry naming one `file:line` and its reason, never a whole rule or file.
# Scope: .github/workflows
# Owner: release-operations
# Secrets: forbidden
rules:
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
  # zizmor 1.31 audits; each accepted finding names one file:line and its reason.
  artipacked:
    ignore:
      # The checkout persists the App token on purpose: changesets pushes the version branch and tags with it. The only
      # upload in this job is the SBOM, two named files (sbom.cdx.json and its sigstore bundle), never .git.
      - runway-npm.yml:89
  self-repository:
    ignore:
      # Local reusable-workflow calls stay `./.github/workflows/…` (ADR 0168, called by SHA from other repositories);
      # the `$/…` form is not adopted until a run on GitHub has proven it for these three callers.
      - deploy-docs.yml:37
      - deploy-static.yml:48
      - release.yml:66
