# Stackra file contract:
# Purpose: zizmor's policy for `.github/workflows`, passed explicitly by the Quality Gate
#          (`zizmor --config .github/zizmor.yml .github/workflows`). ADR 0019 D1: every action and reusable workflow is
#          pinned to a full commit SHA, including the `actions/*` and `github/*` namespaces zizmor would accept at a
#          tag; the Runway workflows (ADR 0168) are called by local path here and by SHA from other repositories.
#          An accepted finding is an inline `# zizmor: ignore[<audit>]` comment on its line, with the reason here; never
#          a whole audit or file.
# Scope: .github/workflows
# Owner: release-operations
# Secrets: forbidden
rules:
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
  # zizmor 1.31 audits. An accepted finding is an inline `# zizmor: ignore[<audit>]` comment on the line zizmor
  # reports, with its reason here, never a whole audit or file: a file:line entry here drifted with every edit above
  # it (#941, #958) and failed every pull request's workflow lint.
  #
  # self-repository, on each `uses: ./…` line: local reusable-workflow calls stay `./.github/workflows/…` (ADR 0168,
  # called by SHA from other repositories); the `$/…` form is not adopted until a run on GitHub has proven it for these
  # callers. The same holds for the local secrets-decrypt action (ADR 0525, called by SHA from other repositories).
