# Stackra file contract:
# Purpose: deploy apps/docs (the `stackra-docs` Cloudflare Worker, docs.stackra.figentra.com), the `docs` member of
#          runway.yaml, through Runway's `cloudflare-workers` provider (runway-cloudflare-workers.yml, ADR 0514,
#          STA-2026). The provider builds the member (`stackra build`: gen assembles the Fumadocs site in
#          apps/docs/.stackra/site, React Router prerenders it into build/client, with llms.txt and _redirects) and
#          uploads those assets as the Worker. Runs on main only, never on a pull request; by hand (or
#          `pnpm runway promote <sha>`) it redeploys a given commit of main. The deployment message is the commit.
# Secrets: CLOUDFLARE_API_TOKEN comes from the sops scope ci/deploy, decrypted by the provider job as itself (ADR 0525).
#          No repository secret holds it (ADR 0019 D2).
# Owner: release-operations

name: Deploy docs

on:
  push:
    branches: [main]
    # Only what changes the site: the member, the gen renderer that writes it, this caller and its provider.
    paths:
      - "apps/docs/**"
      - "packages/developer/gen/src/core/templates/docs-site/**"
      - "packages/developer/gen/src/core/functions/emit-docs-site.function.ts"
      - ".github/workflows/deploy-docs.yml"
      - ".github/workflows/runway-cloudflare-workers.yml"
  workflow_dispatch:
    inputs:
      sha:
        description: A commit of main to deploy (promote or roll back); empty deploys the branch head
        type: string
        default: ""

# One deploy at a time, in order: a newer run waits instead of cancelling one that is mid-upload.
concurrency:
  group: deploy-docs
  cancel-in-progress: false

# ADR 0019 D2: nothing by default; the job grants what the provider's job asks for.
permissions: {}

jobs:
  # ADR 0468: production waits on the owner's one approval. The `production` environment (owner: required reviewer,
  # main only) holds no secret and grants nothing; the deploy job keeps the `docs` environment, whose name
  # figentra/infra's secret callers grant ci/deploy to (STA-1968, ADR 0525).
  approve:
    name: Owner approval (production)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions: {}
    steps:
      - name: Approved
        run: echo "production approved for ${GITHUB_SHA}"

  deploy:
    name: Deploy docs.stackra.figentra.com
    needs: approve
    # workflow_dispatch can name any branch; only main deploys. The provider also refuses a commit that is not on main.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/runway-cloudflare-workers.yml # zizmor: ignore[self-repository]
    with:
      member: docs
      package: "@figentra/docs"
      # The `docs` environment (owner: main only) puts its name into the OIDC subject, so figentra/infra grants this
      # job ci/deploy and nothing else.
      environment: docs
      sha: ${{ inputs.sha }}
      # The docs build runs `stackra` (@stackra/cli) and gen, so their workspace dependencies are installed. turbo
      # counts the root's workspace devDependency @stackra/commitlint-config, so the root (`stackra...`) is selected
      # too, or that member builds without its typescript-config preset.
      install-args: --frozen-lockfile --filter=@figentra/docs... --filter=stackra...
