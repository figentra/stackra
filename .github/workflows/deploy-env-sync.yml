# Stackra file contract:
# Purpose: deploy workers/env-sync (the `stackra-env-sync` Cloudflare Worker, env-sync.stackra.figentra.com, ADR 0173
#          amendment of 2026-11-04, decision 6), the `env-sync` member of runway.yaml, through Runway's
#          `cloudflare-workers` provider (runway-cloudflare-workers.yml, ADR 0352 decision 1): build, deploy, put its
#          three Worker secrets, attach the custom domain, then smoke-check /readyz (503 until every secret binds). Runs
#          on main pushes that touch the member or this file, and by hand (or `pnpm runway promote <sha>`) for a given
#          commit of main.
# Boundary: no resource ids and no values in the repository. The routes setting (ENV_SYNC_ROUTES) is the Worker's
#           wrangler var until the routed repositories exist.
# Runtime: GitHub Actions
# Governing contract: ADR 0173 (amendment of 2026-11-04); ADR 0352; ADR 0468; ADR 0019; STA-2133 (SECRETS Q17).
# Owner: release-operations
# Secrets: none in the repository. As the production identity (INFISICAL_PRODUCTION_IDENTITY_ID, an org variable)
#          from Infisical `ci-production` `prod`: CLOUDFLARE_API_TOKEN (`/ci`), INFISICAL_WEBHOOK_SECRET (`/ci/env-sync`)
#          and the stackra-bot App's STACKRA_BOT_APP_ID and STACKRA_BOT_PRIVATE_KEY (`/ci/release`, `bot-app`). Without
#          the identity id the job builds, prints a notice and deploys nothing, so main stays green until SECRETS
#          runbook step 2 is done.
name: Deploy env-sync

on:
  push:
    branches: [main]
    paths:
      - "workers/env-sync/**"
      - ".github/workflows/deploy-env-sync.yml"
      - ".github/workflows/runway-cloudflare-workers.yml"
  workflow_dispatch:
    inputs:
      sha:
        description: A commit of main to deploy (promote or roll back); empty deploys the branch head
        type: string
        default: ""

# One deploy at a time, in order: a newer run waits instead of cancelling one mid-upload.
concurrency:
  group: deploy-env-sync
  cancel-in-progress: false

# ADR 0019 D2: nothing by default; the job grants what the provider's job asks for.
permissions: {}

jobs:
  # ADR 0468: production waits on the owner's one approval. The `production` environment holds no secret and grants
  # nothing; the deploy job keeps the `env-sync` environment, whose name the production identity trusts.
  approve:
    name: Owner approval (production)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions: {}
    steps:
      - name: Approved
        run: echo "production approved for ${GITHUB_SHA}"

  deploy:
    needs: approve
    name: Deploy env-sync.stackra.figentra.com
    # workflow_dispatch can name any branch; only main deploys (ADR 0170 decision 6).
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/runway-cloudflare-workers.yml
    with:
      member: env-sync
      package: "@figentra/worker-env-sync"
      # Restricted to main (INFRA-CODE's GitHub stack); its name is in the OIDC subject the production identity trusts.
      environment: env-sync
      sha: ${{ inputs.sha }}
      # The licensed Pro postinstalls (ADR 0310) fail without the gate's tokens, so the two members that pull them
      # in are not installed; neither is deployed here.
      install-args: --frozen-lockfile --filter=!@figentra/mobile --filter=!@figentra/playground
      infisical-identity-id: ${{ vars.INFISICAL_PRODUCTION_IDENTITY_ID }}
      infisical-project-id: ${{ vars.INFISICAL_PRODUCTION_PROJECT_ID }}
      secret-path: /ci/env-sync
      secret-name: INFISICAL_WEBHOOK_SECRET
      bot-app: true
