# Stackra file contract:
# Purpose: keep Linear team STA in line with GitHub and the ADRs (tools/scripts/linear-reconcile.mjs).
#          ADR 0065 rule 7: a separate, non-blocking job. It is not a required check and never fails the run.
# Owner: release-operations
# Secrets: LINEAR_AGENT_CLIENT_ID / LINEAR_AGENT_CLIENT_SECRET (the "Stackra Agent" app; the script mints a
#          client_credentials token) and STACKRA_BOT_APP_ID / STACKRA_BOT_PRIVATE_KEY (the stackra-bot App: a
#          read-only installation token for the figentra org, so the reconcile reads every repo in
#          tools/scripts/linear-reconcile.repos.yaml). All four come by name from Infisical `ci-production` prod
#          `/ci/release` over GitHub OIDC as the production identity, which trusts this job's `linear-sync` environment
#          (main only) and this workflow (catalog Q7, STA-1747); no repository secret. Without the bot token the job
#          uses github.token, reads this repo only and lists the others as skipped. Never printed.
name: Linear sync

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report what would change without writing to Linear"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: linear-sync
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile Linear
    # The bot App key is given only inside a named environment: `linear-sync` (main branch only, no reviewer).
    environment: linear-sync
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      id-token: write # Infisical OIDC, the four names below only
    steps:
      # One name per call (the action's limit); each masked and exported. A failed read leaves the name unset.
      - name: Bot App id (Infisical OIDC)
        continue-on-error: true
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_PRODUCTION_IDENTITY_ID }}
          domain: https://eu.infisical.com
          project-id: ${{ vars.INFISICAL_PRODUCTION_PROJECT_ID }}
          env-slug: prod
          secret-path: /ci/release
          secret-name: STACKRA_BOT_APP_ID
          export-type: env

      - name: Bot App key (Infisical OIDC)
        continue-on-error: true
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_PRODUCTION_IDENTITY_ID }}
          domain: https://eu.infisical.com
          project-id: ${{ vars.INFISICAL_PRODUCTION_PROJECT_ID }}
          env-slug: prod
          secret-path: /ci/release
          secret-name: STACKRA_BOT_PRIVATE_KEY
          export-type: env

      - name: Linear app client id (Infisical OIDC)
        continue-on-error: true
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_PRODUCTION_IDENTITY_ID }}
          domain: https://eu.infisical.com
          project-id: ${{ vars.INFISICAL_PRODUCTION_PROJECT_ID }}
          env-slug: prod
          secret-path: /ci/release
          secret-name: LINEAR_AGENT_CLIENT_ID
          export-type: env

      - name: Linear app client secret (Infisical OIDC)
        continue-on-error: true
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_PRODUCTION_IDENTITY_ID }}
          domain: https://eu.infisical.com
          project-id: ${{ vars.INFISICAL_PRODUCTION_PROJECT_ID }}
          env-slug: prod
          secret-path: /ci/release
          secret-name: LINEAR_AGENT_CLIENT_SECRET
          export-type: env

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false # .notes is a private owner-only submodule; CI never needs it (STA-178)

      # ADR 0027 D2: node and pnpm come from mise.toml.
      - name: Toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: node pnpm

      # linear-reconcile.mjs imports `yaml`, a root devDependency: the root project alone is installed (STA-1897).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter .

      # Read-only, scoped to the repos the reconcile reads (tools/scripts/linear-reconcile.repos.yaml; keep the two lists
      # in step), never the whole org; revoked when the job ends.
      - name: App token
        id: bot
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ env.STACKRA_BOT_APP_ID }}
          private-key: ${{ env.STACKRA_BOT_PRIVATE_KEY }}
          owner: figentra
          repositories: |
            stackra
            stackra-pro
            stackra-template
            stackra-notes
            billing
            pay
            invoicing
            tamo
            os
            juristra
            figentra
            flow
            brand
            commerce
            organza
            velora
            academorix
            jute
            mezzora
          permission-contents: read
          permission-pull-requests: read

      - name: Reconcile
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
        run: node tools/scripts/linear-reconcile.mjs ${DRY_RUN:+"$DRY_RUN"}
