# Stackra file contract:
# Purpose: keep Linear team STA in line with GitHub and the ADRs (tools/scripts/linear-reconcile.mjs).
#          ADR 0065 rule 7: a separate, non-blocking job. It is not a required check and never fails the run.
# Owner: release-operations
# Secrets: LINEAR_AGENT_CLIENT_ID / LINEAR_AGENT_CLIENT_SECRET (the "Stackra Agent" app; the script mints a
#          client_credentials token), LINEAR_API_KEY as fallback. Read from the environment only; never printed.
#          STA-1822: the stackra-bot App's id and key come from Infisical prod `/ci/release` over OIDC (STA-1747), the
#          path runway-npm.yml uses, read inside the `linear-sync` environment (main only, no reviewer; the owner adds
#          `repo:figentra@314302700/stackra@1425140001:environment:linear-sync` as a trusted OIDC subject of the CI
#          identity), and mint a read-only installation token for the figentra org, so the reconcile
#          reads every repo in tools/scripts/linear-reconcile.repos.yaml. Without a token the job uses github.token,
#          reads this repo only and lists the others as skipped.
name: Linear sync

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report what would change without writing to Linear"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  id-token: write # Infisical OIDC for the bot App key (STA-1747)

concurrency:
  group: linear-sync
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile Linear
    # Production secrets are read only inside a named environment: `linear-sync` (main branch only, no reviewer) is the
    # OIDC subject the CI identity trusts for `/ci/release` (STA-1822).
    environment: linear-sync
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false # .notes is a private owner-only submodule; CI never needs it (STA-178)

      # ADR 0027 D2: node comes from mise.toml.
      - name: Toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: node

      - name: Bot App key (Infisical OIDC)
        continue-on-error: true
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_CI_IDENTITY_ID }}
          domain: https://eu.infisical.com
          project-id: ${{ vars.INFISICAL_DEPLOY_PROJECT_ID }}
          env-slug: prod
          secret-path: /ci/release
          export-type: env

      # Read-only, every repo the App is installed on in the org; revoked when the job ends.
      - name: App token
        id: bot
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ env.STACKRA_BOT_APP_ID }}
          private-key: ${{ env.STACKRA_BOT_PRIVATE_KEY }}
          owner: figentra
          permission-contents: read
          permission-pull-requests: read

      - name: Reconcile
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
          LINEAR_AGENT_CLIENT_ID: ${{ secrets.LINEAR_AGENT_CLIENT_ID }}
          LINEAR_AGENT_CLIENT_SECRET: ${{ secrets.LINEAR_AGENT_CLIENT_SECRET }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
        run: node tools/scripts/linear-reconcile.mjs ${DRY_RUN:+"$DRY_RUN"}
