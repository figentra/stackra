# Stackra file contract:
# Purpose: keep Linear team STA in line with GitHub and the ADRs (tools/scripts/linear-reconcile.mjs).
#          ADR 0065 rule 7: a separate, non-blocking job. It is not a required check and never fails the run.
# Owner: release-operations
# Secrets: LINEAR_AGENT_CLIENT_ID / LINEAR_AGENT_CLIENT_SECRET (the "Stackra Agent" app; the script mints a
#          client_credentials token), LINEAR_API_KEY as fallback. Read from the environment only; never printed.
#          STA-1822: STACKRA_BOT_APP_ID / STACKRA_BOT_PRIVATE_KEY (the stackra-bot App, the same repository secrets
#          release.yml passes today), given only to this job in the `linear-sync` environment (main only, no reviewer),
#          mint a read-only installation token for the figentra org, so the reconcile
#          reads every repo in tools/scripts/linear-reconcile.repos.yaml. Without a token the job uses github.token,
#          reads this repo only and lists the others as skipped. STA-1827 moves the key to the sops scope
#          `ci/production/release` for release.yml and this file together (STA-1747, ADR 0525).
name: Linear sync

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report what would change without writing to Linear"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: linear-sync
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile Linear
    # The bot App key is given only inside a named environment: `linear-sync` (main branch only, no reviewer).
    environment: linear-sync
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false # .notes is a private owner-only submodule; CI never needs it (STA-178)

      # ADR 0027 D2: node and pnpm come from mise.toml.
      - name: Toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          # Pinned: the action otherwise fetches its cached mise, whose release asset GitHub answered 504 for.
          version: 2026.11.4
          install_args: node pnpm

      # linear-reconcile.mjs imports `yaml`, a root devDependency: the root project alone is installed (STA-1897).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter .

      # Read-only, scoped to the repos the reconcile reads (tools/scripts/linear-reconcile.repos.yaml; keep the two lists
      # in step), never the whole org; revoked when the job ends.
      - name: App token
        id: bot
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.STACKRA_BOT_APP_ID }}
          private-key: ${{ secrets.STACKRA_BOT_PRIVATE_KEY }}
          owner: figentra
          repositories: |
            stackra
            stackra-pro
            stackra-template
            stackra-notes
            billing
            pay
            invoicing
            tamo
            os
            juristra
            figentra
            flow
            brand
            commerce
            organza
            velora
            academorix
            jute
            mezzora
          permission-contents: read
          permission-pull-requests: read

      - name: Reconcile
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
          LINEAR_AGENT_CLIENT_ID: ${{ secrets.LINEAR_AGENT_CLIENT_ID }}
          LINEAR_AGENT_CLIENT_SECRET: ${{ secrets.LINEAR_AGENT_CLIENT_SECRET }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
        run: node tools/scripts/linear-reconcile.mjs ${DRY_RUN:+"$DRY_RUN"}
