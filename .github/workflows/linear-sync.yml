# Stackra file contract:
# Purpose: keep Linear team STA in line with GitHub and the ADRs (tools/scripts/linear-reconcile.mjs).
#          ADR 0065 rule 7: a separate, non-blocking job. It is not a required check and never fails the run.
# Owner: release-operations
# Secrets: LINEAR_AGENT_CLIENT_ID / LINEAR_AGENT_CLIENT_SECRET (the "Stackra Agent" app; the script mints a
#          client_credentials token), LINEAR_API_KEY as fallback. Read from the environment only; never printed.
name: Linear sync

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report what would change without writing to Linear"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: linear-sync
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile Linear
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # ADR 0027 D2: node comes from mise.toml.
      - name: Toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: node

      - name: Reconcile
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAR_AGENT_CLIENT_ID: ${{ secrets.LINEAR_AGENT_CLIENT_ID }}
          LINEAR_AGENT_CLIENT_SECRET: ${{ secrets.LINEAR_AGENT_CLIENT_SECRET }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
        run: node tools/scripts/linear-reconcile.mjs $DRY_RUN
