# Stackra file contract:
# Purpose: deploy workers/turbo-cache (the `stackra-turbo-cache` Cloudflare Worker, turbo.stackra.figentra.com, the
#          Turborepo remote cache of ADR 0026), the `turbo-cache` member of runway.yaml, through Runway's
#          `cloudflare-workers` provider (runway-cloudflare-workers.yml, ADR 0352 decision 1): build, deploy, set the
#          TURBO_CACHE_TOKEN Worker secret from CI's TURBO_TOKEN, then check `GET /v8/artifacts/status` with that token
#          as the bearer. Runs on main pushes that touch the member or this file, and by hand (or
#          `pnpm runway promote <sha>`) for a given commit of main; never on a pull request.
# Boundary: the R2 bucket `turbo-cache` and its 7-day lifecycle rule are infrastructure: @stackra/infra-cloudflare
#           (src/node/turbo-cache/) declares them, and Runway's infra step (STA-1921 step 4) applies them; this job no
#           longer creates them. ci.yml's TURBO_* env belongs to the testing session, not this file.
# Runtime: GitHub Actions
# Governing contract: ADR 0026 (decision 2); ADR 0352; ADR 0289 (decision 2, RW11); ADR 0284 (decision 8); ADR 0173; ADR 0019.
# Owner: release-operations
# Secrets: none in the repository. CLOUDFLARE_API_TOKEN comes from the sops scope ci/deploy and TURBO_TOKEN from
#          ci/build/turbo with the turbo variables, its one home (ADR 0525). The job runs in the `static` environment
#          (main and schemas@* tags only), the caller figentra/infra already grants those scopes to deploy-static.yml.
name: Deploy turbo cache

on:
  push:
    branches: [main]
    paths:
      - "workers/turbo-cache/**"
      - ".github/workflows/deploy-turbo-cache.yml"
      - ".github/workflows/runway-cloudflare-workers.yml"
  workflow_dispatch:
    inputs:
      sha:
        description: A commit of main to deploy (promote or roll back); empty deploys the branch head
        type: string
        default: ""

# One deploy at a time, in order: a newer run waits instead of cancelling one mid-deploy.
concurrency:
  group: deploy-turbo-cache
  cancel-in-progress: false

# ADR 0019 D2: nothing by default; the job grants what the provider's job asks for.
permissions: {}

jobs:
  # ADR 0468: production waits on the owner's one approval. The `production` environment (owner: required reviewer,
  # main only) holds no secret and grants nothing; the deploy job keeps the `static` environment, whose name the
  # figentra/infra secret callers grant (STA-1968, ADR 0525).
  approve:
    name: Owner approval (production)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions: {}
    steps:
      - name: Approved
        run: echo "production approved for ${GITHUB_SHA}"

  deploy:
    needs: approve
    name: Deploy turbo.stackra.figentra.com
    # workflow_dispatch can name any branch; only main deploys (ADR 0170 decision 6).
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/runway-cloudflare-workers.yml # zizmor: ignore[self-repository]
    with:
      member: turbo-cache
      package: "@figentra/worker-turbo-cache"
      # Reused on purpose (see Secrets above): its name is in the caller principal figentra/infra grants ci/deploy to.
      environment: static
      sha: ${{ inputs.sha }}
      # The licensed Pro postinstalls (ADR 0310) fail without the gate's tokens, so the two members that pull them
      # in are not installed; none of them is deployed here.
      install-args: --frozen-lockfile --filter=!@figentra/mobile --filter=!@figentra/playground
