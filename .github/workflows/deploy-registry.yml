# Stackra file contract:
# Purpose: deploy workers/registry (the `stackra-registry` Cloudflare Worker, npm.stackra.figentra.com, ADR 0453), the
#          `registry` member of runway.yaml, through Runway's `cloudflare-workers` provider (runway-cloudflare-workers.yml,
#          ADR 0352 decision 1): build, put the real D1 and KV ids into wrangler.jsonc on the runner, apply the D1
#          migrations (remote), deploy with REGISTRY_READ_ONLY, set the REGISTRY_SIGNING_KEY Worker secret, then check
#          /-/ping and /-/npm/v1/keys. Runs on main pushes that touch the member or this file, and by hand (or
#          `pnpm runway promote <sha>`) for a given commit of main.
# Boundary: the resource ids are never committed: they come from the `registry` environment's variables (the outputs
#           of infra-cloudflare `registryWorker`, or the ids printed by the wrangler create commands, runbook in
#           workers/registry/README.md). The one-off move of npm.stackra.figentra.com off another Worker (owner
#           decision D13, STA-1389) is done and no longer runs here.
# Runtime: GitHub Actions
# Governing contract: ADR 0453 (decisions 3, 9, 17, chores); ADR 0352; ADR 0284 (decision 8); ADR 0289 (RW3); ADR 0173; ADR 0019.
# Owner: release-operations
# Secrets: none in the repository. CLOUDFLARE_API_TOKEN from the sops scope ci/production and REGISTRY_SIGNING_KEY
#          from ci/production/registry, decrypted by the provider job as itself in the `registry` environment
#          (ADR 0525).
name: Deploy registry

on:
  push:
    branches: [main]
    paths:
      - "workers/registry/**"
      - ".github/workflows/deploy-registry.yml"
      - ".github/workflows/runway-cloudflare-workers.yml"
  workflow_dispatch:
    inputs:
      sha:
        description: A commit of main to deploy (promote or roll back); empty deploys the branch head
        type: string
        default: ""

# One deploy at a time, in order: a newer run waits instead of cancelling one mid-migration.
concurrency:
  group: deploy-registry
  cancel-in-progress: false

# ADR 0019 D2: nothing by default; the job grants what the provider's job asks for.
permissions: {}

jobs:
  # ADR 0468: production waits on the owner's one approval. The `production` environment (owner: required reviewer,
  # main only) holds no secret and grants nothing; the deploy job keeps the `registry` environment, whose name the
  # figentra/infra secret callers grant (STA-1968, ADR 0525).
  approve:
    name: Owner approval (production)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions: {}
    steps:
      - name: Approved
        run: echo "production approved for ${GITHUB_SHA}"

  deploy:
    needs: approve
    name: Deploy npm.stackra.figentra.com
    # workflow_dispatch can name any branch; only main deploys (ADR 0170 decision 6).
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/runway-cloudflare-workers.yml # zizmor: ignore[self-repository]
    with:
      member: registry
      package: "@figentra/worker-registry"
      # The owner restricts this environment to main; its name is in the caller principal figentra/infra grants.
      environment: registry
      sha: ${{ inputs.sha }}
      # The licensed Pro postinstalls (ADR 0310) fail without the gate's tokens, so the two members that pull them
      # in are not installed; neither is deployed here.
      install-args: --frozen-lockfile --filter=!@figentra/mobile --filter=!@figentra/playground
      # The binding ids runway.yaml swaps in, and REGISTRY_READ_ONLY: empty is writable, `true` freezes publishes
      # during the Figentra Registry move (STA-1733) without an unfreezing redeploy.
      vars: REGISTRY_D1_DATABASE_ID REGISTRY_KV_NAMESPACE_ID REGISTRY_READ_ONLY
      scope: ci/production
      secret-scope: ci/production/registry
      secret-name: REGISTRY_SIGNING_KEY
