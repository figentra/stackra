# Stackra file contract:
# Purpose: Runway's `store` provider, a reusable workflow a product repository calls for one mobile app and one launch
#          step (ADR 0480, ADR 0441, ADR 0439):
#            build    EAS build of the production profile and EAS submit (TestFlight, Play internal)
#            prepare  `store ios|android`: metadata, screenshots, review details, TestFlight groups
#            probe    the review demo account signs in on production and sees data
#            submit   iOS submit for App Review
#            promote  Android production track (optionally staged); the owner dispatches it, never an agent
#            seed     seed the review demo account on production, then probe
#          A live run of any step runs in the caller's `production` environment: the store and signing keys are
#          production secrets, which live only there (owner decision 2026-10-29). A dry run takes no environment.
#          The app is the caller's root runway.yaml `mobile.<app>`; its listing is the `assets/store/<app>/` folder it
#          names. `live: false` (the default) runs every step as a dry run: nothing reaches Apple, Google or Expo.
# Boundary: the build runs in Runway's checkout of the app's OS template line (`template-dir`, produced by Runway's
#           mobile job before this workflow is called); captures come from the CI capture job (`captures-dir`). The
#           store tooling is core's (`tools/scripts/store.mjs`), checked out beside the product at `core-ref`.
# Runtime: GitHub Actions
# Secrets: the store root kit (ASC_API_*, GOOGLE_PLAY_SERVICE_ACCOUNT_JSON, EXPO_TOKEN) and the review secrets come
#          from the sops scope `scope` (ci/production/store), decrypted by the job as itself (ADR 0525), only in a
#          live run. Key files are written 0600 under RUNNER_TEMP and removed at the end; never printed. No
#          repository secret.
# Governing contract: ADR 0480; ADR 0170 (deploy only commits of main); ADR 0019 (pinned actions, least permission).
# Owner: release-operations
name: Runway store

on:
  workflow_call:
    inputs:
      action:
        description: build | prepare | probe | submit | promote | seed
        type: string
        required: true
      app:
        description: The key of the app in the caller's root runway.yaml `mobile` map.
        type: string
        default: app
      platform:
        description: all | ios | android
        type: string
        default: all
      version:
        description: The marketing version (x.y.z).
        type: string
        default: ""
      build:
        description: The iOS build number (prepare, submit).
        type: string
        default: ""
      version-code:
        description: The Android version code (prepare, promote).
        type: string
        default: ""
      fraction:
        description: Promote only, a staged rollout fraction (0.1); empty releases to everyone.
        type: string
        default: ""
      live:
        description: Send the requests. Off, every step is a dry run.
        type: boolean
        default: false
      template-dir:
        description: >-
          Runway's checkout of the app's template line (runMobileJob's templateDir), relative to the workspace; empty
          means `.stackra/mobile/<app>`.
        type: string
        default: ""
      captures-dir:
        description: The CI captures, `<locale>/<phone|tablet>/*.png`, relative to the workspace.
        type: string
        default: ""
      core-ref:
        description: The ref of figentra/stackra whose store tooling runs.
        type: string
        default: main
      scope:
        description: The sops scope of the store keys, granted to the caller's `production` environment.
        type: string
        default: ci/production/store

permissions: {}

jobs:
  store:
    name: ${{ inputs.action }} ${{ inputs.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Runbook (release): `production` accepts only the protected main branch; the owner sets its reviewers.
    # figentra/infra grants ci/production/store to the caller's `production` environment on main only, so no branch
    # and no other environment obtains the keys. A dry run reads no secret and takes no environment.
    environment: ${{ inputs.live && 'production' || '' }}
    permissions:
      contents: read
      id-token: write # GitHub OIDC token: the sops decrypt of the store keys (ADR 0525)
    env:
      STORE_ENVIRONMENT: ${{ inputs.live && 'production' || '' }}
      MODE: ${{ inputs.live && '--live' || '--dry-run' }}
      APP: ${{ inputs.app }}
      VERSION: ${{ inputs.version }}
      BUILD: ${{ inputs.build }}
      VERSION_CODE: ${{ inputs.version-code }}
      FRACTION: ${{ inputs.fraction }}
      PLATFORM: ${{ inputs.platform }}
      TEMPLATE_DIR: ${{ inputs.template-dir || format('.stackra/mobile/{0}', inputs.app) }}
      CAPTURES_DIR: ${{ inputs.captures-dir }}
    steps:
      - name: Checkout product
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          persist-credentials: false
          submodules: false

      - name: Checkout store tooling (core)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: figentra/stackra
          ref: ${{ inputs.core-ref }}
          path: .stackra/core
          persist-credentials: false
          submodules: false

      - name: Toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          # Pinned: the action otherwise fetches its cached mise, whose release asset GitHub answered 504 for.
          version: 2026.11.4
          install_args: node pnpm
          working_directory: .stackra/core

      # Only the root package's own dependencies (yaml, sharp): the store scripts need nothing else.
      - name: Install store tooling
        working-directory: .stackra/core
        run: pnpm install --frozen-lockfile --filter stackra

      # A build comes before its captures exist, so only the other steps need the store data complete.
      - name: Store build
        if: inputs.action != 'build'
        run: |
          set -eu
          node .stackra/core/tools/scripts/store.mjs build --root . --app "$APP" \
            ${TEMPLATE_DIR:+--template "$TEMPLATE_DIR"} ${CAPTURES_DIR:+--captures "$CAPTURES_DIR"}

      - name: Store keys (sops)
        if: inputs.live
        uses: figentra/stackra/.github/actions/secrets-decrypt@c8563c852108bb4759827e132b7e5b82b6ae33f4 # @stackra/runway@0.15.0
        with:
          scope: ${{ inputs.scope }}

      # eas-cli reads the iOS key from EXPO_ASC_*, and the Play key from the template's eas.json, whose production submit
      # profile names `./.stackra/play-service-account.json` (gitignored in the template).
      - name: Key files
        if: inputs.live && inputs.action == 'build'
        run: |
          umask 077
          printf '%s' "$ASC_API_PRIVATE_KEY" > "$RUNNER_TEMP/asc.p8"
          mkdir -p "$TEMPLATE_DIR/.stackra"
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$TEMPLATE_DIR/.stackra/play-service-account.json"
          {
            echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/asc.p8"
            echo "EXPO_ASC_KEY_ID=$ASC_API_KEY_ID"
            echo "EXPO_ASC_ISSUER_ID=$ASC_API_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: EAS
        if: inputs.live && inputs.action == 'build'
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9.0.0
        with:
          eas-version: 24.14.0
          packager: pnpm
          token: ${{ env.EXPO_TOKEN }}

      # The template checkout carries the app config Runway generated from the runway entry (ADR 0439 decision 2).
      - name: EAS build and submit
        if: inputs.action == 'build'
        run: |
          set -eu
          if [ "$MODE" = --dry-run ]; then
            echo "dry run: eas build --platform $PLATFORM --profile production --non-interactive --auto-submit in ${TEMPLATE_DIR:-<template-dir>}"
            exit 0
          fi
          if [ -z "$TEMPLATE_DIR" ] || [ ! -f "$TEMPLATE_DIR/app.json" ]; then
            echo "::error title=No template checkout::template-dir must be Runway's checkout of the app's template line"
            exit 1
          fi
          if [ "$PLATFORM" != android ]; then
            node .stackra/core/tools/scripts/store.mjs eas-submit --root . --app "$APP" --template "$TEMPLATE_DIR"
          fi
          cd "$TEMPLATE_DIR"
          eas build --platform "$PLATFORM" --profile production --non-interactive --wait --auto-submit

      - name: Store step
        if: inputs.action != 'build'
        run: |
          set -eu
          run() {
            node .stackra/core/tools/scripts/store.mjs "$@" --root . --app "$APP" "$MODE" \
              ${TEMPLATE_DIR:+--template "$TEMPLATE_DIR"} ${CAPTURES_DIR:+--captures "$CAPTURES_DIR"}
          }
          case "$INPUT_ACTION" in
            prepare)
              if [ "$PLATFORM" != android ]; then run ios --version "$VERSION" ${BUILD:+--build "$BUILD"}; fi
              if [ "$PLATFORM" != ios ]; then run android --version "$VERSION" ${VERSION_CODE:+--version-code "$VERSION_CODE"}; fi
              ;;
            probe) run review probe ;;
            seed) run review seed ;;
            submit) run submit --version "$VERSION" --build "$BUILD" ;;
            promote) run promote --version "$VERSION" --version-code "$VERSION_CODE" ${FRACTION:+--fraction "$FRACTION"} ;;
            *) echo "::error::unknown action $INPUT_ACTION"; exit 2 ;;
          esac
        env:
          INPUT_ACTION: ${{ inputs.action }}

      - name: Remove key files
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8" "${TEMPLATE_DIR:-.}/.stackra/play-service-account.json"
