# Generated by fflow from the ./packages/developer/flow-preset/preset preset 0.11.0: do not edit; change .flow/overrides/ and run `fflow sync`.
# Written by `fflow sync`; `fflow land` dispatches it when the ruleset requires a review (STA-1856).
# Every rule is in @figentra-oss/flow's approve-check.mjs, at the version below; `fflow gate ci` fails on a hand edit.
name: fflow approve
run-name: fflow approve PR ${{ inputs.pr }} at ${{ inputs.head }}

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number
      head:
        description: The head SHA the caller checked; the approval is refused if the PR moved since
        required: true
        type: string

permissions: {}

concurrency:
  group: fflow-approve-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  approve:
    # The App's key is only in this environment; the check refuses unless it admits the default branch alone.
    environment: fflow-approve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.FFLOW_APPROVER_APP_ID }}
          private-key: ${{ secrets.FFLOW_APPROVER_PRIVATE_KEY }}
          permission-pull-requests: write
      - name: Check and approve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          APPROVER: ${{ steps.app.outputs.app-slug }}[bot]
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          EXPECTED_HEAD: ${{ inputs.head }}
          ENVIRONMENT: fflow-approve
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INTEGRITY: 'sha512-Qlf7wO+VGrZ8A+zNiOW1zkAAUr9gVH3+fN1o17L28pGLHfI0HBIhY7ezHlhp0Snf9RGwUK0/4d+G+8ArODpIpA=='
          TRUSTED: '{"fflow/gate":"figentra-flow[bot]"}'
          OWNER_ONLY_EXTRA: '[".opencode/plugins/**",".claude/hooks/**"]'
          TOLERATE: '[]'
        run: |
          cd "$RUNNER_TEMP"
          [ -n "$INTEGRITY" ] || { echo "::error::no pinned integrity for @figentra-oss/flow@0.11.0; run fflow sync where the lockfile resolves it"; exit 1; }
          file=$(npm pack --silent --@figentra-oss:registry=https://npm.stackra.figentra.com/ @figentra-oss/flow@0.11.0 | tail -n 1)
          got="sha512-$(openssl dgst -sha512 -binary "$file" | base64 -w0)"
          [ "$got" = "$INTEGRITY" ] || { echo "::error::@figentra-oss/flow@0.11.0 is $got, not the pinned $INTEGRITY"; exit 1; }
          mkdir flow && tar -xzf "$file" -C flow
          node flow/package/src/lib/approve-check.mjs
