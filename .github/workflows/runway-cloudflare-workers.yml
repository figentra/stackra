# Stackra file contract:
# Purpose: the job that runs Runway's `cloudflare-workers` provider (@stackra/runway, ADR 0352 decision 1) for one
#          Worker member of the root runway.yaml (`targets.cloudflare-workers.members.<member>`), a reusable workflow
#          so each caller keeps its own GitHub environment. Checks out the commit, refuses one that is not on main,
#          builds what the member needs, reads the credentials and variables, then hands over to `stackra deploy`, which builds,
#          swaps the binding ids, applies D1 migrations, uploads a version with the commit as the message and its secrets on
#          stdin, smoke-tests it and moves traffic to it. Callers: deploy-static.yml, deploy-registry.yml, deploy-turbo-cache.yml,
#          deploy-env-sync.yml.
# Secrets: none in the repository. CLOUDFLARE_API_TOKEN (core's own token, scoped to its Workers, ADR 0519) from Infisical `/ci`, and the one `secret-name` from
#          `secret-path`, through GitHub OIDC; with `bot-app`, STACKRA_BOT_APP_ID and STACKRA_BOT_PRIVATE_KEY from
#          `/ci/release`; the turbo values from `/ci/turbo` (TURBO_TOKEN among them). Without an
#          identity id the job builds, prints a notice and deploys nothing.
# Owner: release-operations
name: Runway cloudflare-workers

on:
  workflow_call:
    inputs:
      member:
        description: The member key under `targets.cloudflare-workers.members` in runway.yaml (e.g. `static`).
        type: string
        required: true
      package:
        description: The member's package name, the turbo filter for its gen and test (e.g. `@figentra/worker-static`).
        type: string
        required: true
      environment:
        description: >-
          The GitHub environment the job runs in. Its name is in the OIDC subject the Infisical identity trusts,
          and its protection decides which refs may deploy.
        type: string
        required: true
      sha:
        description: The commit to deploy (a promote or a rollback). Empty deploys the triggering commit.
        type: string
        default: ""
      install-args:
        description: Arguments to `pnpm install`, space-separated words with no quoting.
        type: string
        default: --frozen-lockfile
      vars:
        description: >-
          Space-separated names of GitHub variables (the environment's or the repository's) the member's runway
          entry reads as ids or vars; each is exported under its own name. Values only, never a secret.
        type: string
        default: ""
      infisical-identity-id:
        description: The Infisical machine identity id (a variable, not a secret). Empty skips the deploy.
        type: string
        default: ""
      infisical-project-id:
        description: The Infisical project (workspace) id, not a secret.
        type: string
        default: ""
      infisical-domain:
        description: The Infisical instance.
        type: string
        default: https://eu.infisical.com
      infisical-env:
        description: The Infisical environment that holds `/ci`.
        type: string
        default: prod
      secret-path:
        description: An Infisical path holding one more secret the member sets (e.g. `/ci/registry`). Empty reads none.
        type: string
        default: ""
      secret-name:
        description: The one secret read from `secret-path` (e.g. `REGISTRY_SIGNING_KEY`).
        type: string
        default: ""
      bot-app:
        description: >-
          Also read the stackra-bot GitHub App's STACKRA_BOT_APP_ID and STACKRA_BOT_PRIVATE_KEY from `/ci/release`
          (their one stored copy, ci-production; the production identity reads it) for a Worker that mints App tokens.
        type: boolean
        default: false
    outputs:
      sha:
        description: The deployed commit.
        value: ${{ jobs.deploy.outputs.sha }}
      deployed:
        description: "`true` when Runway deployed, `false` when the deploy was skipped."
        value: ${{ jobs.deploy.outputs.deployed }}

# ADR 0019 D2: nothing by default; the job asks for what it needs (the caller's job must grant the same).
permissions: {}

jobs:
  deploy:
    name: Deploy ${{ inputs.member }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only a called workflow can take its environment from an input, which is why this is a reusable workflow and not
    # a step list: the environment binds the deploy to its protection, its OIDC subject and GitHub's deployment record.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read # checkout
      id-token: write # GitHub OIDC token, exchanged with Infisical for read access
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      deployed: ${{ steps.deploy.outcome == 'success' }}
    env:
      INFISICAL_IDENTITY_ID: ${{ inputs.infisical-identity-id }}

    steps:
      # ADR 0019 D1: every action is pinned to a full commit SHA, the version in the trailing comment. Full history
      # brings origin/main for the check below and every tag a build may read (the static site rebuilds each
      # `schemas@*` release from its tag).
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false # .notes is a private owner-only submodule; CI never needs it (STA-178)

      # Every deploy is of a commit on main (ADR 0170 decision 6): a tag or an explicit SHA can name any commit, so
      # the check runs before anything is built or any credential is read. The SHA is the release's identity.
      - name: Release commit
        id: commit
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          git merge-base --is-ancestor "$sha" origin/main || {
            echo "::error title=Not on main::$sha is not on main; Runway deploys only commits of main."
            exit 1
          }
          echo "::notice title=Release commit::$sha"

      # ADR 0027 D2: node and pnpm come from the caller's mise.toml.
      - name: Toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: node pnpm

      # The arguments arrive through the environment, never spliced into the script (zizmor template-injection);
      # `set -f` keeps a `!` filter from globbing.
      - name: Install dependencies
        env:
          INSTALL_ARGS: ${{ inputs.install-args }}
        run: |
          set -f
          # shellcheck disable=SC2086 # word splitting of the argument list is the point
          pnpm install $INSTALL_ARGS

      # STA-1393: Turborepo remote cache (turbo.stackra.figentra.com). Exports TURBO_API, TURBO_TOKEN, TURBO_TEAM and
      # TURBO_REMOTE_CACHE_SIGNATURE_KEY from /ci/turbo; skipped when the variable is unset (local cache only). The
      # turbo-cache member's TURBO_CACHE_TOKEN secret and smoke bearer read this TURBO_TOKEN.
      - name: Turborepo remote cache (Infisical OIDC)
        if: vars.INFISICAL_GATE_IDENTITY_ID != '' && vars.INFISICAL_GATE_PROJECT_ID != ''
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_GATE_IDENTITY_ID }}
          domain: https://eu.infisical.com
          project-id: ${{ vars.INFISICAL_GATE_PROJECT_ID }}
          env-slug: prod
          secret-path: /ci/turbo
          export-type: env

      # Tests run on the box, not here (STA-2064). This builds the member's dependencies and the CLI that runs the
      # deploy, then the member's own gen with `--only`: a plain `gen` would wait on the root //#gen:workspace, which
      # walks every member and fails on the ones left uninstalled (STA-1987). `stackra deploy` builds the member.
      - name: Build
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          pnpm turbo run build --filter="$PACKAGE^..." --filter=@stackra/cli...
          pnpm turbo run gen --filter="$PACKAGE" --only

      - name: Deploy prerequisites missing
        if: env.INFISICAL_IDENTITY_ID == ''
        run: >-
          echo "::notice title=Deploy skipped::No Infisical identity id was passed (infisical-identity-id).
          Built, nothing deployed."

      # Exchanges this job's OIDC token for Infisical access and exports only CLOUDFLARE_API_TOKEN; the secret-name
      # filter keeps every other /ci value out of the job.
      - name: Cloudflare token (Infisical OIDC)
        if: env.INFISICAL_IDENTITY_ID != ''
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          domain: ${{ inputs.infisical-domain }}
          project-id: ${{ inputs.infisical-project-id }}
          env-slug: ${{ inputs.infisical-env }}
          secret-path: /ci
          secret-name: CLOUDFLARE_API_TOKEN
          export-type: env

      - name: Member secret (Infisical OIDC)
        if: env.INFISICAL_IDENTITY_ID != '' && inputs.secret-path != ''
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          domain: ${{ inputs.infisical-domain }}
          project-id: ${{ inputs.infisical-project-id }}
          env-slug: ${{ inputs.infisical-env }}
          secret-path: ${{ inputs.secret-path }}
          secret-name: ${{ inputs.secret-name }}
          export-type: env

      # The action reads one name per step, and the names stay literal so `runway env check` sees them (STA-2133).
      - name: Bot App id (Infisical OIDC)
        if: env.INFISICAL_IDENTITY_ID != '' && inputs.bot-app
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          domain: ${{ inputs.infisical-domain }}
          project-id: ${{ inputs.infisical-project-id }}
          env-slug: ${{ inputs.infisical-env }}
          secret-path: /ci/release
          secret-name: STACKRA_BOT_APP_ID
          export-type: env

      - name: Bot App key (Infisical OIDC)
        if: env.INFISICAL_IDENTITY_ID != '' && inputs.bot-app
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          domain: ${{ inputs.infisical-domain }}
          project-id: ${{ inputs.infisical-project-id }}
          env-slug: ${{ inputs.infisical-env }}
          secret-path: /ci/release
          secret-name: STACKRA_BOT_PRIVATE_KEY
          export-type: env

      # Each named variable goes into the environment under its own name; a name that is not SCREAMING_SNAKE or a
      # value holding a newline is refused, so nothing can add another variable to the job.
      - name: Variables
        if: env.INFISICAL_IDENTITY_ID != '' && inputs.vars != ''
        env:
          NAMES: ${{ inputs.vars }}
          VARIABLES: ${{ toJSON(vars) }}
        run: |
          for name in $NAMES; do
            [[ "$name" =~ ^[A-Z][A-Z0-9_]*$ ]] || { echo "::error title=vars::$name is not a variable name"; exit 1; }
            value="$(jq -r --arg name "$name" '.[$name] // ""' <<<"$VARIABLES")"
            [[ "$value" != *$'\n'* ]] || { echo "::error title=$name::the variable holds a newline"; exit 1; }
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      # Runway checks every id, secret and bearer before anything ships, then builds, migrates, deploys with the commit
      # as the message and its secrets on stdin, and retries the smoke checks while a new domain's certificate comes
      # up. `--kind web` keeps the docs target (Mintlify) out of a Worker deploy.
      - name: Deploy (Runway)
        id: deploy
        if: env.INFISICAL_IDENTITY_ID != ''
        env:
          MEMBER: ${{ inputs.member }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: node packages/developer/cli/dist/stackra.mjs deploy --env production --kind web --member "$MEMBER" --sha "$SHA"
