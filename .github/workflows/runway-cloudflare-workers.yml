# Stackra file contract:
# Purpose: the job that runs Runway's `cloudflare-workers` provider (@stackra/runway, ADR 0352 decision 1) for one
#          Worker member of the root runway.yaml (`targets.cloudflare-workers.members.<member>`), a reusable workflow
#          so each caller keeps its own GitHub environment. Checks out the commit, refuses one that is not on main,
#          builds what the member needs, reads the credentials and variables, then hands over to `stackra deploy`, which builds,
#          swaps the binding ids, applies D1 migrations, uploads a version with the commit as the message and its secrets on
#          stdin, smoke-tests it and moves traffic to it. Callers: deploy-static.yml, deploy-registry.yml, deploy-turbo-cache.yml, deploy-docs.yml,
#          and a product repository's own caller (`product: true`, e.g. its docs Worker): the product's installed
#          `stackra` ships, and the job first reads the Stackra registry token so the install resolves @figentra/*.
# Secrets: none in the repository. The job decrypts figentra/secrets scopes as itself (ADR 0525, the shared
#          secrets-decrypt action; figentra/infra estate/secret-callers.mjs grants each caller environment its scopes):
#          CLOUDFLARE_API_TOKEN (core's own token, scoped to its Workers, ADR 0519) from `scope`, the `secret-name`s
#          from `secret-scope`, with `bot-app` STACKRA_BOT_APP_ID and STACKRA_BOT_PRIVATE_KEY from `<scope>/release`,
#          and the turbo values from ci/build/turbo (TURBO_TOKEN among them). A product caller also reads
#          STACKRA_REGISTRY_TOKEN from ci/build/registry, which every figentra repository may read.
# Owner: release-operations
name: Runway cloudflare-workers

on:
  workflow_call:
    inputs:
      member:
        description: The member key under `targets.cloudflare-workers.members` in runway.yaml (e.g. `static`).
        type: string
        required: true
      package:
        description: The member's package name, the turbo filter for its gen and test (e.g. `@figentra/worker-static`).
        type: string
        required: true
      environment:
        description: >-
          The GitHub environment the job runs in. Its name is in the caller principal figentra/infra grants scopes to,
          and its protection decides which refs may deploy.
        type: string
        required: true
      sha:
        description: The commit to deploy (a promote or a rollback). Empty deploys the triggering commit.
        type: string
        default: ""
      install-args:
        description: Arguments to `pnpm install`, space-separated words with no quoting.
        type: string
        default: --frozen-lockfile
      vars:
        description: >-
          Space-separated names of GitHub variables (the environment's or the repository's) the member's runway
          entry reads as ids or vars; each is exported under its own name. Values only, never a secret.
        type: string
        default: ""
      scope:
        description: The figentra/secrets scope holding CLOUDFLARE_API_TOKEN (`ci/deploy`, or `ci/production`).
        type: string
        default: ci/deploy
      secret-scope:
        description: A scope holding the member's own secrets (e.g. `ci/production/registry`). Empty reads none.
        type: string
        default: ""
      secret-name:
        description: The names read from `secret-scope`, comma-separated (e.g. `REGISTRY_SIGNING_KEY`).
        type: string
        default: ""
      bot-app:
        description: >-
          Also read the stackra-bot GitHub App's STACKRA_BOT_APP_ID and STACKRA_BOT_PRIVATE_KEY from
          `<scope>/release`, for a Worker that mints App tokens.
        type: boolean
        default: false
      product:
        description: >-
          A product repository calls: read the Stackra registry token before the install, and ship with the product's
          installed `stackra` (`pnpm exec stackra`) instead of building core's CLI from the workspace.
        type: boolean
        default: false
    outputs:
      sha:
        description: The deployed commit.
        value: ${{ jobs.deploy.outputs.sha }}
      deployed:
        description: "`true` when Runway deployed, `false` when the deploy was skipped."
        value: ${{ jobs.deploy.outputs.deployed }}

# ADR 0019 D2: nothing by default; the job asks for what it needs (the caller's job must grant the same).
permissions: {}

jobs:
  deploy:
    name: Deploy ${{ inputs.member }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only a called workflow can take its environment from an input, which is why this is a reusable workflow and not
    # a step list: the environment binds the deploy to its protection, its OIDC subject and GitHub's deployment record.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read # checkout
      id-token: write # GitHub OIDC token: the secrets-decrypt sign-in to Google Cloud (ADR 0525)
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      deployed: ${{ steps.deploy.outcome == 'success' }}

    steps:
      # ADR 0019 D1: every action is pinned to a full commit SHA, the version in the trailing comment. Full history
      # brings origin/main for the check below and every tag a build may read (the static site rebuilds each
      # `schemas@*` release from its tag).
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false # .notes is a private owner-only submodule; CI never needs it (STA-178)

      # Every deploy is of a commit on main (ADR 0170 decision 6): a tag or an explicit SHA can name any commit, so
      # the check runs before anything is built or any credential is read. The SHA is the release's identity.
      - name: Release commit
        id: commit
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          git merge-base --is-ancestor "$sha" origin/main || {
            echo "::error title=Not on main::$sha is not on main; Runway deploys only commits of main."
            exit 1
          }
          echo "::notice title=Release commit::$sha"

      # ADR 0027 D2: node and pnpm come from the caller's mise.toml.
      - name: Toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          # Pinned: the action otherwise fetches its cached mise, whose release asset GitHub answered 504 for.
          version: 2026.11.4
          install_args: node pnpm

      # A product's install reads @figentra/* from the Stackra registry, which answers 401 without a read token.
      - name: Registry token (sops)
        if: inputs.product
        uses: figentra/stackra/.github/actions/secrets-decrypt@c8563c852108bb4759827e132b7e5b82b6ae33f4 # @stackra/runway@0.15.0
        with:
          scope: ci/build/registry
          names: STACKRA_REGISTRY_TOKEN

      # pnpm 12 reads registry tokens only from the user-level ~/.npmrc, never the repository's.
      - name: Registry token (user .npmrc)
        if: inputs.product
        run: |
          echo "::add-mask::${STACKRA_REGISTRY_TOKEN}"
          umask 077
          printf '//npm.stackra.figentra.com/:_authToken=%s\n' "${STACKRA_REGISTRY_TOKEN}" >> "$HOME/.npmrc"

      # The arguments arrive through the environment, never spliced into the script (zizmor template-injection);
      # `set -f` keeps a `!` filter from globbing.
      - name: Install dependencies
        env:
          INSTALL_ARGS: ${{ inputs.install-args }}
        run: |
          set -f
          # shellcheck disable=SC2086 # word splitting of the argument list is the point
          pnpm install $INSTALL_ARGS

      # STA-1393: Turborepo remote cache (turbo.stackra.figentra.com). Exports TURBO_API, TURBO_TOKEN, TURBO_TEAM and
      # TURBO_REMOTE_CACHE_SIGNATURE_KEY from the sops scope ci/build/turbo (ADR 0525). The turbo-cache member's
      # TURBO_CACHE_TOKEN secret and smoke bearer read this TURBO_TOKEN.
      - name: Turborepo remote cache (sops)
        uses: figentra/stackra/.github/actions/secrets-decrypt@c8563c852108bb4759827e132b7e5b82b6ae33f4 # @stackra/runway@0.15.0
        with:
          scope: ci/build/turbo

      # Tests run on the box, not here (STA-2064). This builds the member's dependencies and the CLI that runs the
      # deploy, then the member's own gen with `--only`: a plain `gen` would wait on the root //#gen:workspace, which
      # walks every member and fails on the ones left uninstalled (STA-1987). `stackra deploy` builds the member.
      - name: Build
        env:
          PACKAGE: ${{ inputs.package }}
          PRODUCT: ${{ inputs.product }}
        run: |
          # A product installs @stackra/cli from the registry; only core builds it from the workspace.
          cli=(--filter=@stackra/cli...)
          [ "$PRODUCT" = true ] && cli=()
          pnpm turbo run build --filter="$PACKAGE^..." "${cli[@]}"
          pnpm turbo run gen --filter="$PACKAGE" --only

      # Only CLOUDFLARE_API_TOKEN from the scope, so no other value of it enters the job.
      - name: Cloudflare token (sops)
        uses: figentra/stackra/.github/actions/secrets-decrypt@c8563c852108bb4759827e132b7e5b82b6ae33f4 # @stackra/runway@0.15.0
        with:
          scope: ${{ inputs.scope }}
          names: CLOUDFLARE_API_TOKEN

      - name: Member secret (sops)
        if: inputs.secret-scope != ''
        uses: figentra/stackra/.github/actions/secrets-decrypt@c8563c852108bb4759827e132b7e5b82b6ae33f4 # @stackra/runway@0.15.0
        with:
          scope: ${{ inputs.secret-scope }}
          names: ${{ inputs.secret-name }}

      # The names stay literal so `runway env check` sees them (STA-2133).
      - name: Bot App (sops)
        if: inputs.bot-app
        uses: figentra/stackra/.github/actions/secrets-decrypt@c8563c852108bb4759827e132b7e5b82b6ae33f4 # @stackra/runway@0.15.0
        with:
          scope: ${{ inputs.scope }}/release
          names: STACKRA_BOT_APP_ID,STACKRA_BOT_PRIVATE_KEY

      # Each named variable goes into the environment under its own name; a name that is not SCREAMING_SNAKE or a
      # value holding a newline is refused, so nothing can add another variable to the job.
      - name: Variables
        if: inputs.vars != ''
        env:
          NAMES: ${{ inputs.vars }}
          VARIABLES: ${{ toJSON(vars) }}
        run: |
          for name in $NAMES; do
            [[ "$name" =~ ^[A-Z][A-Z0-9_]*$ ]] || { echo "::error title=vars::$name is not a variable name"; exit 1; }
            value="$(jq -r --arg name "$name" '.[$name] // ""' <<<"$VARIABLES")"
            [[ "$value" != *$'\n'* ]] || { echo "::error title=$name::the variable holds a newline"; exit 1; }
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      # Runway checks every id, secret and bearer before anything ships, then builds, migrates, deploys with the commit
      # as the message and its secrets on stdin, and retries the smoke checks while a new domain's certificate comes
      # up. `--kind web` with `--member` ships only the named Worker member (the docs site is the `docs` member).
      - name: Deploy (Runway)
        id: deploy
        env:
          MEMBER: ${{ inputs.member }}
          SHA: ${{ steps.commit.outputs.sha }}
          PRODUCT: ${{ inputs.product }}
        run: |
          stackra=(node packages/developer/cli/dist/stackra.mjs)
          [ "$PRODUCT" = true ] && stackra=(pnpm exec stackra)
          "${stackra[@]}" deploy --env production --kind web --member "$MEMBER" --sha "$SHA"
