name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate repository
        run: pnpm validate

      - name: Check boundaries
        run: pnpm boundaries

      - name: Check unused code
        run: pnpm knip

      - name: Install gitleaks (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: gitleaks

      - name: Secrets scan
        run: pnpm secrets:scan

      - name: Agent sync check
        run: pnpm agents:check

  # Optional: Deploy staging on main branch
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Encore
        run: echo "Encore deployment via Infisical OIDC (Phase 2)"
        # TODO: infisical run --env=staging -- encore deploy

      - name: Build mobile preview
        run: echo "EAS preview build (Phase 2)"
