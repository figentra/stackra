# Stackra file contract:
# Purpose: the Quality Gate, the one required check on every pull request to main and every push to
#          main (install, Linear key check, format, lint, typecheck, test, build, validate, boundaries,
#          knip, secrets scan, agent sync). Branch protection requires the `Quality Gate` job by name;
#          never rename it. `deploy-staging` is a placeholder that deploys nothing.
# Owner: release-operations
# Secrets: none. contents: read only; no OIDC token, no repository secret.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review re-runs the gate when a draft PR is marked ready, so the Tasked rule applies.
    types: [opened, synchronize, reopened, ready_for_review]

# ADR 0019 D2: least privilege. Nothing in the gate writes to the repository or holds an OIDC token.
permissions:
  contents: read

jobs:
  gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ADR 0019 D1: every action is pinned to a full commit SHA, the version in the trailing comment.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false # .notes is a private owner-only submodule; CI never needs it (STA-178)

      # ADR 0027 D2: toolchains come from mise.toml (node, pnpm, gitleaks), not per-tool setup actions.
      - name: Toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: node pnpm gitleaks

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ADR 0065: the PR names its Linear issue, and every feat/fix/refactor/perf commit carries `Refs: STA-n`.
      # Offline checks only; nothing here calls Linear.
      - name: Linear key check
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node tools/scripts/linear.mjs check-pr
          case "$PR_BRANCH" in renovate/*|changeset-release/*) exit 0 ;; esac
          pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA"

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # spec-gate: a ready-for-review PR needs its own spec (the branch key's folder), when changed, at Tasked or later; other changed specs get the stage check, and a change to another spec's Status line needs a commit with `Refs:` naming that spec's key; STACKRA_BRANCH feeds the lane check (check-pr owns the branch name).
      - name: Validate repository
        env:
          SPEC_GATE_REQUIRE_READY: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && '1' || '' }}
          STACKRA_BRANCH: ${{ github.head_ref }}
        run: pnpm validate

      - name: Check boundaries
        run: pnpm boundaries

      - name: Check unused code
        run: pnpm knip

      - name: Secrets scan
        run: pnpm secrets:scan

      - name: Agent sync check
        run: pnpm agents:check

  # No deploy decision exists yet: how the generated, gitignored Encore app reaches a runtime, the environments and
  # the promotion unit are open owner questions (gap questionnaire DP1-DP7, DP2 first; ADR 0091 leaves deploy open).
  # Until an ADR decides them this job deploys nothing; it only marks where the deploy job will go.
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions: {}

    steps:
      - name: No deploy target decided
        run: echo "No deploy target is decided yet (gap questionnaire DP1-DP7). Nothing is deployed."
