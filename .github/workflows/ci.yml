name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ADR 0065: the PR names its Linear issue, and every feat/fix/refactor/perf commit carries `Refs: STA-n`.
      # Offline checks only; nothing here calls Linear.
      - name: Linear key check
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node tools/scripts/linear.mjs check-pr
          case "$PR_BRANCH" in renovate/*|changeset-release/*) exit 0 ;; esac
          pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA"

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate repository
        run: pnpm validate

      - name: Check boundaries
        run: pnpm boundaries

      - name: Check unused code
        run: pnpm knip

      - name: Install gitleaks (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: gitleaks

      - name: Secrets scan
        run: pnpm secrets:scan

      - name: Agent sync check
        run: pnpm agents:check

  # Optional: Deploy staging on main branch
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Encore
        run: echo "Encore deployment via Infisical OIDC (Phase 2)"
        # TODO: infisical run --env=staging -- encore deploy

      - name: Build mobile preview
        run: echo "EAS preview build (Phase 2)"
        # TODO: eas build --profile preview --platform all
