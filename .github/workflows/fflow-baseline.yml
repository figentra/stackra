# Generated by fflow from the ./packages/developer/flow-preset/preset preset 0.11.0: do not edit; change .flow/overrides/ and run `fflow sync`.
# Written by `fflow sync` from the config's `baseline` (STA-1942); `fflow gate ci` fails on a hand edit.
# One check, "Baseline": a pull request passes when it fails no task that passed on main.
name: fflow baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: fflow-baseline-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  baseline:
    name: Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      # for a setup step's OIDC sign-in (registry auth's sops decrypt), as the repository's own CI has
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Toolchain (mise)"
        uses: "jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7"
        with:
          install_args: "node pnpm gitleaks shfmt aqua:rhysd/actionlint aqua:zizmorcore/zizmor aqua:google/osv-scanner"
          version: "2026.11.4"
      - name: Install
        run: pnpm install --frozen-lockfile --filter='!@figentra/mobile' --filter='!@figentra/playground'
      # Failures are judged against main's baseline, so the run itself never fails the job.
      - name: Tasks
        run: pnpm exec turbo run lint typecheck build --continue --summarize || true
      - name: Results
        run: pnpm exec fflow gate baseline save
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fflow-baseline-${{ github.sha }}
          path: .fflow-gate/baseline.json
          retention-days: 90
      - if: github.event_name == 'pull_request'
        name: Compare with main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm exec fflow gate baseline check --base "$BASE_SHA"
