# Stackra file contract:
# Purpose: Runway's `npm` provider, a public reusable workflow (ADR 0168 decision 1): with pending changesets it opens
#          or updates the "version packages" PR; on that PR's merge it publishes every workspace package with
#          "private": false to the Stackra registry (the `registry` input, ADR 0453) with provenance and an annotated
#          tag per version, then signs the CycloneDX SBOM keylessly with cosign and attaches it, with a
#          `sha256sums.txt` of the published tarballs, to each GitHub release it created. A Trivy filesystem scan of
#          the lockfile blocks the publish on a critical vulnerability that has a fix (ADR 0174). Every tarball
#          is made by `pnpm publish` (or `pnpm pack` for the dry run), so the workspace `.pnpmfile.mjs` beforePacking
#          hook strips the repo-only `imports` map and `@stackra/source` condition first.
# Boundary: publishes only to `registry`; never to npmjs (the optional mirror of ADR 0453 decision 16 is off and not
#           built here) and never with a long-lived token. Selecting what is published is the caller's (`build-args`).
# Runtime: GitHub Actions
# Secrets: the GitHub App id and key the version PR is pushed with (a PR pushed with GITHUB_TOKEN would not trigger
#          the caller's gate). A caller that passes neither gets them (STACKRA_BOT_APP_ID, STACKRA_BOT_PRIVATE_KEY)
#          from the sops scope ci/production/release, decrypted by the job as itself (ADR 0525), so no repository
#          holds them (STA-1747). figentra/infra grants that scope only to the callers in estate/secret-callers.mjs, on
#          main only.
#          No registry token exists: per package the job exchanges its
#          GitHub ID token (audience `npm:<registry host>`) at the registry's OIDC endpoint for a publish token bound to
#          that one name (ADR 0453 decision 6, the workflow-run form), masks it and passes it as NODE_AUTH_TOKEN;
#          `~/.npmrc` names the variable, never the value. The registry matches the CALLING workflow, ref and
#          environment, so the trusted publisher row names the caller (`release.yml`, `refs/heads/main`, `release`).
# Governing contract: ADR 0453 (decisions 6, 7 and 9); ADR 0168; ADR 0174; ADR 0177 (PK4, PK5); ADR 0019.
# Owner: release-operations
name: Runway npm

on:
  workflow_call:
    inputs:
      environment:
        description: The protected GitHub environment the release job waits in (a required reviewer approves it).
        type: string
        default: release
      install-args:
        description: Arguments to `pnpm install`, space-separated words with no quoting.
        type: string
        default: --frozen-lockfile
      build-args:
        description: Arguments to `pnpm turbo run build` that select what is published (e.g. `--filter=./packages/**`).
        type: string
        required: true
      dry-run:
        description: Pack and run `pnpm -r publish --dry-run` instead of the version PR and the publish.
        type: boolean
        default: false
      registry:
        description: >-
          The npm-compatible registry packages publish to, an https URL ending in /. The caller passes its root
          runway's `providers.npm.registry`; this default is the Stackra registry (ADR 0453).
        type: string
        default: https://npm.stackra.figentra.com/
    secrets:
      app-id:
        description: The GitHub App id the version PR and tags are pushed as; unset, from ci/production/release.
        required: false
      app-private-key:
        description: That App's private key; unset, from ci/production/release (sops).
        required: false
    outputs:
      published:
        description: "`true` when the run published at least one package."
        value: ${{ jobs.release.outputs.published }}

# ADR 0019 D2: nothing by default; each job asks for what it needs (the caller's job must grant the same).
permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # 0.17.0 published 118 of 119 packages (~13 s each) before a 30-minute limit cancelled the job (run 42297058735).
    timeout-minutes: 60
    # Runbook (release): a human keeps this environment protected and restricted to main, so a branch that edits the
    # workflow cannot obtain a credential, and every run waits for the owner's approval.
    environment: ${{ inputs.environment }}
    permissions:
      contents: write # push the version-PR branch and the version tags
      pull-requests: write # open and update the version PR
      id-token: write # the registry's OIDC exchange and the Sigstore provenance of each tarball
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    env:
      # A step's `if` cannot read `secrets`, so only whether the caller passed the App key is carried, never a value.
      HAS_APP_SECRETS: ${{ secrets.app-id != '' && secrets.app-private-key != '' }}

    steps:
      # STA-1747: a caller that passes no App secrets gets them from the sops scope ci/production/release (ADR 0525),
      # decrypted by the job as itself; the action masks and exports each.
      - name: Toolchain for the decrypt (mise)
        if: env.HAS_APP_SECRETS != 'true'
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          # Pinned: the action otherwise fetches its cached mise, whose release asset GitHub answered 504 for.
          version: 2026.11.4
          # Nothing is checked out yet, so the decrypt's node is named here (core's mise.toml pin).
          mise_toml: |
            [tools]
            node = "24.22.0"

      - name: Bot App (sops)
        if: env.HAS_APP_SECRETS != 'true'
        uses: figentra/stackra/.github/actions/secrets-decrypt@c8563c852108bb4759827e132b7e5b82b6ae33f4 # @stackra/runway@0.15.0
        with:
          scope: ci/production/release
          names: STACKRA_BOT_APP_ID,STACKRA_BOT_PRIVATE_KEY

      # Scoped to what this job needs; revoked when the job ends.
      - name: App token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.app-id || env.STACKRA_BOT_APP_ID }}
          private-key: ${{ secrets.app-private-key || env.STACKRA_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          token: ${{ steps.bot.outputs.token }} # the checkout itself reads as the App
          # changesets/action v2 pushes the version branch and tags through the GitHub API with its own `github-token`
          # (push-with-git-cli is off), so no later step needs the checkout's git credentials (zizmor artipacked).
          persist-credentials: false
          fetch-depth: 0 # changesets diffs against history and reads existing tags
          submodules: false # .notes is a private owner-only submodule; CI never needs it (STA-178)

      # ADR 0027 D2: node and pnpm come from the caller's mise.toml.
      - name: Toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          # Pinned: the action otherwise fetches its cached mise, whose release asset GitHub answered 504 for.
          version: 2026.11.4
          install_args: node pnpm

      # ADR 0174: before anything is installed or published, the lockfile is scanned. Only a critical vulnerability
      # with a released fix blocks; the version is past the March 2026 compromise of Trivy's releases (CVE-2026-33634).
      - name: Vulnerability scan (Trivy)
        run: >-
          mise exec aqua:aquasecurity/trivy@0.76.1 --
          trivy fs --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress .

      - name: Install dependencies
        env:
          INSTALL_ARGS: ${{ inputs.install-args }}
        run: |
          set -f
          # shellcheck disable=SC2086 # word splitting of the argument list is the point
          pnpm install $INSTALL_ARGS

      # STA-1393: Turborepo remote cache (turbo.stackra.figentra.com). Exports TURBO_API, TURBO_TOKEN, TURBO_TEAM and
      # TURBO_REMOTE_CACHE_SIGNATURE_KEY from the sops scope ci/build/turbo (ADR 0525). The cache only speeds the build,
      # so a caller without the turbo grant builds with the local cache instead of failing the release.
      - name: Turborepo remote cache (sops)
        continue-on-error: true
        uses: figentra/stackra/.github/actions/secrets-decrypt@c8563c852108bb4759827e132b7e5b82b6ae33f4 # @stackra/runway@0.15.0
        with:
          scope: ci/build/turbo

      # Only what is published is built; each package's dist must exist before it is packed.
      - name: Build
        env:
          BUILD_ARGS: ${{ inputs.build-args }}
        run: |
          set -f
          # shellcheck disable=SC2086 # word splitting of the argument list is the point
          pnpm turbo run build $BUILD_ARGS

      - name: Registry
        env:
          REGISTRY: ${{ inputs.registry }}
        run: |
          case "$REGISTRY" in https://*/) ;; *) echo "::error::registry must be an https URL ending in /"; exit 1 ;; esac
          host="${REGISTRY#https://}"
          # A reference, not a value: pnpm expands ${NODE_AUTH_TOKEN} from the publish step's environment.
          # shellcheck disable=SC2016 # the literal ${…} is the point
          printf '//%s:_authToken=${NODE_AUTH_TOKEN}\n' "$host" >> ~/.npmrc
          # The one script `changeset publish` is replaced by, so each package gets its own short-lived token.
          cat > "$RUNNER_TEMP/registry-publish.sh" <<'SH'
          set -euo pipefail
          # A stalled TLS handshake waited curl's 300 s default and failed run 40891451236: bound each call and
          # retry the transient failures (timeouts, 429, 5xx); a 404 still answers at once.
          curl() { command curl --connect-timeout 20 --max-time 90 --retry 4 --retry-delay 5 "$@"; }
          host="${REGISTRY#https://}"
          # changesets/action v2 reads the published tags from the NDJSON file it names in CHANGESETS_OUTPUT, not from
          # stdout: an absent file left 0.2.0 (run 41166821024) without tags or GitHub releases. Created empty first.
          : > "$CHANGESETS_OUTPUT"
          pnpm -r ls --depth -1 --json |
            jq -r '.[] | select(.private != true) | [.name, .version, .path] | @tsv' |
            while IFS=$'\t' read -r name version dir; do
              encoded="${name/\//%2f}"
              # Versions are immutable (ADR 0453 decision 7): one already there is skipped, never republished.
              if curl -fsS -o /dev/null "${REGISTRY}${encoded}/${version}"; then
                echo "skip ${name}@${version}: already on the registry"
                continue
              fi
              id_token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:${host%/}" | jq -r '.value')"
              echo "::add-mask::${id_token}"
              NODE_AUTH_TOKEN="$(curl -fsS -X POST -H "Authorization: Bearer ${id_token}" \
                "${REGISTRY}-/npm/v1/oidc/token/exchange/package/${encoded}" | jq -r '.token')"
              echo "::add-mask::${NODE_AUTH_TOKEN}"
              export NODE_AUTH_TOKEN
              (cd "$dir" && pnpm publish --no-git-checks --access public --provenance --registry "$REGISTRY")
              unset NODE_AUTH_TOKEN
              # A tag left by an earlier run that published nothing is kept (run 40896627689); a new one is
              # annotated, so it carries its tagger and date (changesets/action has set the git user).
              git rev-parse -q --verify "refs/tags/${name}@${version}" >/dev/null || git tag -a "${name}@${version}" -m "${name}@${version}"
              # One git-tag event per publish: the action pushes the tag and creates the GitHub release from it.
              jq -nc --arg tag "${name}@${version}" --arg name "$name" '{type: "git-tag", tag: $tag, packageName: $name}' \
                >> "$CHANGESETS_OUTPUT"
              echo "New tag: ${name}@${version}"
            done
          SH

      # Packs every published package through the beforePacking hook; nothing leaves the runner.
      - name: Publish dry run
        if: inputs.dry-run
        env:
          REGISTRY: ${{ inputs.registry }}
        run: pnpm -r publish --dry-run --no-git-checks --registry "$REGISTRY"

      # ADR 0025 / 0119 D7: automation prepares, the owner decides. With pending changesets this opens or updates the
      # "chore(release): version packages" PR (`pnpm changeset:version` also refreshes the lockfile); the owner merges
      # it. On the merge run the registry script above publishes every package with "private": false to `registry`
      # with provenance and tags it; the action pushes the tags and creates the GitHub releases.
      - name: Version PR / publish
        id: changesets
        if: ${{ !inputs.dry-run }}
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset:version
          publish-script: bash ${{ runner.temp }}/registry-publish.sh
          pr-title: "chore(release): version packages"
          commit-message: "chore(release): version packages"
          github-token: ${{ steps.bot.outputs.token }}
        env:
          REGISTRY: ${{ inputs.registry }}
          NPM_CONFIG_PROVENANCE: "true"

      # The published list goes to the SBOM job as an artifact, not a job output: GitHub drops a job output that holds a
      # masked value, and a package name can (`@figentra-oss/flow`, run 41388316844: "Skip output 'packages'").
      - name: Published packages
        if: steps.changesets.outputs.published == 'true'
        env:
          PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: printf '%s\n' "$PACKAGES" > published-packages.json

      - name: Upload the published list
        if: steps.changesets.outputs.published == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-packages
          path: published-packages.json
          retention-days: 1

  # Runs only after a publish: the SBOM of what was installed, signed keylessly with this job's OIDC identity, kept as
  # an artifact and attached, with the tarballs' SHA-256 sums, to every release the publish created. No App token and
  # no npm access here (the tarballs are public reads).
  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: write # attach the SBOM, its signature and the checksums to the new releases
      id-token: write # cosign keyless signing (Sigstore Fulcio certificate for this workflow)
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: false

      - name: Toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          # Pinned: the action otherwise fetches its cached mise, whose release asset GitHub answered 504 for.
          version: 2026.11.4
          install_args: node pnpm

      - name: Install dependencies
        env:
          INSTALL_ARGS: ${{ inputs.install-args }}
        run: |
          set -f
          # shellcheck disable=SC2086 # word splitting of the argument list is the point
          pnpm install $INSTALL_ARGS

      # pnpm's own `sbom` reads the pnpm lockfile and store; cyclonedx-npm shelled out to `npm ls`, which cannot read a
      # pnpm tree and listed hundreds of false missing and invalid packages.
      - name: Generate SBOM (CycloneDX)
        run: pnpm sbom --sbom-format cyclonedx --out sbom.cdx.json

      # Keyless: the certificate names this workflow and repository, so a verifier pins both
      # (`cosign verify-blob --certificate-identity-regexp … --certificate-oidc-issuer https://token.actions.githubusercontent.com`).
      - name: Sign SBOM (cosign)
        run: >-
          mise exec aqua:sigstore/cosign@3.1.4 --
          cosign sign-blob --yes --bundle sbom.cdx.json.sigstore.json sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: |
            sbom.cdx.json
            sbom.cdx.json.sigstore.json
          retention-days: 90

      - name: Download the published list
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: published-packages

      # The tarballs exactly as the registry serves them, each checked against the integrity (sha512) the registry
      # computed at publish, then listed by SHA-256. A convenience: integrity rests on provenance and the SBOM.
      - name: Checksums (sha256sums.txt)
        env:
          REGISTRY: ${{ inputs.registry }}
        run: |
          set -euo pipefail
          mkdir tarballs
          jq -r '.[] | [.name, .version] | @tsv' published-packages.json | while IFS=$'\t' read -r name version; do
            dist="$(curl -fsS "${REGISTRY}${name/\//%2f}/${version}" | jq -c '.dist')"
            file="${name#@}"
            file="tarballs/${file//\//-}-${version}.tgz"
            curl -fsS -o "$file" "$(jq -r '.tarball' <<< "$dist")"
            [ "sha512-$(openssl dgst -sha512 -binary "$file" | base64 -w0)" = "$(jq -r '.integrity' <<< "$dist")" ] || {
              echo "::error title=Integrity::${name}@${version} differs from the registry's integrity"; exit 1; }
          done
          (cd tarballs && sha256sum -- *.tgz) > sha256sums.txt
          cat sha256sums.txt

      # changesets names each release after its tag, `<name>@<version>`.
      - name: Attach SBOM and checksums to the releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -r '.[] | "\(.name)@\(.version)"' published-packages.json | while read -r tag; do
            gh release upload "$tag" sbom.cdx.json sbom.cdx.json.sigstore.json sha256sums.txt --clobber
          done
