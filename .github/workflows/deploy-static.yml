# Stackra file contract:
# Purpose: deploy workers/static (the `stackra-static` Cloudflare Worker, static.stackra.figentra.com), the `static`
#          member of runway.yaml, through Runway's `cloudflare-workers` provider (runway-cloudflare-workers.yml, ADR 0352
#          decision 1, ADR 0284). Runs on main and on schema release tags only, never on a pull request; by hand (or
#          `pnpm runway promote <sha>`) it redeploys a given commit of main. The deployment message is the commit.
# Secrets: CLOUDFLARE_API_TOKEN comes from the sops scope ci/deploy, decrypted by the provider job as itself (ADR 0525).
#          No repository secret holds it (ADR 0019 D2).
# Owner: release-operations

name: Deploy static

on:
  push:
    branches: [main]
    # Only what changes the site: the member, the schema sources, this caller and its provider.
    paths:
      - "workers/static/**"
      - "tools/schemas/**"
      - ".github/workflows/deploy-static.yml"
      - ".github/workflows/runway-cloudflare-workers.yml"
    # A schema release (`schemas@1.4.0`) adds an immutable /schemas/1.4.0/ tree and moves /schemas/v1/.
    tags: ["schemas@*"]
  workflow_dispatch:
    inputs:
      sha:
        description: A commit of main to deploy (promote or roll back); empty deploys the branch head
        type: string
        default: ""

# One deploy at a time, in order: a newer run waits instead of cancelling one that is mid-upload.
concurrency:
  group: deploy-static
  cancel-in-progress: false

# ADR 0019 D2: nothing by default; the job grants what the provider's job asks for.
permissions: {}

jobs:
  # ADR 0468: production waits on the owner's one approval. The `production` environment (owner: required reviewer,
  # main and schemas@* tags only) holds no secret and grants nothing; the deploy job keeps the `static` environment,
  # whose name figentra/infra's secret callers grant (STA-1968, ADR 0525).
  approve:
    name: Owner approval (production)
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/schemas@')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions: {}
    steps:
      - name: Approved
        run: echo "production approved for ${GITHUB_SHA}"

  deploy:
    name: Deploy static.stackra.figentra.com
    needs: approve
    # workflow_dispatch can name any branch; only main or a schema release tag deploys. The provider also refuses a
    # commit that is not on main.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/schemas@')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/runway-cloudflare-workers.yml # zizmor: ignore[self-repository]
    with:
      member: static
      package: "@figentra/worker-static"
      # The `static` environment (owner: restrict it to main and schemas@* tags, STA-605) puts its name into the OIDC
      # subject, so figentra/infra can grant this job its scopes and nothing else.
      environment: static
      sha: ${{ inputs.sha }}
      # The licensed Pro postinstalls (ADR 0310) fail without the gate's tokens, so the two members that pull them
      # in are not installed; neither is deployed here.
      install-args: --frozen-lockfile --filter=!@figentra/mobile --filter=!@figentra/playground
