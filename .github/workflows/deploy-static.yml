# Stackra file contract:
# Purpose: deploy workers/static (the `stackra-static` Cloudflare Worker, static.stackra.figentra.com) through Runway's
#          `cloudflare-workers` provider, runway-cloudflare-workers.yml (ADR 0284, ADR 0289 decision 1). Runs on main
#          and on schema release tags only, never on a pull request; by hand (or `pnpm runway promote <sha>`) it
#          redeploys a given commit of main.
# Secrets: CLOUDFLARE_API_TOKEN comes from Infisical /ci (env prod) through GitHub OIDC inside the provider. No
#          repository secret holds it (ADR 0173, ADR 0019 D2). Without INFISICAL_CI_IDENTITY_ID the provider builds,
#          tests, prints a notice and deploys nothing, so main stays green.
# Owner: release-operations

name: Deploy static

on:
  push:
    branches: [main]
    # Only what changes the site: the member, the schema sources, this caller and its provider.
    paths:
      - "workers/static/**"
      - "tools/schemas/**"
      - ".github/workflows/deploy-static.yml"
      - ".github/workflows/runway-cloudflare-workers.yml"
    # A schema release (`schemas@1.4.0`) adds an immutable /schemas/1.4.0/ tree and moves /schemas/v1/.
    tags: ["schemas@*"]
  workflow_dispatch:
    inputs:
      sha:
        description: A commit of main to deploy (promote or roll back); empty deploys the branch head
        type: string
        default: ""

# One deploy at a time, in order: a newer run waits instead of cancelling one that is mid-upload.
concurrency:
  group: deploy-static
  cancel-in-progress: false

# ADR 0019 D2: nothing by default; the job grants what the provider's job asks for.
permissions: {}

jobs:
  deploy:
    name: Deploy static.stackra.figentra.com
    # workflow_dispatch can name any branch; only main or a schema release tag deploys. The provider also refuses a
    # commit that is not on main.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/schemas@')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/runway-cloudflare-workers.yml
    with:
      member: workers/static
      package: "@figentra/worker-static"
      # The `static` environment (owner: restrict it to main and schemas@* tags, STA-605) puts its name into the OIDC
      # subject, so the Infisical identity can trust this job and nothing else.
      environment: static
      sha: ${{ inputs.sha }}
      # The licensed Pro postinstalls (ADR 0310) fail without the gate's tokens, so the three members that pull them
      # in are not installed; none of them is deployed here.
      install-args: >-
        --frozen-lockfile --filter=!@figentra/mobile --filter=!@figentra/playground --filter=!@stackra-pro/ui
      infisical-identity-id: ${{ vars.INFISICAL_CI_IDENTITY_ID }}
      infisical-project-id: dd4724f4-7b9a-46ae-a899-b34af2d626b2 # .infisical.yaml workspace id, not a secret
      smoke-url: https://static.stackra.figentra.com/schemas/index.json
