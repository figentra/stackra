# Stackra file contract:
# Purpose: deploy workers/static (the `stackra-static` Cloudflare Worker), the `static` member of runway.yaml, through
#          Runway's `cloudflare-workers` provider (runway-cloudflare-workers.yml, ADR 0352 decision 1, ADR 0284). Since
#          the switch of 2026-11-05 (ADR 0284 amendment, STA-2111), `figentra-static` in figentra/figentra serves
#          static.figentra.com and static.stackra.figentra.com, and deploys core's schemas from there. This workflow
#          is the rollback path only, by hand: its wrangler deploy takes static.stackra.figentra.com back to
#          `stackra-static`. Removed with the member when the owner deletes `stackra-static`.
# Secrets: CLOUDFLARE_API_TOKEN comes from Infisical /ci (env prod) through GitHub OIDC inside the provider job. No
#          repository secret holds it (ADR 0173, ADR 0019 D2). Without INFISICAL_CI_IDENTITY_ID the job builds, prints
#          a notice and deploys nothing, so main stays green.
# Owner: release-operations

name: Deploy static

# By hand only: a push or a `schemas@*` tag no longer deploys, because any deploy of `stackra-static` moves the alias
# back from figentra-static. A schema change or tag reaches the hosts through figentra/figentra's deploy-static.yml.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: A commit of main to deploy (promote or roll back); empty deploys the branch head
        type: string
        default: ""

# One deploy at a time, in order: a newer run waits instead of cancelling one that is mid-upload.
concurrency:
  group: deploy-static
  cancel-in-progress: false

# ADR 0019 D2: nothing by default; the job grants what the provider's job asks for.
permissions: {}

jobs:
  # ADR 0468: production waits on the owner's one approval. The `production` environment (owner: required reviewer,
  # main and schemas@* tags only) holds no secret and grants nothing; the deploy job keeps the `static` environment,
  # whose name the Infisical identity trusts (STA-1968).
  approve:
    name: Owner approval (production)
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/schemas@')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions: {}
    steps:
      - name: Approved
        run: echo "production approved for ${GITHUB_SHA}"

  deploy:
    name: Deploy static.stackra.figentra.com
    needs: approve
    # workflow_dispatch can name any branch; only main or a schema release tag deploys. The provider also refuses a
    # commit that is not on main.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/schemas@')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/runway-cloudflare-workers.yml
    with:
      member: static
      package: "@figentra/worker-static"
      # The `static` environment (owner: restrict it to main and schemas@* tags, STA-605) puts its name into the OIDC
      # subject, so the Infisical identity can trust this job and nothing else.
      environment: static
      sha: ${{ inputs.sha }}
      # The licensed Pro postinstalls (ADR 0310) fail without the gate's tokens, so the two members that pull them
      # in are not installed; neither is deployed here.
      install-args: --frozen-lockfile --filter=!@figentra/mobile --filter=!@figentra/playground
      infisical-identity-id: ${{ vars.INFISICAL_CI_IDENTITY_ID }}
      infisical-project-id: ${{ vars.INFISICAL_DEPLOY_PROJECT_ID }}
