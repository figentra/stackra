# Stackra file contract:
# Purpose: proves a testbed image change on its pull request, before the owner spends an image build on it (STA-1953):
#          builds the job image from images/job/Dockerfile at its pinned defaults, runs the `testbed-images` component's
#          own validate commands against it, and warms a pnpm store from the four files WarmStore uploads with no
#          environment, then fetches offline from it, as the image's validate phase does. Advisory, never a required
#          check (ADR 0166 CI2).
# Secrets: none. Like the image build instance, the job has no token.
# Owner: release-operations

name: Testbed image

on:
  pull_request:
    paths:
      - packages/infrastructure/infra-testbed/images/**
      - packages/infrastructure/infra-testbed/src/core/constants/toolchain-pins.constant.ts
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .pnpmfile.mjs
      - .npmrc
      - .github/workflows/testbed-image.yml

concurrency:
  group: testbed-image-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  image:
    name: Testbed image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/infrastructure/infra-testbed
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: false

      - name: Toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          # Pinned: the action otherwise fetches its cached mise, whose release asset GitHub answered 504 for.
          version: 2026.11.4
          install_args: node pnpm

      # The job image with three browsers and the core store do not fit the runner's free disk otherwise.
      - name: Disk
        working-directory: /
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # No build context, as the `testbed-images` component builds it; the ARG defaults equal TOOLCHAIN_PINS (a unit
      # test keeps them so).
      - name: Job image
        run: docker build -t stackra-testbed-job:current - < images/job/Dockerfile

      - name: Job image checks (the component's validate phase)
        run: |
          arg() { sed -n "s/^ARG $1=//p" images/job/Dockerfile; }
          postgres=$(sed -n 's/^ *postgresImage: "\(.*\)",$/\1/p' src/core/constants/toolchain-pins.constant.ts)
          docker pull "$postgres"
          yq '.phases[] | select(.name == "validate") | .steps[].inputs.commands[]' \
            images/host/components/02-images.yml \
            | sed -e "s|@@NODE@@|$(arg NODE_VERSION)|g" -e "s|@@PNPM@@|$(arg PNPM_VERSION)|g" \
              -e "s|@@INFISICAL@@|$(arg INFISICAL_VERSION)|g" -e "s|@@SHFMT@@|$(arg SHFMT_VERSION)|g" \
              -e "s|@@ENCORE@@|$(arg ENCORE_VERSION)|g" -e "s|@@PLAYWRIGHT@@|$(arg PLAYWRIGHT_VERSION)|g" \
              -e "s|@@POSTGRES@@|$postgres|g" > "$RUNNER_TEMP/validate.sh"
          if grep -n '@@' "$RUNNER_TEMP/validate.sh"; then echo "::error::an unfilled placeholder"; exit 1; fi
          bash "$RUNNER_TEMP/validate.sh"

      # WarmStore, Clean and the offline check (03-agent.yml), from a shell with no environment: the build instance has
      # no licence token, so a fetch that ran an install script would fail here as it did there, and Clean empties every
      # home cache, so the offline check reads only the store and the metadata cache on /data.
      - name: Warm store with no environment
        working-directory: ${{ github.workspace }}
        run: |
          warm=$RUNNER_TEMP/warm
          mkdir -p "$warm" "$RUNNER_TEMP/home"
          cp pnpm-lock.yaml pnpm-workspace.yaml .pnpmfile.mjs .npmrc "$warm/"
          tools="$(dirname "$(mise which pnpm)"):$(dirname "$(mise which node)"):/usr/bin:/bin"
          cd "$warm"
          env -i PATH="$tools" HOME="$RUNNER_TEMP/home" PNPM_CONFIG_CACHE_DIR="$RUNNER_TEMP/cache" \
            pnpm fetch --ignore-scripts --store-dir "$RUNNER_TEMP/store"
          rm -rf node_modules "${RUNNER_TEMP:?}/home"
          mkdir -p "$RUNNER_TEMP/home"
          env -i PATH="$tools" HOME="$RUNNER_TEMP/home" PNPM_CONFIG_CACHE_DIR="$RUNNER_TEMP/cache" \
            pnpm fetch --offline --ignore-scripts --store-dir "$RUNNER_TEMP/store" >/dev/null

      # A job's install as the box agent runs it: in the job image, with the warm store and the metadata cache beside
      # it. Offline here, so a package the store lacks fails the check; scripts are skipped (no licence token). The
      # read-only attempt only reports: it shows whether pnpm can serve an install from a read-only store mount.
      - name: Job install from the warm store
        working-directory: ${{ github.workspace }}
        run: |
          install() {
            docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -e CI=true -e PNPM_CONFIG_CACHE_DIR=/pnpm-cache \
              -e PNPM_CONFIG_VERIFY_STORE_INTEGRITY=true \
              -v "$PWD:/work" -v "$RUNNER_TEMP/store:/pnpm-store$1" -v "$RUNNER_TEMP/cache:/pnpm-cache" \
              stackra-testbed-job:current sh -euc 'cd /work
                # A writable shared store is safe only while pnpm checks every file against the lockfile hashes.
                [ "$(pnpm config get verify-store-integrity)" = true ]
                rm -rf node_modules && pnpm install --offline --frozen-lockfile --ignore-scripts \
                  --store-dir /pnpm-store --package-import-method clone-or-copy'
          }
          if install :ro; then echo "::notice title=Store::a read-only store serves an install"
          else echo "::notice title=Store::a read-only store cannot serve an install; jobs mount it writable"; fi
          install ""
