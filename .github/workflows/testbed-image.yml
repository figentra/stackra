# Stackra file contract:
# Purpose: proves a testbed image change on its pull request, before the owner spends an image build on it (STA-1953):
#          builds the job image from images/job/Dockerfile at its pinned defaults, runs the `testbed-images` component's
#          own validate commands against it, and warms a pnpm store from the four files WarmStore uploads with no
#          environment, then fetches offline from it, as the image's validate phase does. Advisory, never a required
#          check (ADR 0166 CI2).
# Secrets: none. Like the image build instance, the job has no token.
# Owner: release-operations

name: Testbed image

on:
  pull_request:
    paths:
      - packages/infrastructure/infra-testbed/images/**
      - packages/infrastructure/infra-testbed/src/core/constants/toolchain-pins.constant.ts
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .pnpmfile.mjs
      - .npmrc
      - .github/workflows/testbed-image.yml

concurrency:
  group: testbed-image-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  image:
    name: Testbed image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/infrastructure/infra-testbed
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: false

      - name: Toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: node pnpm

      # The job image with three browsers and the core store do not fit the runner's free disk otherwise.
      - name: Disk
        working-directory: /
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # No build context, as the `testbed-images` component builds it; the ARG defaults equal TOOLCHAIN_PINS (a unit
      # test keeps them so).
      - name: Job image
        run: docker build -t stackra-testbed-job:current - < images/job/Dockerfile

      - name: Job image checks (the component's validate phase)
        run: |
          arg() { sed -n "s/^ARG $1=//p" images/job/Dockerfile; }
          postgres=$(sed -n 's/^ *postgresImage: "\(.*\)",$/\1/p' src/core/constants/toolchain-pins.constant.ts)
          docker pull "$postgres"
          yq '.phases[] | select(.name == "validate") | .steps[].inputs.commands[]' \
            images/host/components/02-images.yml \
            | sed -e "s|@@NODE@@|$(arg NODE_VERSION)|g" -e "s|@@PNPM@@|$(arg PNPM_VERSION)|g" \
              -e "s|@@INFISICAL@@|$(arg INFISICAL_VERSION)|g" -e "s|@@SHFMT@@|$(arg SHFMT_VERSION)|g" \
              -e "s|@@ENCORE@@|$(arg ENCORE_VERSION)|g" -e "s|@@PLAYWRIGHT@@|$(arg PLAYWRIGHT_VERSION)|g" \
              -e "s|@@POSTGRES@@|$postgres|g" > "$RUNNER_TEMP/validate.sh"
          if grep -n '@@' "$RUNNER_TEMP/validate.sh"; then echo "::error::an unfilled placeholder"; exit 1; fi
          bash "$RUNNER_TEMP/validate.sh"

      # WarmStore and its offline check (03-agent.yml), from a shell with no environment: the build instance has no
      # licence token, so a fetch that ran an install script would fail here as it did there.
      - name: Warm store with no environment
        working-directory: ${{ github.workspace }}
        run: |
          warm=$RUNNER_TEMP/warm
          mkdir -p "$warm" "$RUNNER_TEMP/home"
          cp pnpm-lock.yaml pnpm-workspace.yaml .pnpmfile.mjs .npmrc "$warm/"
          tools="$(dirname "$(mise which pnpm)"):$(dirname "$(mise which node)"):/usr/bin:/bin"
          cd "$warm"
          env -i PATH="$tools" HOME="$RUNNER_TEMP/home" pnpm fetch --ignore-scripts --store-dir "$RUNNER_TEMP/store"
          rm -rf node_modules
          env -i PATH="$tools" HOME="$RUNNER_TEMP/home" \
            pnpm fetch --offline --ignore-scripts --store-dir "$RUNNER_TEMP/store" >/dev/null
