# Stackra file contract:
# Purpose: the weekly load tier (ADR 0182 decision 4, STA-317): `pnpm test:load` runs every `.load.test.ts`, each of
#          which serves its subject (the action pipeline, the queue, the outbox relay) and drives it with k6 at a fixed
#          arrival rate, then checks every unit of work ran exactly once inside its ceilings. The weekly run soaks for
#          ten minutes a file; a manual run may set the duration and the rate (a whole number, refused otherwise). The
#          numbers each test measured are uploaded as the `load-reports` artifact, which the capacity runbook is read
#          from; a missing report fails the run, since a load test without k6 or Postgres skips instead of failing.
# Secrets: none. Postgres is a throwaway service container with trust auth on the runner's loopback; no sops scope, no
#          turbo remote cache (local cache only), no repository secret.
# Owner: release-operations
name: Load

on:
  schedule:
    # Mondays 03:17 UTC, off the hour so it does not queue behind every other scheduled job.
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      duration:
        description: How long each soak drives its subject (a k6 duration such as 30s, 10m or 1h)
        type: string
        default: 10m
      rate:
        description: Iterations a second for every soak (empty keeps each test's own rate)
        type: string
        default: ""

# One load run at a time: two would share the runner and halve each other's numbers.
concurrency:
  group: load
  cancel-in-progress: false

permissions: {}

jobs:
  load:
    name: Load tier (k6)
    runs-on: ubuntu-latest
    # The soaks run one after another (three files, two tests each): an hour's soak a file fits with its drains.
    timeout-minutes: 300
    permissions:
      contents: read
    services:
      postgres:
        # The testbed's Postgres (`postgresImage` in @stackra/infra-testbed's toolchain pins).
        image: postgres:17.6-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TESTBED_POSTGRES_HOST: localhost
      STACKRA_LOAD_REPORT_DIR: ${{ github.workspace }}/load-reports
      # Inputs reach the shell as environment values only, never as script text.
      STACKRA_LOAD_DURATION: ${{ inputs.duration || '10m' }}
      LOAD_RATE_INPUT: ${{ inputs.rate }}
      K6_VERSION: 1.3.0
      # Every report a full run writes (`writeLoadReport`); a missing one means its test skipped or never ran.
      LOAD_REPORTS: actions.pipeline queue.soak queue.ceiling outbox.relay outbox.ceiling
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: false

      - name: Toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          # Pinned: the action otherwise fetches its cached mise, whose release asset GitHub answered 504 for.
          version: 2026.11.4
          install_args: node pnpm

      # k6 is pinned here, not in mise.toml: only this job runs it (as Trivy and cosign in the release workflow).
      - name: k6
        run: |
          mise install "aqua:grafana/k6@${K6_VERSION}"
          k6="$(mise which k6 --tool "aqua:grafana/k6@${K6_VERSION}")"
          "$k6" version
          echo "STACKRA_K6=$k6" >> "$GITHUB_ENV"

      # A whole number of iterations a second, or the run stops here: nothing else reaches GITHUB_ENV.
      - name: Load rate
        if: env.LOAD_RATE_INPUT != ''
        run: |
          if [[ ! "${LOAD_RATE_INPUT}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=Load rate::the rate input must be a whole number of iterations a second"
            exit 1
          fi
          echo "STACKRA_LOAD_RATE=${LOAD_RATE_INPUT}" >> "$GITHUB_ENV"

      - name: Install dependencies (without the Uniwind Pro apps)
        run: pnpm install --frozen-lockfile --filter='!@figentra/mobile' --filter='!@figentra/playground'

      - name: Load tier
        run: pnpm test:load

      # A load test skips without k6 or Postgres, so a green tier proves nothing until every report is there.
      - name: Every load report written
        run: |
          missing=0
          for name in ${LOAD_REPORTS}; do
            if [[ ! -s "${STACKRA_LOAD_REPORT_DIR}/${name}.json" ]]; then
              echo "::error title=Load report missing::${name}.json was not written (its k6 or Postgres test skipped or never ran)"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Load reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-reports
          path: load-reports/
          if-no-files-found: error
          retention-days: 90
