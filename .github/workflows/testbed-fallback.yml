# Stackra file contract:
# Purpose: the testbed's fallback (ADR 0484 decision 11): when no testbed box is healthy, `stackra testbed run
#          --preset <name> --ref <ref>` dispatches this workflow to run one named preset (verify, e2e, integration) on
#          a GitHub-hosted runner for a pushed ref. Inputs are a preset name and a ref, never a command. Advisory only,
#          never a required check (ADR 0166 CI2).
# Secrets: the ci/build/turbo values, as the Quality Gate reads them (STA-1393), and UNIWIND_AUTH_TOKEN from ci/build
#          for the e2e preset only (ADR 0310), both decrypted by the job as itself (ADR 0525). No repository secret.
#          verify and integration install without the two Uniwind Pro apps, as the gate and a box do (#425): the
#          licensed download has a monthly quota. e2e needs the playground, so it installs everything.
# Owner: release-operations

name: Testbed fallback

on:
  workflow_dispatch:
    inputs:
      preset:
        description: The preset to run (verify, e2e or integration)
        type: choice
        options: [verify, e2e, integration]
        required: true

# One run per preset and ref; a newer dispatch waits instead of cancelling.
concurrency:
  group: testbed-fallback-${{ inputs.preset }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  run:
    name: Testbed fallback (${{ inputs.preset }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # GitHub OIDC for the sops decrypt of the licence and turbo tokens only (ADR 0525)
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: false

      - name: Toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          # Pinned: the action otherwise fetches its cached mise, whose release asset GitHub answered 504 for.
          version: 2026.11.4
          install_args: node pnpm

      - name: Uniwind Pro token (sops)
        if: inputs.preset == 'e2e'
        uses: ./.github/actions/secrets-decrypt
        with:
          scope: ci/build
          names: UNIWIND_AUTH_TOKEN

      - name: Turborepo remote cache (sops)
        uses: ./.github/actions/secrets-decrypt
        with:
          scope: ci/build/turbo

      # Uniwind Pro's CI licence has a monthly download quota: its postinstall reuses a tarball from UNIWIND_CACHE_DIR
      # after checking it against the checksum Uniwind publishes, so a restored entry can never be a changed build.
      # As ci.yml's mobile job: two peer variants run the postinstall, one at a time so the second reads the cache, and
      # the cache is saved right after the install.
      - name: Uniwind Pro cache directory
        if: inputs.preset == 'e2e'
        run: echo "UNIWIND_CACHE_DIR=$HOME/.uniwind/cache/pro" >> "$GITHUB_ENV"

      - name: Uniwind Pro download cache (restore)
        id: uniwind-cache
        if: inputs.preset == 'e2e'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.uniwind/cache/pro
          key: uniwind-pro-1-${{ runner.os }}-${{ hashFiles('pnpm-workspace.yaml') }}
          restore-keys: uniwind-pro-1-${{ runner.os }}-

      - name: Install dependencies
        if: inputs.preset == 'e2e'
        run: pnpm install --frozen-lockfile --child-concurrency=1

      # A failed or limited download leaves the directory without a package: saving it would store an empty entry
      # that every later run restores as a hit, never saving the real download (seen in #926's first run).
      - name: Uniwind Pro download cache (filled?)
        id: uniwind-filled
        if: ${{ !cancelled() && inputs.preset == 'e2e' }}
        run: |
          if find "$UNIWIND_CACHE_DIR" -type f ! -name '*.sha256' -size +100k 2>/dev/null | grep -q .; then
            echo "filled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Uniwind Pro download cache (save)
        if: ${{ !cancelled() && inputs.preset == 'e2e' && steps.uniwind-cache.outputs.cache-hit != 'true' && steps.uniwind-filled.outputs.filled == 'true' }}
        continue-on-error: true # another run may have saved the same key first
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.uniwind/cache/pro
          key: uniwind-pro-1-${{ runner.os }}-${{ hashFiles('pnpm-workspace.yaml') }}

      - name: Install dependencies (without the Uniwind Pro apps)
        if: inputs.preset != 'e2e'
        run: pnpm install --frozen-lockfile --filter='!@figentra/mobile' --filter='!@figentra/playground'

      - name: Verify
        if: inputs.preset == 'verify'
        run: pnpm verify

      - name: Integration tests
        if: inputs.preset == 'integration'
        run: pnpm test:int

      - name: Playground e2e
        if: inputs.preset == 'e2e'
        run: |
          pnpm --filter @figentra/playground exec playwright install --with-deps chromium
          pnpm --filter @figentra/playground test:e2e
