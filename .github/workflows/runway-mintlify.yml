# Stackra file contract:
# Purpose: Runway's `mintlify` provider (ADR 0299), a public reusable workflow (ADR 0168 decision 1): deploy a docs
#          member to Mintlify from CI after its checks. Builds the workspace packages the member's scripts need
#          (`build-first`, e.g. @stackra/cli for `stackra`), runs the member's check scripts (`stackra build`: gen
#          assembles `.stackra/site`, then `mint validate`; `stackra lint`: `mint broken-links` and `mint a11y`,
#          ADR 0002 2026-10-27 amendment), publishes the assembled `<member>/.stackra/site` to the `site-branch`
#          (default `docs-site`) as one appended commit with a `Source: <sha>` trailer (docs.json is generated and
#          gitignored, so Mintlify's checkout of main has none), triggers a Mintlify update
#          (`POST /v1/project/update/{projectId}`), polls it to `success` or `failure`, warns when Mintlify built
#          another commit than the one published, and smoke-tests the published pages. Mintlify builds its configured
#          branch, so callers run only on main. Callers set the branch with `site-branch:`; the Mintlify project's Git
#          settings must name the same branch, with root path `/`.
# Jobs: `build` (install, checks, upload the site; `contents: read`), `publish` (main only; downloads the artifact and
#          runs git only; the one job with `contents: write`, pushes `site-branch` and nothing else), `deploy` (after
#          publish: Mintlify update and smoke test; `contents: read`). The caller's job must grant `contents: write`
#          and `id-token: write`, since a called workflow's jobs cannot exceed the caller's grant.
# Secrets: MINTLIFY_ADMIN_KEY only, from the sops scope `scope` (ADR 0299 decision 3, ADR 0525), decrypted by the
#          deploy job alone as itself. Without a project id the job checks, prints a notice and deploys nothing. The
#          build job also decrypts STACKRA_REGISTRY_TOKEN (a read token for npm.stackra.figentra.com) from
#          ci/build/registry, so a product repo's install of @stackra and @figentra packages authenticates; pnpm 12
#          ignores a token in the repository's .npmrc.
# Owner: release-operations
name: Runway mintlify

on:
  workflow_call:
    inputs:
      member:
        description: The docs member folder (e.g. `apps/docs`); its scripts run the checks.
        type: string
        required: true
      package:
        description: The member's package name (e.g. `@figentra/docs`).
        type: string
        required: true
      environment:
        description: The GitHub environment the job runs in (its name is in the OIDC subject).
        type: string
        required: true
      check-scripts:
        description: The member's package scripts that must pass before a deploy, space-separated.
        type: string
        default: build lint
      build-first:
        description: A turbo filter of workspace packages to build before the checks (e.g. `@stackra/cli...`); empty builds nothing.
        type: string
        default: ""
      install-args:
        description: Arguments to `pnpm install`, space-separated words with no quoting.
        type: string
        default: --frozen-lockfile
      mintlify-project-id:
        description: The Mintlify project id (from the dashboard's API keys page; an id, not a secret). Empty skips the deploy.
        type: string
        default: ""
      scope:
        description: The figentra/secrets scope holding MINTLIFY_ADMIN_KEY, granted to the caller's environment.
        type: string
        default: ci/deploy
      site-url:
        description: The published site's origin (e.g. `https://docs.stackra.figentra.com`).
        type: string
        required: true
      site-branch:
        description: The generated branch the assembled site is published to, and that the Mintlify project builds.
        type: string
        default: docs-site
      smoke-pages:
        description: Paths that must answer 200 after the deploy, space-separated.
        type: string
        default: /
    outputs:
      deployed:
        description: "`true` when Mintlify reported `success`, `false` when the deploy was skipped."
        value: ${{ jobs.deploy.outputs.deployed == 'true' }}

# ADR 0019 D2: nothing by default; the job asks for what it needs (the caller's job must grant the same).
permissions: {}

jobs:
  build:
    name: Check ${{ inputs.member }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read # checkout; the install and the build run third-party code, so this job never writes
      id-token: write # GitHub OIDC token: the sops decrypt of ci/build/turbo and ci/build/registry (ADR 0525)
    env:
      MINTLIFY_PROJECT_ID: ${{ inputs.mintlify-project-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: false # .notes is a private owner-only submodule; CI never needs it (STA-178)

      # ADR 0027 D2: node and pnpm come from the caller's mise.toml.
      - name: Toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: node pnpm

      # A product repository installs @stackra and @figentra from the Stackra registry, which needs a read token in the
      # user-level ~/.npmrc (pnpm 12 ignores the repository .npmrc's token). Every figentra repository may decrypt
      # ci/build/registry (figentra/infra REGISTRY_READERS); core installs its own packages from the workspace.
      - name: Registry token (sops)
        # A repository whose packages all come from its workspace installs without it, so a refused decrypt must not
        # stop the job; a product that needs the token then fails at the install with the registry's 401.
        continue-on-error: true
        uses: figentra/stackra/.github/actions/secrets-decrypt@c8563c852108bb4759827e132b7e5b82b6ae33f4 # @stackra/runway@0.15.0
        with:
          scope: ci/build/registry
          names: STACKRA_REGISTRY_TOKEN

      - name: Registry token (user .npmrc)
        if: env.STACKRA_REGISTRY_TOKEN != ''
        run: |
          umask 077
          printf '//npm.stackra.figentra.com/:_authToken=%s\n' "$STACKRA_REGISTRY_TOKEN" >> "$HOME/.npmrc"

      - name: Install dependencies
        env:
          INSTALL_ARGS: ${{ inputs.install-args }}
        run: |
          set -f
          # shellcheck disable=SC2086 # word splitting of the argument list is the point
          pnpm install $INSTALL_ARGS

      # STA-1393: Turborepo remote cache (turbo.stackra.figentra.com). Exports TURBO_API, TURBO_TOKEN, TURBO_TEAM and
      # TURBO_REMOTE_CACHE_SIGNATURE_KEY from the sops scope ci/build/turbo (ADR 0525).
      - name: Turborepo remote cache (sops)
        if: inputs.build-first != ''
        uses: figentra/stackra/.github/actions/secrets-decrypt@c8563c852108bb4759827e132b7e5b82b6ae33f4 # @stackra/runway@0.15.0
        with:
          scope: ci/build/turbo

      - name: Build workspace tools
        if: inputs.build-first != ''
        env:
          BUILD_FIRST: ${{ inputs.build-first }}
        run: pnpm exec turbo run build --filter="$BUILD_FIRST"

      # ADR 0299 decision 2: validate, broken links and accessibility pass before anything is deployed.
      - name: Checks
        env:
          PACKAGE: ${{ inputs.package }}
          CHECK_SCRIPTS: ${{ inputs.check-scripts }}
        run: |
          for script in $CHECK_SCRIPTS; do
            pnpm --filter "$PACKAGE" run "$script"
          done

      - name: Upload site
        if: github.ref == 'refs/heads/main' && env.MINTLIFY_PROJECT_ID != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mintlify-site
          path: ${{ inputs.member }}/.stackra/site
          if-no-files-found: error
          include-hidden-files: true # the site tree may hold dot files
          retention-days: 1

      - name: Deploy prerequisites missing
        if: env.MINTLIFY_PROJECT_ID == ''
        run: >-
          echo "::notice title=Docs deploy skipped::No Mintlify project id was passed.
          Checked, nothing deployed."

  # Git only: no install, no third-party code beyond the pinned artifact download. Main only; the caller's
  # concurrency group serialises runs, so each run appends on top of the last.
  publish:
    name: Publish ${{ inputs.site-branch }}
    needs: build
    if: github.ref == 'refs/heads/main' && inputs.mintlify-project-id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    permissions:
      contents: write # push the generated site branch only; main is never written
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - name: Download site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mintlify-site
          path: site

      # Mintlify builds a Git branch and docs.json is generated into the gitignored `.stackra/site`, so the checked
      # tree is published to `site-branch`: one commit per run on top of the branch's history (no force push).
      - name: Publish site branch
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_BRANCH: ${{ inputs.site-branch }}
          SHA: ${{ github.sha }}
        run: |
          case "$SITE_BRANCH" in
            main | master | refs/*) echo "::error::site-branch must not be main, master or a ref path: $SITE_BRANCH"; exit 1 ;;
          esac
          git check-ref-format --branch "$SITE_BRANCH" > /dev/null || { echo "::error::site-branch is not a valid branch name"; exit 1; }
          [ -f site/docs.json ] || { echo "::error::the artifact has no docs.json; the build did not assemble the site"; exit 1; }
          echo "::add-mask::$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          work="$(mktemp -d)"
          git -C "$work" init --quiet
          git -C "$work" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if git -C "$work" -c http.extraheader="$header" fetch --quiet --depth=1 origin "$SITE_BRANCH"; then
            git -C "$work" checkout --quiet -B "$SITE_BRANCH" FETCH_HEAD
            git -C "$work" rm --quiet -r -f --ignore-unmatch .
          else
            git -C "$work" checkout --quiet --orphan "$SITE_BRANCH" # first publish: the branch does not exist yet
          fi
          tar -C site --exclude=.git --exclude=.github -cf - . | tar -C "$work" -xf -
          git -C "$work" add -A
          if git -C "$work" diff --cached --quiet; then
            echo "Site unchanged on $SITE_BRANCH"
          else
            git -C "$work" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "docs: publish site from $SHA" -m "Source: $SHA"
            git -C "$work" -c http.extraheader="$header" push --quiet origin "HEAD:refs/heads/$SITE_BRANCH"
          fi
          echo "sha=$(git -C "$work" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ inputs.member }}
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write # GitHub OIDC token: the sops decrypt of MINTLIFY_ADMIN_KEY (ADR 0525)
    outputs:
      deployed: ${{ steps.deploy.outcome == 'success' }}
    env:
      MINTLIFY_PROJECT_ID: ${{ inputs.mintlify-project-id }}
    steps:
      - name: Toolchain for the decrypt (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          # Nothing is checked out in this job, so the node the decrypt runs on is named here (core's mise.toml pin).
          mise_toml: |
            [tools]
            node = "24.22.0"

      - name: Mintlify admin key (sops)
        uses: figentra/stackra/.github/actions/secrets-decrypt@c8563c852108bb4759827e132b7e5b82b6ae33f4 # @stackra/runway@0.15.0
        with:
          scope: ${{ inputs.scope }}
          names: MINTLIFY_ADMIN_KEY

      # Mintlify builds the site branch head; a different commit than the one this run published is a warning (a
      # later run published over it and passed its own gate), not a failure.
      - name: Mintlify update
        id: deploy
        env:
          API: https://api.mintlify.com/v1/project
          SHA: ${{ needs.publish.outputs.sha }}
        run: |
          auth="Authorization: Bearer $MINTLIFY_ADMIN_KEY"
          status_id="$(curl --fail-with-body --silent --show-error -X POST -H "$auth" "$API/update/$MINTLIFY_PROJECT_ID" | jq -r .statusId)"
          if [ -z "$status_id" ] || [ "$status_id" = null ]; then echo "::error::Mintlify returned no statusId"; exit 1; fi
          echo "Mintlify update $status_id queued for $SHA"
          for attempt in $(seq 1 90); do
            body="$(curl --fail-with-body --silent --show-error -H "$auth" "$API/update-status/$status_id")"
            status="$(jq -r .status <<< "$body")"
            case "$status" in
              success)
                built="$(jq -r '.commit.sha // empty' <<< "$body")"
                [ -z "$built" ] || [ "$built" = "$SHA" ] ||
                  echo "::warning title=Newer commit deployed::Mintlify built $built, this run is $SHA"
                echo "::notice title=Docs deployed::update $status_id, commit ${built:-unknown}"
                exit 0 ;;
              failure)
                echo "::error title=Mintlify update failed::$(jq -r '.summary // "no summary"' <<< "$body")"
                exit 1 ;;
              *)
                echo "update $status (attempt $attempt of 90)"
                sleep 10 ;;
            esac
          done
          echo "::error title=Mintlify update timed out::$status_id did not finish in 15 minutes"
          exit 1

      # ADR 0299 decision 4: a deploy that does not serve its pages fails the job. The CDN may lag the build, so each
      # page gets attempts, and each failure says what it answered.
      - name: Smoke test
        if: steps.deploy.outcome == 'success'
        env:
          MINTLIFY_ADMIN_KEY: "" # the key stays with the deploy step
          SITE_URL: ${{ inputs.site-url }}
          SMOKE_PAGES: ${{ inputs.smoke-pages }}
        run: |
          for page in $SMOKE_PAGES; do
            for attempt in $(seq 1 12); do
              code="$(curl --silent --output /dev/null --write-out '%{http_code}' --location --max-time 10 "$SITE_URL$page" || true)"
              [ "$code" = 200 ] && break
              echo "not serving yet: $SITE_URL$page answered ${code:-nothing} (attempt $attempt of 12)"
              [ "$attempt" = 12 ] && { echo "::error title=Smoke test failed::$SITE_URL$page"; exit 1; }
              sleep 10
            done
            echo "$SITE_URL$page answered 200"
          done
