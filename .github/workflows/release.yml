# Stackra file contract:
# Purpose: release on every push to main (and workflow_dispatch with `dry_run`) through Runway's `npm` provider,
#          runway-npm.yml: with pending changesets it opens or updates the "version packages" PR as stackra-bot; on that
#          PR's merge it publishes the public @stackra/* packages to the Stackra registry with provenance, then attaches
#          a signed CycloneDX SBOM to each release. One gate per release (ADR 0468, owner decision 2026-10-28): the run
#          that publishes runs in the protected `release` environment, whose required reviewer is the owner, so it shows
#          "waiting" until the owner approves it (runbook, release). The `gate` job picks that environment only for the
#          version PR's squash merge; every other run (opening the version PR, a push with nothing new, a dry run) runs
#          in `release-pr`, which has no reviewer and which the registry never accepts a publish from.
#          An agent merges the version PR through `pnpm pr:merge` like any PR (ADR 0119 D7 retired by ADR 0468).
#          The registry's trusted publisher row names THIS file, `refs/heads/main` and the `release` environment.
#          A second path, workflow_dispatch with `prerelease` on main (owner decision D8, stackra-212): the `prerelease`
#          job publishes only the `packages` filter (default: the five *-config presets) at `<base>-<dist_tag>.<run
#          number>` (0.1.0-next.<n>) under the `dist_tag` (default `next`). The version is set on the runner only: no
#          commit, no tag, no version PR, nothing pushed. The normal `release` job does not run on that dispatch.
#          The prerelease job still waits on `release`, because the publisher row names that environment; it moves to an
#          unprotected environment once the registry has a row for it (ADR 0468, plan).
#          A third path, workflow_dispatch with `deprecate` on main (ADR 0522 decision 3): the `deprecate` job marks
#          every published version of the one `deprecate_package` deprecated with `deprecate_message`, through the same
#          registry exchange, in `release` (the owner approves it). Versions stay immutable and installable; nothing
#          else runs on that dispatch.
# Boundary: the registry URL is set only in this file (the release job's `registry`, the root runway's
#           `providers.npm.registry`, and the prerelease and deprecate jobs' REGISTRY); no member's publishConfig names one. Never
#           npmjs, never Keygen (ADR 0453).
# Runtime: GitHub Actions
# Governing contract: ADR 0453 (decisions 6, 7); ADR 0168; ADR 0174; ADR 0177 (PK5, the fixed version group); ADR 0468.
# Owner: release-operations
# Secrets: STACKRA_BOT_APP_ID / STACKRA_BOT_PRIVATE_KEY (repository secrets, the stackra-bot app token, owner
#          decision A1), passed to the provider until the provider decrypts them from the sops scope
#          ci/production/release (ADR 0525); then the `secrets:` block goes (STA-1747). Publishing uses GitHub OIDC
#          exchanged at the registry; no token.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run `pnpm -r publish --dry-run` (no version PR, no publish) in the release-pr environment (no approval)"
        type: boolean
        default: false
      prerelease:
        description: "Prerelease only the `packages` below under `dist_tag` (no version PR, nothing committed)"
        type: boolean
        default: false
      packages:
        description: "Prerelease: space-separated package names to publish"
        type: string
        default: >-
          @stackra/commitlint-config @stackra/oxlint-config @stackra/tsdown-config @stackra/typescript-config
          @stackra/vitest-config
      dist_tag:
        description: "Prerelease: the dist-tag and the prerelease identifier (never `latest`)"
        type: string
        default: next
      base_version:
        description: "Prerelease: the release the prerelease leads to (one fixed version, ADR 0177 PK5)"
        type: string
        default: 0.1.0
      deprecate:
        description: "Deprecate every published version of `deprecate_package` (nothing is published)"
        type: boolean
        default: false
      deprecate_package:
        description: "Deprecate: the one @stackra/* package"
        type: string
        default: ""
      deprecate_message:
        description: "Deprecate: the message npm shows on install"
        type: string
        default: ""

# One release run per ref and kind at a time: a second run starting before this one finishes
# would version the same changesets twice. The version PR's squash merge publishes, and only its
# own run can (the gate below), so it gets its own group: GitHub keeps one pending run per group,
# and a later push to main cancelled a publish run that was pending in the shared group (0.27.0).
# A publish run versions nothing, so it never races a `pr` run. workflow_dispatch has no
# head_commit and stays in `pr`.
concurrency:
  group: "release-${{ github.ref }}-${{ startsWith(github.event.head_commit.message, 'chore(release): version packages') && 'publish' || 'pr' }}"
  cancel-in-progress: false

# ADR 0019 D2: nothing by default; the job grants what the provider's jobs ask for.
permissions: {}

jobs:
  # ADR 0468: the owner approves the publish, nothing else. Only the version PR's squash merge (no changeset pending,
  # subject "chore(release): version packages") runs in `release`; every other run, which opens the version PR or finds
  # every version already on the registry (the publish script skips those), runs in `release-pr`. If this pick were
  # ever wrong, a publish from `release-pr` fails at the registry, whose publisher row names `release` (fail closed).
  gate:
    name: Release gate
    if: ${{ !inputs.prerelease && !inputs.deprecate }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read .changeset at the pushed commit
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: false # .notes is a private owner-only submodule; CI never needs it (STA-178)
          sparse-checkout: .changeset

      - name: Pick the environment
        id: pick
        env:
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          pending="$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md | wc -l)"
          subject="$(git log -1 --format=%s)"
          # Only the squash merge of the version PR (runway-npm.yml's pr-title) has anything new to publish.
          environment=release-pr
          if [ "$DRY_RUN" != true ] && [ "$pending" -eq 0 ] && [[ "$subject" == "chore(release): version packages"* ]]; then
            environment=release
          fi
          echo "::notice title=Release gate::${pending} pending changesets, environment ${environment}"
          echo "environment=${environment}" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: gate
    # A prerelease or deprecate dispatch runs a job below instead; a push has no inputs, so this is true for every push.
    if: ${{ !inputs.prerelease && !inputs.deprecate }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/runway-npm.yml # zizmor: ignore[self-repository]
    with:
      environment: ${{ needs.gate.outputs.environment }}
      # The licensed Pro postinstalls (ADR 0310) fail without the gate's tokens, so the two members that pull them
      # in are not installed; neither is published.
      install-args: --frozen-lockfile --filter=!@figentra/mobile --filter=!@figentra/playground
      # Only what is published: the packages (@stackra-pro/ui lives in figentra/stackra-pro since ADR 0461).
      build-args: --filter=./packages/**
      dry-run: ${{ inputs.dry_run == true }}
      # The one place the registry is set: runway.yaml `providers.npm.registry` (ADR 0453).
      registry: https://npm.stackra.figentra.com/
    secrets:
      app-id: ${{ secrets.STACKRA_BOT_APP_ID }}
      app-private-key: ${{ secrets.STACKRA_BOT_PRIVATE_KEY }}

  # The prerelease path (stackra-212). The same registry exchange as runway-npm.yml's registry script, per package:
  # this file, refs/heads/main and the `release` environment are what the publisher row matches, so the job runs here
  # and only on main. Changesets is not used: `changeset version --snapshot` versions from 0.0.0 or from the pending
  # bumps and cannot give 0.1.0-next.<n> while every member already says 0.1.0, so the runner's package.json files
  # get the version directly and are thrown away with the runner.
  # ADR 0468: a prerelease is a staging publish and should need no approval; it waits on `release` only until the
  # registry has a publisher row for an unprotected `prerelease` environment (workers/registry migration, plan).
  prerelease:
    name: Prerelease
    if: ${{ inputs.prerelease && !inputs.deprecate && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read # checkout
      id-token: write # the registry's OIDC exchange and the Sigstore provenance of each tarball
    env:
      PACKAGES: ${{ inputs.packages }}
      DIST_TAG: ${{ inputs.dist_tag }}
      BASE_VERSION: ${{ inputs.base_version }}
      REGISTRY: https://npm.stackra.figentra.com/
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false # nothing is pushed
          submodules: false # .notes is a private owner-only submodule; CI never needs it (STA-178)

      - name: Toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          # Pinned: the action otherwise fetches its cached mise, whose release asset GitHub answered 504 for.
          version: 2026.11.4
          install_args: node pnpm

      # Inputs arrive through the environment and are checked before use (zizmor template-injection).
      - name: Inputs
        id: inputs
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          [[ "$DIST_TAG" =~ ^[a-z][a-z0-9-]*$ && "$DIST_TAG" != latest ]] || {
            echo "::error title=dist_tag::must be lower-case letters, digits or '-', and never latest"; exit 1; }
          [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error title=base_version::must be x.y.z"; exit 1; }
          filters=""
          for name in $PACKAGES; do
            [[ "$name" =~ ^@stackra/[a-z0-9][a-z0-9-]*$ ]] || {
              echo "::error title=packages::$name is not an @stackra/* package name"; exit 1; }
            filters="$filters --filter=$name"
          done
          [ -n "$filters" ] || { echo "::error title=packages::empty"; exit 1; }
          echo "filters=${filters# }" >> "$GITHUB_OUTPUT"
          echo "version=${BASE_VERSION}-${DIST_TAG}.${RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      # ADR 0174, as the normal release: a critical vulnerability with a released fix blocks the publish.
      - name: Vulnerability scan (Trivy)
        run: >-
          mise exec aqua:aquasecurity/trivy@0.76.1 --
          trivy fs --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress .

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter=!@figentra/mobile --filter=!@figentra/playground

      # STA-1393: Turborepo remote cache (turbo.stackra.figentra.com). Exports TURBO_API, TURBO_TOKEN, TURBO_TEAM and
      # TURBO_REMOTE_CACHE_SIGNATURE_KEY from the sops scope ci/build/turbo (ADR 0525). The cache only speeds the build,
      # so a caller without the turbo grant builds with the local cache instead of failing the release.
      - name: Turborepo remote cache (sops)
        continue-on-error: true
        uses: ./.github/actions/secrets-decrypt # zizmor: ignore[self-repository]
        with:
          scope: ci/build/turbo

      - name: Build
        env:
          FILTERS: ${{ steps.inputs.outputs.filters }}
        run: |
          set -f
          # shellcheck disable=SC2086 # word splitting of the filter list is the point
          pnpm turbo run build $FILTERS

      # Runner-only: every selected package gets the one prerelease version, so pnpm publish rewrites a workspace:*
      # reference between them to it. A workspace dependency outside the filter keeps its own version (runbook).
      - name: Prerelease version
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
        run: |
          set -euo pipefail
          found=0
          while IFS=$'\t' read -r name private dir; do
            case " $PACKAGES " in *" $name "*) ;; *) continue ;; esac
            [ "$private" != true ] || { echo "::error title=private::$name is private and is never published"; exit 1; }
            jq --arg v "$VERSION" '.version = $v' "$dir/package.json" > "$RUNNER_TEMP/package.json"
            mv "$RUNNER_TEMP/package.json" "$dir/package.json"
            echo "$name -> $VERSION"
            found=$((found + 1))
          done < <(pnpm -r ls --depth -1 --json | jq -r '.[] | [.name, (.private // false | tostring), .path] | @tsv')
          [ "$found" -eq "$(wc -w <<< "$PACKAGES")" ] || {
            echo "::error title=packages::a package in the filter is not in the workspace"; exit 1; }

      # Per package: a GitHub ID token (audience npm:<host>) exchanged for a publish token bound to that one name
      # (ADR 0453 decision 6), masked and passed as NODE_AUTH_TOKEN; ~/.npmrc names the variable, never the value.
      - name: Publish
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
        run: |
          set -euo pipefail
          # A stalled TLS handshake waited curl's 300 s default and failed run 40891451236: bound each call and
          # retry the transient failures (timeouts, 429, 5xx); a 404 still answers at once.
          curl() { command curl --connect-timeout 20 --max-time 90 --retry 4 --retry-delay 5 "$@"; }
          host="${REGISTRY#https://}"
          # shellcheck disable=SC2016 # the literal ${NODE_AUTH_TOKEN} is the point
          printf '//%s:_authToken=${NODE_AUTH_TOKEN}\n' "$host" >> ~/.npmrc
          while IFS=$'\t' read -r name dir; do
            case " $PACKAGES " in *" $name "*) ;; *) continue ;; esac
            encoded="${name/\//%2f}"
            # Versions are immutable (ADR 0453 decision 7): a re-run skips what it already published.
            if curl -fsS -o /dev/null "${REGISTRY}${encoded}/${VERSION}"; then
              echo "skip ${name}@${VERSION}: already on the registry"
              continue
            fi
            id_token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:${host%/}" | jq -r '.value')"
            echo "::add-mask::${id_token}"
            NODE_AUTH_TOKEN="$(curl -fsS -X POST -H "Authorization: Bearer ${id_token}" \
              "${REGISTRY}-/npm/v1/oidc/token/exchange/package/${encoded}" | jq -r '.token')"
            echo "::add-mask::${NODE_AUTH_TOKEN}"
            export NODE_AUTH_TOKEN
            (cd "$dir" && pnpm publish --no-git-checks --access public --provenance --tag "$DIST_TAG" \
              --registry "$REGISTRY")
            unset NODE_AUTH_TOKEN
            echo "::notice title=Published::${name}@${VERSION} (${DIST_TAG})"
          done < <(pnpm -r ls --depth -1 --json | jq -r '.[] | [.name, .path] | @tsv')

  # ADR 0522 decision 3: a package that moved is deprecated, never deleted (versions are immutable, ADR 0453 decision 7).
  # The registry takes a deprecation as a PUT without an attachment from a publish token for that one name, which only
  # this file, on main, in `release` can get (the publisher row), so the owner's approval of `release` is the gate.
  deprecate:
    name: Deprecate
    if: ${{ inputs.deprecate && !inputs.prerelease && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      id-token: write # the registry's OIDC exchange
    env:
      PACKAGE: ${{ inputs.deprecate_package }}
      MESSAGE: ${{ inputs.deprecate_message }}
      REGISTRY: https://npm.stackra.figentra.com/
    steps:
      # Inputs arrive through the environment and are checked before use (zizmor template-injection).
      - name: Inputs
        run: |
          [[ "$PACKAGE" =~ ^@stackra/[a-z0-9][a-z0-9-]*$ ]] || {
            echo "::error title=deprecate_package::$PACKAGE is not an @stackra/* package name"; exit 1; }
          [ -n "$MESSAGE" ] && [ "${#MESSAGE}" -le 200 ] || {
            echo "::error title=deprecate_message::give a message of at most 200 characters"; exit 1; }

      - name: Deprecate every published version
        run: |
          set -euo pipefail
          curl() { command curl --connect-timeout 20 --max-time 90 --retry 4 --retry-delay 5 "$@"; }
          host="${REGISTRY#https://}"
          encoded="${PACKAGE/\//%2f}"
          curl -fsS -o /dev/null "${REGISTRY}${encoded}" || {
            echo "::error title=deprecate_package::${PACKAGE} is not on the registry"; exit 1; }
          id_token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:${host%/}" | jq -r '.value')"
          echo "::add-mask::${id_token}"
          NODE_AUTH_TOKEN="$(curl -fsS -X POST -H "Authorization: Bearer ${id_token}" \
            "${REGISTRY}-/npm/v1/oidc/token/exchange/package/${encoded}" | jq -r '.token')"
          echo "::add-mask::${NODE_AUTH_TOKEN}"
          export NODE_AUTH_TOKEN
          # shellcheck disable=SC2016 # the literal ${NODE_AUTH_TOKEN} is the point
          printf '//%s:_authToken=${NODE_AUTH_TOKEN}\n' "$host" >> ~/.npmrc
          npm deprecate "${PACKAGE}@*" "$MESSAGE" --registry "$REGISTRY"
          echo "::notice title=Deprecated::${PACKAGE}: ${MESSAGE}"
