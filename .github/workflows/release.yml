name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run `pnpm -r publish --dry-run` (no version PR, no publish) in the release environment"
        type: boolean
        default: false

# One release run per ref at a time: a second run starting before this one finishes
# would version the same changesets twice.
concurrency: release-${{ github.ref }}

# ADR 0019 D2: nothing by default; the job below asks for what it needs.
permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Runbook (apps/docs/src/runbooks/release.mdx, "Before the first release"): a human
    # configures this environment as protected and restricted to main, so a branch that
    # edits the workflow cannot obtain a credential.
    environment: release
    permissions:
      contents: write # push the version-PR branch and the version tags
      pull-requests: write # open and update the version PR
      id-token: write # ADR 0177 amendment: pnpm trusted publishing (GitHub OIDC) and the provenance statement; no npm token

    steps:
      # stackra-bot token (owner decision A1): a version PR pushed with GITHUB_TOKEN never triggers the
      # Quality Gate, so it could not merge. Scoped to what this job needs; revoked when the job ends.
      - name: Bot token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.STACKRA_BOT_APP_ID }}
          private-key: ${{ secrets.STACKRA_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ steps.bot.outputs.token }} # pushes (version branch, tags) go out as the bot
          fetch-depth: 0 # changesets diffs against history and reads existing tags
          submodules: false # .notes is a private owner-only submodule; CI never needs it (STA-178)

      # ADR 0027 D2: node and pnpm come from mise.toml.
      - name: Toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ADR 0025 / 0119 D7: automation prepares, the owner decides. With pending changesets this opens or updates the
      # "chore(release): version packages" PR (`pnpm changeset:version` also refreshes the lockfile); Claude prepares
      # it and the owner merges it. Only packages are versioned — apps and services deploy by commit SHA
      # (`privatePackages: { version: false, tag: false }`). On the merge run `changeset publish` (pnpm native publish) (after the Build step
      # above, which produces each dist) publishes every package with "private": false to npmjs
      # with provenance and tags it; the action pushes the tags and creates the GitHub releases.
      - name: Build
        run: pnpm build

      - name: Publish dry run
        if: inputs.dry_run == true
        run: pnpm -r publish --dry-run --no-git-checks

      - name: Version PR / publish
        if: inputs.dry_run != true
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset:version
          publish-script: pnpm changeset publish
          pr-title: "chore(release): version packages"
          commit-message: "chore(release): version packages"
          github-token: ${{ steps.bot.outputs.token }}
        env:
          # changesets runs pnpm 12's native publish (`pnpm changeset publish` -> `pnpm publish`): it resolves
          # workspace:/catalog: versions and does the OIDC exchange and provenance itself, not the npm CLI.
          # No NPM_TOKEN exists anywhere (ADR 0177 amendment).
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_PROVENANCE: "true"

  # The SBOM job holds no id-token and no write permission: it only reads the repository.
  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: false

      - name: Toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # SBOM covers what actually got installed (node_modules), independent of whether this
      # run released. `--ignore-npm-errors` is required because cyclonedx-npm shells out to
      # `npm ls` internally, which reports the devDependency-only peer graphs of transitive
      # tools as errors even though pnpm installed fine. The tool is pinned via npx because
      # it is not a workspace catalog dependency.
      - name: Generate SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --ignore-npm-errors --output-format JSON --output-file sbom.cdx.json

      - name: Upload SBOM as release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90
