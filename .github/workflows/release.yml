# Stackra file contract:
# Purpose: release on every push to main (and workflow_dispatch with `dry_run` or `bootstrap`) through Runway's `npm`
#          provider, runway-npm.yml: with pending changesets it opens or updates the "version packages" PR as
#          stackra-bot; on that PR's merge it publishes the public packages to npmjs with provenance, then attaches a
#          signed CycloneDX SBOM to each release. The job runs in the protected `release` environment, which needs a
#          required reviewer's approval: a run shows "waiting" until the owner approves it, by design (runbook, release).
#          npm trusted publishing checks THIS file's name, so every package's trusted publisher names `release.yml`.
# Owner: release-operations
# Secrets: STACKRA_BOT_APP_ID / STACKRA_BOT_PRIVATE_KEY (repository secrets, the stackra-bot app token, owner
#          decision A1), passed to the provider. npm publishing uses GitHub OIDC; no npm token, except the owner's
#          one-time NPM_BOOTSTRAP_TOKEN in Infisical /ci, read only by a `bootstrap` dispatch (ADR 0289 decision 11).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run `pnpm -r publish --dry-run` (no version PR, no publish) in the release environment"
        type: boolean
        default: false
      bootstrap:
        description: "First publish of a package (OP2): use NPM_BOOTSTRAP_TOKEN from Infisical /ci"
        type: boolean
        default: false

# One release run per ref at a time: a second run starting before this one finishes
# would version the same changesets twice.
concurrency: release-${{ github.ref }}

# ADR 0019 D2: nothing by default; the job grants what the provider's jobs ask for.
permissions: {}

jobs:
  release:
    name: Release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/runway-npm.yml
    with:
      environment: release
      # The licensed Pro postinstalls (ADR 0310) fail without the gate's tokens, so the three members that pull them
      # in are not installed; none of them is published.
      install-args: >-
        --frozen-lockfile --filter=!@figentra/mobile --filter=!@figentra/playground --filter=!@stackra/ui-pro
      # Only what is published: the packages. The private HeroUI Pro wrapper (ADR 0310) is never published here.
      build-args: --filter=./packages/** --filter=!@stackra/ui-pro
      dry-run: ${{ inputs.dry_run == true }}
      bootstrap: ${{ inputs.bootstrap == true }}
      infisical-identity-id: ${{ vars.INFISICAL_CI_IDENTITY_ID }}
      infisical-project-id: dd4724f4-7b9a-46ae-a899-b34af2d626b2 # .infisical.yaml workspace id, not a secret
    secrets:
      app-id: ${{ secrets.STACKRA_BOT_APP_ID }}
      app-private-key: ${{ secrets.STACKRA_BOT_PRIVATE_KEY }}
