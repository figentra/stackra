# Stackra file contract:
# Purpose: release on every push to main (and workflow_dispatch with `dry_run`) through Runway's `npm` provider,
#          runway-npm.yml: with pending changesets it opens or updates the "version packages" PR as stackra-bot; on that
#          PR's merge it publishes the public @stackra/* packages to the Stackra registry with provenance, then attaches
#          a signed CycloneDX SBOM to each release. The job runs in the protected `release` environment, which needs a
#          required reviewer's approval: a run shows "waiting" until the owner approves it, by design (runbook, release).
#          The registry's trusted publisher row names THIS file, `refs/heads/main` and the `release` environment.
# Boundary: the registry URL is set here once (`registry`, the root runway's `providers.npm.registry`); no member's
#           publishConfig names one. Never npmjs, never Keygen (ADR 0453).
# Runtime: GitHub Actions
# Governing contract: ADR 0453 (decision 6); ADR 0168; ADR 0177 (PK5, the fixed version group).
# Owner: release-operations
# Secrets: STACKRA_BOT_APP_ID / STACKRA_BOT_PRIVATE_KEY (repository secrets, the stackra-bot app token, owner
#          decision A1), passed to the provider. Publishing uses GitHub OIDC exchanged at the registry; no token.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run `pnpm -r publish --dry-run` (no version PR, no publish) in the release environment"
        type: boolean
        default: false

# One release run per ref at a time: a second run starting before this one finishes
# would version the same changesets twice.
concurrency: release-${{ github.ref }}

# ADR 0019 D2: nothing by default; the job grants what the provider's jobs ask for.
permissions: {}

jobs:
  release:
    name: Release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/runway-npm.yml
    with:
      environment: release
      # The licensed Pro postinstalls (ADR 0310) fail without the gate's tokens, so the three members that pull them
      # in are not installed; none of them is published.
      install-args: >-
        --frozen-lockfile --filter=!@figentra/mobile --filter=!@figentra/playground --filter=!@stackra-pro/ui
      # Only what is published: the packages. The private HeroUI Pro wrapper (ADR 0310, 0461) is never published here.
      build-args: --filter=./packages/** --filter=!@stackra-pro/ui
      dry-run: ${{ inputs.dry_run == true }}
      # The one place the registry is set: runway.yaml `providers.npm.registry` (ADR 0453).
      registry: https://npm.stackra.figentra.com/
    secrets:
      app-id: ${{ secrets.STACKRA_BOT_APP_ID }}
      app-private-key: ${{ secrets.STACKRA_BOT_PRIVATE_KEY }}
