# Vague terms the spec gate flags in FR and AC lines: a failure on a big spec, a warning on small and feature.
# Each word carries an example of the measurable statement that replaces it.
words:
  - word: "fast"
    example: "WHEN a page loads THE server SHALL answer within 200 ms at p95"
  - word: "quickly"
    example: "WHEN a job is queued THE worker SHALL start it within 5 s"
  - word: "slow"
    example: "IF a call takes over 2 s THEN THE client SHALL show a spinner"
  - word: "efficient"
    example: "THE import SHALL use at most 256 MB of memory for 1 million rows"
  - word: "performant"
    example: "THE search SHALL return 20 results within 300 ms at p95 over 10 million records"
  - word: "scalable"
    example: "THE service SHALL serve 1000 requests per second on two instances"
  - word: "robust"
    example: "IF the database is unreachable THEN THE service SHALL retry 3 times, 1 s apart, then answer 503"
  - word: "reliable"
    example: "THE worker SHALL deliver each event at least once, and retry a failure for 24 hours"
  - word: "secure"
    example: "THE endpoint SHALL refuse a request without a valid session with 401"
  - word: "user-friendly"
    example: "WHEN a form field is invalid THE form SHALL name the field and the rule it breaks"
  - word: "intuitive"
    example: "THE first screen SHALL offer the three most used actions as buttons"
  - word: "easy"
    example: "THE setup SHALL take one command and no edited file"
  - word: "simple"
    example: "THE config SHALL need at most 3 keys for the default case"
  - word: "seamless"
    example: "WHEN the token expires THE client SHALL renew it without a second sign-in"
  - word: "flexible"
    example: "THE report SHALL accept a date range, a team filter and a CSV or JSON format"
  - word: "appropriate"
    example: "IF the input is over 10 MB THEN THE upload SHALL refuse it with 413"
  - word: "reasonable"
    example: "THE cache SHALL keep an entry for 10 minutes"
  - word: "as needed"
    example: "WHEN the queue holds over 100 jobs THE pool SHALL add a worker, up to 8"
  - word: "if possible"
    example: "IF the preview fails THEN THE upload SHALL still store the file and log the failure"
  - word: "as soon as possible"
    example: "WHEN a payment settles THE ledger SHALL post it within 60 s"
  - word: "etc."
    example: "THE export SHALL include the name, email and created date (name every field)"
  - word: "and so on"
    example: "THE filter SHALL accept status, owner and tag (name every value)"
  - word: "minimal"
    example: "THE bundle SHALL stay under 150 KB gzipped"
  - word: "optimal"
    example: "THE scheduler SHALL place a job on the node with the most free memory"
  - word: "high availability"
    example: "THE service SHALL keep 99.9% monthly uptime"
