# Figentra Flow file contract:
# Purpose: the stackra preset's third-party skills (STA-1945 FR-8, D1). Each entry names its source and licence; one
#          that `fflow sync` installs also pins a full commit id (`version`) and the `treeDigest` of its folder there
#          (`digest`), and lands in the git-ignored `.agents/skills/.vendor/`. A licence outside MIT, Apache-2.0, BSD
#          and ISC needs the owner's `ownerEntry`. A `machineOnly` skill is never installed or pinned: `fflow doctor`
#          names its source. `fflow check` refuses a committed copy, except one whose licence lets a repository
#          carry it (MIT, Apache-2.0, BSD, ISC, an `ownerEntry`, or "the owner's own") at `.agents/skills/<id>`
#          with no other front-matter `name` (STA-2131). HeroUI Pro's and Remotion's never: their licences do not
#          allow redistribution.
# Owner: the owner (D1); a change here is a preset change, adopted with `fflow update`.
# Secrets: none; the sources are public or the owner's own.
skills:
  # HeroUI Pro's: the HeroUI Pro License Agreement, internal use only (D1).
  - id: heroui-react-pro
    source: "HeroUI Pro (heroui.pro), under the owner's licence"
    licence: "HeroUI Pro License Agreement"
    machineOnly: true
  - id: heroui-pro-design-taste
    source: "HeroUI Pro (heroui.pro), under the owner's licence"
    licence: "HeroUI Pro License Agreement"
    machineOnly: true
  # Remotion's: remotion-dev/skills declares no licence; Remotion is under its own company licence (D1).
  - id: remotion-best-practices
    source: "github:remotion-dev/skills"
    licence: "none declared (Remotion company licence)"
    machineOnly: true
  - id: remotion-create
    source: "github:remotion-dev/skills"
    licence: "none declared (Remotion company licence)"
    machineOnly: true
  - id: remotion-docs
    source: "github:remotion-dev/skills"
    licence: "none declared (Remotion company licence)"
    machineOnly: true
  - id: remotion-markup
    source: "github:remotion-dev/skills"
    licence: "none declared (Remotion company licence)"
    machineOnly: true
  - id: remotion-render
    source: "github:remotion-dev/skills"
    licence: "none declared (Remotion company licence)"
    machineOnly: true
  - id: remotion-studio
    source: "github:remotion-dev/skills"
    licence: "none declared (Remotion company licence)"
    machineOnly: true
  # oakoss's: the front matter says MIT, but oakoss/agent-skills ships no licence file, so there is no grant and no
  # copy is committed (leader, STA-2097, 2026-11-09).
  - id: changesets
    source: "github:oakoss/agent-skills"
    licence: "none shipped (front matter says MIT)"
    machineOnly: true
  # The owner's own Claude skills, the 13 of the local library: that is their recorded source (D1).
  - id: svg-logo-designer
    source: "the owner's skill library (~/.claude/skills)"
    licence: "the owner's own"
